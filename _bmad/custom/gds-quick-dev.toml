# Team override for gds-quick-dev, merged over the installer-owned
# .claude/skills/gds-quick-dev/customize.toml (the .agents copy is identical).
# Arrays append to the base list.
#
# Quick-dev runs its own review in step-04-review.md (planned route) or
# step-oneshot.md (one-shot route). On a hot-path change that loop does not
# replace the review skill, and neither classify step may reject a hot-path
# finding that is not a false positive. The checklist lives in
# docs/performance/hot-path-review.md; each fact cites it as "section N (Name)".
# src/tests/hotPathReview.guard.test.ts checks this hook stays in place.

[workflow]

persistent_facts = [
  "Hot-path review: when the change touches a surface in section 1 (When it applies) of docs/performance/hot-path-review.md, read that page before step-04-review.md (or step-oneshot.md on the one-shot route). In the Classify step of either file, a hot-path finding is never reject unless section 7 (Resolving a finding) calls it a false positive; otherwise it is patch or defer by section 7, and on the step-04-review.md route intent_gap and bad_spec still apply as usual. A finding section 7 calls always patch stays patch. If the author wants to defer it instead, treat it as intent_gap on step-04-review.md and HALT for the human on step-oneshot.md, until the repository owner accepts the deferral as section 7 describes. This loop does not replace the deep review: the change still goes through /gds-code-review or /bmad-code-review, whichever CLAUDE.md names, before merge.",
]
