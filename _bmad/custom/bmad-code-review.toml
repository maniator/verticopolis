# Team override for bmad-code-review, merged over the installer-owned
# .claude/skills/bmad-code-review/customize.toml (the .agents copy is identical).
# Arrays append to the base list; on_complete replaces the empty base.
# A personal bmad-code-review.user.toml merges over this file the same way, so an
# on_complete there replaces this one: keep the hot-path line in it.
#
# It wires in the hot-path complexity review. The checklist itself lives in
# docs/performance/hot-path-review.md; change the rule there, and keep this
# file to the hooks that make the review apply it. Each fact cites the page as
# "section N (Name)" so the guard test can match it to the heading.
# src/tests/hotPathReview.guard.test.ts checks these hooks stay in place.

[workflow]

persistent_facts = [
  "file:{project-root}/docs/performance/hot-path-review.md",
  "Hot-path gate: at the CHECKPOINT of steps/step-01-gather-context.md, check the changed paths in {diff_output} against the table in section 1 (When it applies) of docs/performance/hot-path-review.md; for any other changed production file under src/ or engine-rs/, search its importers (in the base commit too, for a deleted file) to see whether an entry point in section 2 (Frequencies and sizes) reaches it. What section 1 (When it applies) lists as not hot paths (tests, test fixtures, the engine's command-line tools, docs, code that runs once per session) does not count, even inside a listed path. If step 6 narrowed {diff_output} to one file group, run this gate on the whole diff first and name the groups that need the Hot-Path Auditor. Say in the checkpoint summary whether this run includes the Hot-Path Auditor layer.",
  "Hot-Path Auditor layer: when the gate says yes, steps/step-02-review.md launches a fourth parallel subagent beside the other layers, with {diff_output} and read access to the repository at the diff's head commit, using the prompt in section 9 (How the review tools apply it) of docs/performance/hot-path-review.md. If subagents are unavailable, write a fourth prompt file for it with the others. Its output is the record table from section 6 (Recording the review), in Markdown, plus a Markdown list of findings. When the hot-path part of the diff is a port, rewrite or addition of more than about 1,000 lines, launch one Hot-Path Auditor per module or chunk as section 6 (Recording the review) describes, each given its chunk plus the whole diff for context, each returning its table and the appendix lines for its changed functions. Output without that table, without a row for each of HP-1 to HP-12, or without the appendix lines a large diff needs counts as a failed layer: run that auditor once more, and if it fails again append Hot-Path Auditor to {failed_layers}.",
  "Hot-path triage: steps/step-03-triage.md normalizes the Hot-Path Auditor's list like the Blind Hunter's prose, with source hotpath (kept in merged sources), and classifies every hot-path finding from any layer by section 7 (Resolving a finding): patch or defer, never dismissed for being pre-existing, for matching the TypeScript or for sitting outside the diff; dismiss only for a false positive as section 7 defines it. A finding section 7 calls always patch is patch; if the PR author wants to defer it instead, it is decision_needed until the repository owner (maniator) answers, in spec mode and no-spec mode alike. In steps/step-04-present.md no choice dismisses, defers or skips an always-patch finding without the owner's acceptance recorded as section 7 describes, whether it comes up while resolving decision_needed findings or while walking through patches; a session user who is not the owner cannot give it, and the finding stays patch. While it waits, handle the other findings and report it as pending. A defer cites an issue and backlog row; a pre-existing finding in code the PR does not change or only moves may instead cite the open issue and item that already list it, as section 7 (Resolving a finding) allows. For hot-path findings this fact overrides two base rules in steps/step-03-triage.md: its no-spec rule that turns decision_needed into patch or defer, and its definition of defer as pre-existing only (a hot-path finding the change causes may be deferred under section 7, except an always-patch one). If the Hot-Path Auditor is in {failed_layers}, do not state a clean review at step-03 even when no findings remain.",
  "Hot-path record: steps/step-04-present.md prints the table from section 6 (Recording the review), with the appendix a large diff needs and the findings, before any choice is offered; the one line for a diff with no hot-path surface replaces it only when that covers the whole diff of the PR. The record names the commit reviewed and the part of the diff it covers. When the change has a PR, post the record on it as a comment in every round, then edit that comment to fill in the resolution column once the fixes are in; with no PR yet, save it under {implementation_artifacts} and post it when the PR opens. If the Hot-Path Auditor is in {failed_layers}, say that the deep review is incomplete and does not count, do not announce a clean review, and do not set the story status to done.",
]

activation_steps_append = [
  "Read sections 1, 6, 7 and 9 of docs/performance/hot-path-review.md now. The hot-path gate itself runs later, at the step-01 checkpoint, once the diff exists.",
]

on_complete = "Before closing, confirm the hot-path record: the table from section 6 (Recording the review) of docs/performance/hot-path-review.md with every HP item filled and, for a port, rewrite or addition over about 1,000 hot-path lines, an appendix line for every changed function; or one line saying the whole diff touches no hot-path surface. Every hot-path defer names its issue, and an always-patch finding is deferred only with the owner's acceptance. When the change has a PR, the record with its resolutions is posted there as a comment; otherwise it is saved for the PR. Without that record this run does not count as the deep review, and you say so."
