# Team override for bmad-code-review, merged over the installer-owned
# .claude/skills/bmad-code-review/customize.toml (the .agents copy is identical).
# Arrays append to the base list; on_complete replaces the empty base.
# A personal bmad-code-review.user.toml merges over this file the same way, so an
# on_complete there replaces this one: keep the hot-path line in it.
#
# It wires in the hot-path complexity review. The checklist itself lives in
# docs/performance/hot-path-review.md; change the rule there, and keep this
# file to the hooks that make the review apply it. Each fact cites the page as
# "section N (Name)" so the guard test can match it to the heading.
# src/tests/hotPathReview.guard.test.ts checks these hooks stay in place.

[workflow]

persistent_facts = [
  "file:{project-root}/docs/performance/hot-path-review.md",
  "Hot-path gate: at the CHECKPOINT of steps/step-01-gather-context.md, check the changed paths in {diff_output} against the table in section 1 (When it applies) of docs/performance/hot-path-review.md; for any other changed production file under src/ or engine-rs/, search its importers (in the base commit too, for a deleted file) to see whether an entry point in section 2 (Frequencies and sizes) reaches it. What section 1 (When it applies) lists as not hot paths by path (tests, test fixtures, the engine's command-line tools, docs) does not count, even inside a listed path. Code that runs once per session is not settled here, since only the auditor's caller trace can show it, so a changed file on a listed path still says yes. If instruction 6 of steps/step-01-gather-context.md narrowed {diff_output} to one file group, run this gate first on the whole diff, rebuilt from the source chosen in instruction 3, and name the groups that need the Hot-Path Auditor. Say in the checkpoint summary whether this run includes the Hot-Path Auditor layer.",
  "Hot-Path Auditor layer: when the gate says yes, steps/step-02-review.md launches a fourth parallel subagent beside the other layers, using the prompt in section 9 (How the review tools apply it) of docs/performance/hot-path-review.md with <commit> replaced by the head commit's SHA and the repository's path added. Give it {diff_output} and read access to the repository at that commit; for a diff of staged or uncommitted changes it reads the working tree, and the record names the commit as that SHA plus uncommitted changes. If subagents are unavailable, write a fourth prompt file for it with the others, with the same substitutions. Its output is the record table from section 6 (Recording the review), in Markdown, plus a Markdown list of findings. When the hot-path part of the diff is a port, rewrite, move, addition or removal of more than about 1,000 changed lines, counted over the whole diff even when this run covers one file group, launch one Hot-Path Auditor per module or chunk as section 6 (Recording the review) describes, each given its chunk, the list of every changed file and function in the whole diff, and the same repository access, each returning its table and the appendix lines for its changed functions, then merge them into one record. Output without that table, without a row for each of HP-1 to HP-12, with a row whose What was checked is empty or only says checked or fine, with an n/a that gives no reason, or without the appendix lines a large diff needs counts as a failed layer, and so does a timeout: run that auditor once more, and if it fails again append Hot-Path Auditor to {failed_layers}.",
  "Hot-path triage: steps/step-03-triage.md normalizes the Hot-Path Auditor's list like the Blind Hunter's prose, with source hotpath (kept in merged sources), and classifies every hot-path finding from any layer by section 7 (Resolving a finding): patch or defer, never dismissed for being pre-existing, for matching the TypeScript or for sitting outside the diff; dismiss only for a false positive as section 7 defines it, which never applies to an always-patch finding. A finding section 7 calls always patch is patch, and when the PR author wants to defer it, it stays patch, marked pending the owner: only the repository owner (maniator) can accept that deferral, recorded as section 7 describes, in spec mode and no-spec mode alike. In steps/step-04-present.md no choice dismisses, defers or skips an always-patch finding without that acceptance, whether it comes up while resolving decisions or while walking through patches; a session user who is not the owner cannot give it, and neither can another agent passing it on. A finding pending the owner is not a decision_needed finding, so the step-04 rule that decisions come before patches does not hold up the rest: handle the other findings, and list the pending one in the summary and the record. A hot-path defer needs a tracking issue and a curated backlog row as section 7 (Resolving a finding) requires, or, for a pre-existing finding in code the PR does not change or only moves, the open issue and item that already list it; a bullet in the Deferral inbox alone is not enough. For hot-path findings this fact overrides the definition of defer in steps/step-03-triage.md as pre-existing only: a hot-path finding the change causes may be deferred under section 7, except an always-patch one. If the Hot-Path Auditor is in {failed_layers}, do not state a clean review at step-03 even when no findings remain.",
  "Hot-path record: steps/step-04-present.md prints the table from section 6 (Recording the review), with the appendix a large diff needs and the findings, before any choice is offered; the one line for a diff with no hot-path surface replaces it only when that covers the whole diff of the PR. The record names the commit reviewed and the part of the diff it covers; a run over one file group names its group, and the group records together must cover the whole diff. When the change has a PR, post the record on it as a comment in every round, then edit that comment to fill in the resolution column once the fixes are in; with no PR yet, save it under {implementation_artifacts} and say in the summary that whoever opens the PR posts it there. Each defer in the record names its issue. If the Hot-Path Auditor is in {failed_layers}, say that the deep review is incomplete and does not count, do not announce a clean review, and do not set the story status to done.",
]

activation_steps_append = [
  "Read sections 1, 6, 7 and 9 of docs/performance/hot-path-review.md now. The hot-path gate itself runs later, at the step-01 checkpoint, once the diff exists.",
]

on_complete = "Before closing, confirm the hot-path record: the table from section 6 (Recording the review) of docs/performance/hot-path-review.md with every HP item filled and, for a port, rewrite, move, addition or removal of more than about 1,000 changed hot-path lines across the whole diff, an appendix line for every changed or removed function; or one line saying the whole diff touches no hot-path surface. A run over one file group confirms its group's record and names the groups still to review. Every hot-path defer names its issue and backlog row, and an always-patch finding is deferred only with the owner's acceptance; one still pending the owner is listed as pending. When the change has a PR, the record with its resolutions is posted there as a comment; otherwise it is saved for whoever opens the PR. Without that record this run does not count as the deep review, and you say so."
