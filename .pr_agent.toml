# Repository-specific PR-Agent policy. Credentials belong in Actions secrets.
[config]
model = "gpt-6.1-sol"
fallback_models = ["gpt-6-luna"]
# Allow larger per-call review context.
max_model_tokens = 64000
# Include token usage and estimated API cost in review comments.
output_run_details = true
output_run_cost = true
restricted_mode = true
repo_context_files = ["AGENTS.md"]
repo_context_from_default_branch = true
# When explicitly requesting ticket-compliance analysis, count only explicit
# completion links as bare issue references. Full issue URLs may also match.
# TOML single quotes keep the regex backslashes intact.
description_issue_regex = '(?i)(?:fixes|closes|resolves)\s+#(\d+)'
# Never infer an entire ticket's acceptance criteria from a numbered branch.
extract_issue_from_branch = false

[pr_reviewer]
# Process larger PRs in multiple calls to reduce omitted files.
enable_large_pr_chunking = true
max_number_of_calls = 3
# Adds a reviewer-facing prioritized file list; it does not change the diff ordering.
require_priority_files = true
# Large tracking issues are routinely implemented across several PRs. Automatic
# full-ticket scoring falsely flags correctly scoped preparatory PRs as partial.
# Owners can opt in for a full-scope PR with
# /review --pr_reviewer.require_ticket_analysis_review=true
require_ticket_analysis_review = false
# Make actual diff omissions visible, rather than inferring them from a model's text.
enable_review_coverage_footer = true
require_tests_review = true
require_security_review = true
require_merge_recommendation = true
require_failure_modes = true
inline_key_issues = true
num_max_findings = 5
persistent_comment = true
persistent_finding_state = true
extra_instructions = "Focus on correctness, Rust/WASM engine authority, save compatibility, deterministic behavior, performance on simulation hot paths, meaningful regression tests, and CI coverage. For parity-related PRs, prioritize the parity register, Rust/WASM code, its guards, and conformance tests. Review only the scope the PR claims to deliver: linked parent tickets and explicitly deferred work are not requirements for a preparatory PR. A file excluded by configuration or context budget is NOT an absent file; report exact coverage limits and recommend manual verification, never claim it is missing from the repository. Treat generated golden snapshots as CI-checked evidence; review their generators, assertions, and deliberate updates. Give a concrete actionable finding with file and line evidence for each claimed code defect. If no important defects or risks are found, use no_concerns_found rather than needs_review solely for routine pending CI or excluded generated data. This review is generated by PR-Agent, not the repository owner."

[pr_code_suggestions]
committable_code_suggestions = true
focus_only_on_problems = true
suggestions_score_threshold = 7
num_code_suggestions_per_chunk = 4
persistent_comment = true
extra_instructions = "Offer focused, directly applicable code fixes and concise reasons. Preserve behavior, test coverage, and existing architecture. Do not generate broad formatting-only rewrites."

[pr_questions]
use_conversation_history = true
resolve_threads = false

# Generated golden snapshots are pinned and validated by dedicated tests.
# Exclude their large outputs from AI diff context so generators, assertions,
# parity guards, and source changes get reviewed. These files remain in GitHub
# diffs and CI; reviewers should inspect intentional golden changes separately.
[ignore]
glob = [
  "src/tests/goldens/card-text/*.vctower",
  "src/tests/goldens/card-text/*.json",
  "src/tests/goldens/frame-days.json",
  "src/tests/goldens/port-edits.json",
]
