# Repository-specific PR-Agent policy. Credentials belong in Actions secrets.
[config]
model = "gpt-6.1-sol"
fallback_models = ["gpt-6-luna"]
# Allow larger per-call review context.
max_model_tokens = 64000
# Include token usage and estimated API cost in review comments.
output_run_details = true
output_run_cost = true
restricted_mode = true
repo_context_files = ["AGENTS.md"]
repo_context_from_default_branch = true
# Match explicit completion claims in descriptions only. PR-Agent also scans
# PR titles for bare #N issue links, independent of this regex.
# TOML single quotes keep the regex backslashes intact.
description_issue_regex = '(?i)(?:fixes|closes|resolves)\s+#(\d+)'
# A numbered source branch may reference a tracking issue without completing it.
# Do not infer tickets from branch names, including in opt-in ticket reviews.
extract_issue_from_branch = false

[pr_reviewer]
# Allow more chunks to review large source/test diffs; this can cost more.
enable_large_pr_chunking = true
max_number_of_calls = 5
enable_review_coverage_footer = true
# Staged PRs often link a parent ticket without completing it. The automatic
# ticket-grade compares the entire issue and mislabels legitimate slices.
# For a full-ticket PR, opt in with:
# /review --pr_reviewer.require_ticket_analysis_review=true
require_ticket_analysis_review = false
# Adds a reviewer-facing prioritized file list; it does not change the diff ordering.
require_priority_files = true
require_tests_review = true
require_security_review = true
require_merge_recommendation = true
require_failure_modes = true
inline_key_issues = true
num_max_findings = 5
persistent_comment = true
persistent_finding_state = true
extra_instructions = """
Focus on correctness, Rust/WASM engine authority, save compatibility, deterministic behavior, simulation hot-path performance, meaningful regression tests, and CI coverage. For parity PRs, prioritize the register, guards, engine implementation, and conformance tests.
Flag a unit test (*.test.ts) that starts a real engine or replays recorded engine answers: unit tests mock the engine port with vi.fn spies, use JSON fixtures only as canned answers, and assert the calls made and what the code did with them; real-engine checks belong in *.integration.test.ts or Rust tests. Flag a test whose assertions cannot fail when the code it names breaks (only 'does not throw' under a behavior name, or a mock's own canned answer asserted back).
Assess the intended scope of THIS PR. A linked parent issue or planned follow-up is context, not a promise to finish the whole issue.
An unread or omitted patch is not evidence that a changed file, golden, or test is absent. Cross-check GitHub's complete changed-file list before declaring a file absent; state incomplete coverage explicitly rather than inventing missing work or repeating generic verification demands.
Only report actionable code findings with concrete file/line evidence. Do not treat pending CI as failed CI, or a test wired into CI as an executed passing test.
Reserve 'changes required' for actual blocking defects; use 'needs review' only for a specific risk or incomplete inspection, and explain which. No defects found is not a claim CI passed or a merge approval.
The review is from PR-Agent, not the repository owner.
"""

[pr_code_suggestions]
committable_code_suggestions = true
focus_only_on_problems = true
suggestions_score_threshold = 7
num_code_suggestions_per_chunk = 4
persistent_comment = true
extra_instructions = "Offer focused, directly applicable code fixes and concise reasons. Preserve behavior, test coverage, and existing architecture. Do not generate broad formatting-only rewrites."

[pr_questions]
use_conversation_history = true
resolve_threads = false

# Large serialized tower snapshots and card-text golden outputs are checked by
# dedicated fixture/conformance tests. Keep them out of PR-Agent's context so
# source, register, guard and test changes receive more attention.
[ignore]
glob = [
  "src/tests/goldens/card-text/*.vctower",
  "src/tests/goldens/card-text/*.json",
  # Generated golden data is validated by the Rust and TypeScript tests.
  # Review the generator and test logic instead of spending context on JSON.
  "src/tests/goldens/frame-days.json",
  "src/tests/goldens/port-edits.json",
  # The fuzz corpus goldens: native replay records, pinned by
  # `fuzz-corpus --update` and held to the engine by the fuzz-corpus job.
  "conformance/fuzz-corpus/goldens/*.json",
]
