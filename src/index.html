<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verticopolis: a browser-native SimTower clone</title>
    <meta name="description" content="A browser-native SimTower clone: build a vertical metropolis floor by floor." />
    <!-- PWA: theme + iOS install affordances (the manifest link is injected by vite-plugin-pwa). -->
    <meta name="theme-color" content="#000080" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Verticopolis" />
    <link rel="icon" href="./favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="a11y-live" class="visually-hidden" aria-live="polite" role="status"></div>
    <div id="app">
      <header id="topbar">
        <div class="brand">🏙️ <span>VERTICO<b>POLIS</b></span></div>
        <div id="status">
          <div class="stat" title="Star rating">
            <span class="label">RATING</span>
            <span id="stat-star" class="value stars">★</span>
          </div>
          <div class="stat stat-date" title="Date">
            <span class="label">DATE</span>
            <span id="stat-date" class="value">1st WD/1Q/1st Year</span>
          </div>
          <div class="stat" title="Time of day">
            <span class="label">TIME</span>
            <span id="stat-time" class="value">Mon 07:00</span>
          </div>
          <div class="stat" title="Cash on hand">
            <span class="label">FUND</span>
            <span id="stat-money" class="value money">$2,000,000</span>
          </div>
          <div class="stat" title="Total population">
            <span class="label">POP</span>
            <span id="stat-pop" class="value">0</span>
          </div>
          <div class="stat" title="Elevator traffic / congestion">
            <span class="label">TRAFFIC</span>
            <span id="traffic" class="value" aria-live="polite" aria-label="Traffic: Smooth"
              ><span id="traffic-glyph" aria-hidden="true">▮▯▯▯</span> <span id="traffic-label">Smooth</span><span id="traffic-floor" aria-hidden="true"></span></span>
          </div>
        </div>
        <div id="speed">
          <button class="btn" data-speed="0" title="Pause">⏸</button>
          <button class="btn active" data-speed="1" title="Slow">▶</button>
          <button class="btn" data-speed="2" title="Medium">▶▶</button>
          <button class="btn" data-speed="3" title="Fast">▶▶▶</button>
          <button class="btn" id="btn-undo" title="Undo (Ctrl+Z)" aria-label="Undo">↩</button>
          <button class="btn" id="btn-redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↪</button>
          <button class="btn" id="audio-toggle" title="Toggle sound">🔊</button>
          <button class="btn" id="panel-toggle" title="Show/hide panels">☰</button>
          <button class="btn" id="btn-update" title="An update is ready. Tap to review." aria-label="An update is ready. Tap to review." hidden>↻ Update</button>
        </div>
      </header>

      <main id="main">
        <aside id="palette" class="win docked">
          <div class="win-title">Tools</div>
          <div class="palette-scroll" id="palette-scroll"></div>
        </aside>

        <section id="stage">
          <canvas id="view"></canvas>
          <div id="hint" class="win">Drag to pan · Scroll to zoom · Click to build · Inspect tool to edit a room</div>
          <div id="inspector" class="win hidden"></div>
          <div id="editor" class="win hidden"></div>
          <div id="toast-wrap" role="status" aria-live="assertive" aria-atomic="false"></div>
        </section>

        <aside id="sidebar" class="win docked">
          <button id="panel-close" class="panel-close btn" title="Close panels" aria-label="Close panels">✕</button>
          <div class="panel win docked">
            <h3>Selected</h3>
            <div id="tool-info">Pick a facility from the left.</div>
          </div>
          <div class="panel win docked">
            <h3>Tower</h3>
            <input id="tower-name" class="name-input field" maxlength="28" />
            <div id="tower-stats" class="kv"></div>
            <button id="btn-stats" class="wide-btn btn">📊 Full Statistics</button>
            <label class="overlay-picker" title="Tint every floor by a live metric, like the original's evaluation maps">
              <span>🗺️ Map overlay</span>
              <select id="overlay-mode" class="field">
                <option value="">Off</option>
                <option value="congestion">Congestion</option>
                <option value="occupancy">Occupancy</option>
                <option value="satisfaction">Satisfaction</option>
              </select>
            </label>
          </div>
          <div class="panel grow win docked">
            <h3>Bulletin</h3>
            <div id="log" class="well" role="log" aria-live="polite" aria-label="Tower bulletin"></div>
          </div>
          <div class="panel win docked">
            <h3>Game</h3>
            <div class="btn-row">
              <button class="btn" id="btn-save">Quick Save</button>
              <button class="btn" id="btn-load">Saves…</button>
            </div>
            <div class="btn-row">
              <button class="btn" id="btn-settings">⚙️ Settings</button>
            </div>
            <div class="btn-row">
              <button class="btn" id="btn-new">New Tower</button>
              <button class="btn" id="btn-help">Help</button>
            </div>
          </div>
        </aside>
      </main>
      <div id="scrim" aria-hidden="true"></div>
    </div>

    <!-- accept is set by UI.openImport from the shared TOWER_FILE_EXT constant. -->
    <input id="import-file" type="file" hidden />
    <dialog id="modal"></dialog>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
