[package]
name = "verticopolis-engine"
version = "0.1.0"
edition = "2021"
publish = false
description = "The Verticopolis simulation engine, ported from src/engine and checked against conformance/"

[lib]
name = "verticopolis_engine"
path = "src/lib.rs"

[[bin]]
name = "conformance"
path = "src/bin/conformance.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
sha2 = "0.11.0"
ryu = "1.0.22"
indexmap = "2.12.0"
flate2 = "1.1.5"
base64 = "0.22.1"

[profile.release]
debug = 1
