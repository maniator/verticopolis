[package]
name = "verticopolis-engine"
version = "1.30.2"
edition = "2021"
rust-version = "1.97"
license = "MIT"
description = "The Verticopolis simulation engine: every rule, command, save format and gameplay event of the tower game"
repository = "https://github.com/maniator/verticopolis"
homepage = "https://docs.verticopolis.com/crate/"
documentation = "https://docs.verticopolis.com/rust/verticopolis_engine/"
# The short page crates.io shows; the full guide is the docs site's crate page.
readme = "CRATE_README.md"
keywords = ["simulation", "game", "tower", "simtower", "wasm"]
categories = ["game-engines", "simulation", "wasm"]
# What crates.io receives: the library, its binaries and the data they compile
# in, with the license (a copy of the repository's, held equal by
# src/tests/engineCrateReadme.guard.test.ts). The tests, the consumer crate
# and the contributors' docs stay in the
# repository; they read the conformance suite, which is not packaged yet
# (#893). engine-rs.yml packages the crate on every engine change and builds
# the consumer against the packaged copy.
include = ["src/**", "Cargo.toml", "Cargo.lock", "CRATE_README.md", "CHANGELOG.md", "LICENSE"]
# Every binary is declared below with the conformance feature it needs; none
# is found by its path alone (tests/independence.rs holds this).
autobins = false

[lib]
name = "verticopolis_engine"
path = "src/lib.rs"
# An rlib for the referee and the tests; scripts/wasm-build.ts asks for the
# cdylib the WASM binding needs with `cargo rustc --crate-type cdylib`, so the
# native build links nothing extra.

[[bin]]
name = "conformance"
path = "src/bin/conformance.rs"
required-features = ["conformance"]

[[bin]]
name = "crowd_scale"
path = "src/bin/crowd_scale.rs"
required-features = ["conformance"]

[[bin]]
name = "dump"
path = "src/bin/dump.rs"
required-features = ["conformance"]

[[bin]]
name = "fuzz"
path = "src/bin/fuzz.rs"
required-features = ["conformance"]

[[bin]]
name = "tdt"
path = "src/bin/tdt.rs"
required-features = ["conformance"]

[[bin]]
name = "tdt_fixtures"
path = "src/bin/tdt_fixtures.rs"
required-features = ["conformance"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.11.0"
ryu = "1.0.22"
indexmap = "2.12.0"
flate2 = "1.1.5"
base64 = "0.22.1"
# The JavaScript binding, built only for wasm32 with `--features wasm`; the
# CLI that generates the glue must be the same version (see engine-rs/README).
wasm-bindgen = { version = "=0.2.129", optional = true }

[features]
wasm = ["dep:wasm-bindgen"]
# The binding's tier 3 ops (raw edits, scripted events, seeding: the list is
# `src/engineBinding/exportTiers.ts`) for the test suites and the screenshot
# and e2e tooling. The shipped game's package is built without it, so those
# ops are not in the player's binary (#1057).
tooling = ["wasm"]
# The conformance harness (tier 2 in API.md): the scenario runner, the .TDT
# referee and the binaries, which read the suite's files. Off by default, so a
# host links no file reads; the referee and a host that replays the lock turn
# it on (`cargo run --features conformance --bin conformance`).
conformance = []

[profile.release]
debug = 1
