name: 🐛 Bug report
description: Something in the game behaves incorrectly or crashes.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please check the [live build](https://verticopolis.com)
        first, since the issue may already be fixed. The version line on the title screen (also in
        Settings and in Help, under About) names the game's version and the Rust engine's version.
  - type: input
    id: version
    attributes:
      label: Build version
      description: The whole version line from the title screen, Settings or Help's About section.
      placeholder: "v3.1.0 · Rust engine 1.25.0 (1a2b3c4d5e6f)"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Engine diagnostics
      description: Optional. In Help, open About and press Copy diagnostics, then paste the result here. It names the engine build, the package and source hashes this page expects next to the ones the engine reports, and where and why the engine stopped if it did. It helps most when the game stopped or reloaded after an engine crash.
      render: shell
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
      placeholder: I built an express elevator and the shaft pool count went negative...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: >-
        How can we reproduce it? A saved tower helps. GitHub does not accept `.vctower` files, so
        drag in the crash-report `.zip` if the game gave you one (it already holds your tower), or
        put the `.vctower` export in a `.zip`, or rename it to end in `.txt`, before attaching it.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome / Chromium
        - Firefox
        - Safari
        - Edge
        - Other (note in description)
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Desktop
        - Mobile / tablet
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Game mode
      description: Which mode was the tower founded in? You pick Classic or Modern when you start a new tower.
      options:
        - Not sure
        - Classic
        - Modern
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Paste any errors from the browser dev-tools console. This is automatically formatted as code.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked whether this still reproduces on the latest build at verticopolis.com (fork/local or older-build reports are still welcome).
        - label: I searched existing issues and this is not a duplicate.
          required: true
