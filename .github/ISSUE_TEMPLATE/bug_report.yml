name: 🐛 Bug report
description: Something in the game behaves incorrectly or crashes.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please check the [live build](https://verticopolis.com)
        first, since the issue may already be fixed. The build version is shown on the splash screen,
        and the line also says "Rust engine" when the Rust engine is running.
  - type: input
    id: version
    attributes:
      label: Build version
      description: The version line shown on the splash screen (e.g. 1.1.0). If it also names an engine, include the whole line.
      placeholder: "1.1.0"
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      description: Which simulation engine was running? Rust/WASM is the Rust engine, which the game calls the "Rust engine" on the version line on the splash screen, in Settings and in Help (versions before 2.47.0 called it the "WASM engine"). Choose Fallback if the game said the Rust engine stopped and it runs on the TypeScript engine now.
      options:
        - Not sure
        - Rust/WASM
        - TypeScript
        - Fallback
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: Engine diagnostics
      description: Optional. In Help, open About and press Copy diagnostics, then paste the result here. It names the engine, any fallback reason and the engine build, which the version line does not. It helps most if the game started on the TypeScript engine when you expected the Rust engine.
      render: shell
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
      placeholder: I built an express elevator and the shaft pool count went negative...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can we reproduce it? Include a saved tower export (`.vctower`) if relevant.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome / Chromium
        - Firefox
        - Safari
        - Edge
        - Other (note in description)
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Desktop
        - Mobile / tablet
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Game mode
      description: If your tower was founded with a mode picker, which mode was it? Leave as "Not sure / not applicable" if your build has no mode selector.
      options:
        - Not sure / not applicable
        - Classic
        - Modern
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Paste any errors from the browser dev-tools console. This is automatically formatted as code.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked whether this still reproduces on the latest build at verticopolis.com (fork/local or older-build reports are still welcome).
        - label: I searched existing issues and this is not a duplicate.
          required: true
