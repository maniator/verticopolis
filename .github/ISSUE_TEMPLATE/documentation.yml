name: 📚 Documentation issue
description: A README, setup or canon-reference doc, the in-game Help, or the engine docs site is wrong, unclear, or missing.
labels: ["documentation", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        For docs only: wrong setup steps, a broken script, unclear wording, a
        canon reference that contradicts `PARITY.md`, a How to play section in the
        game's Help that no longer matches the game, or a page on the
        [engine docs site](https://docs.verticopolis.com). For gameplay bugs use the
        Bug report; for parity discrepancies use the SimTower parity report.
  - type: input
    id: location
    attributes:
      label: Where is it?
      description: File and section, a Help section, or a link (e.g. README.md → "Play", Help → "Going further", a docs.verticopolis.com page).
      placeholder: README.md → Play
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing?
      description: Quote the current text if it's an error, or describe what's absent.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: What should it say instead? A PR is welcome too.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
