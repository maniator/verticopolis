name: 🏙️ SimTower parity report
description: Verticopolis behaves differently from the 1994 original SimTower.
labels: ["parity", "classic", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Verticopolis aims to play like **SimTower (1994)**. Use this form when a number, a rule or a behavior in the game is different from the original. Please say where you saw the original's behavior so we can check it.

        **⚠️ This is for Classic towers only.** A tower is founded as **Classic** (plays like 1994) or **Modern** (adds things the original couldn't do). Differences in a **Modern** tower are on purpose, so use a **Feature request** to suggest a change there.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Build caps / facility limits
        - Transport (elevators, stairs, escalators)
        - Economy (rent, income, costs)
        - Tenants / population / star ratings
        - Events (fire, terrorism, etc.)
        - 1994 .TDT save import / export
        - Other
    validations:
      required: true
  - type: textarea
    id: original
    attributes:
      label: Original SimTower behavior
      description: What does the 1994 original do? Cite a source (manual, FAQ, video, screenshot).
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current Verticopolis behavior
      description: What does Verticopolis do instead? Include the whole version line from the title screen and a repro if possible. For economy or population divergences, attach your tower so we can reproduce the exact state. GitHub does not accept `.vctower` files, so put the export in a `.zip`, or rename it to end in `.txt`, before attaching it. A `.TDT` file needs a `.zip` too.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source / reference
      description: Link or citation backing the original's behavior.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: This is about a **Classic**-mode tower (Modern-mode differences are intentional; use a Feature request for those).
          required: true
        - label: I checked the [list of known differences](https://verticopolis.com/help/differences/) and this one is not on it as intentional.
          required: true
        - label: I searched existing issues and this is not a duplicate.
          required: true
