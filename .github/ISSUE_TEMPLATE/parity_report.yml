name: 🏙️ SimTower parity report
description: Verticopolis behaves differently from the 1994 original SimTower.
title: "[Parity]: "
labels: ["parity", "classic"]
body:
  - type: markdown
    attributes:
      value: |
        Verticopolis aims to faithfully recreate **SimTower (1994)**. Use this template when a
        number, rule, or behavior diverges from the original. Canon values (build caps, transport
        pooling, economy math) live in `src/engine/facilities.ts` and `PARITY.md` — please cite a
        source for the original's behavior so we can verify it.

        **⚠️ Parity only applies to Classic-mode towers.** Towers can be founded in **Classic**
        (faithful to 1994) or **Modern** (an opt-in "what the original couldn't do" layer).
        Differences you see in a **Modern** tower are intentional and are *not* parity bugs — if
        you'd like to change or extend a Modern-mode behavior, please open a **Feature request** instead.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Build caps / facility limits
        - Transport (elevators, stairs, escalators)
        - Economy (rent, income, costs)
        - Tenants / population / star ratings
        - Events (fire, terrorism, etc.)
        - Other
    validations:
      required: true
  - type: textarea
    id: original
    attributes:
      label: Original SimTower behavior
      description: What does the 1994 original do? Cite a source (manual, FAQ, video, screenshot).
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current Verticopolis behavior
      description: What does Verticopolis do instead? Include the build version and a repro if possible.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source / reference
      description: Link or citation backing the original's behavior.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: This is about a **Classic**-mode tower (Modern-mode differences are intentional — use a Feature request for those).
          required: true
        - label: I checked PARITY.md and this divergence is not already documented as intentional.
          required: true
        - label: I searched existing issues and this is not a duplicate.
          required: true
