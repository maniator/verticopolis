name: ✨ Feature request
description: Suggest a new gameplay capability or quality-of-life improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Verticopolis is a homage to the 1994 **SimTower**. Towers are founded in one of two modes:
        **Classic** (faithful to the 1994 original) or **Modern** (an opt-in "what the original
        couldn't do" layer). New behavior that departs from the original generally belongs in
        **Modern** mode so Classic stays canon.

        **⚠️ This form is for behavior we don't have yet.** If you're reporting that an
        *already-implemented* behavior diverges from the 1994 original, use the **SimTower parity
        report** template instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what's missing or frustrating today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Describe the player-facing behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why this one is better.
  - type: dropdown
    id: mode
    attributes:
      label: Which game mode should this target?
      description: Classic must stay faithful to the 1994 original; new/expanded behavior usually belongs in Modern.
      options:
        - "Classic: restore a faithful behavior the original had that we never implemented"
        - "Modern: a new behavior the original never had"
        - Both / mode-agnostic
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
