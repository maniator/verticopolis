name: ✨ Feature request
description: Suggest a new gameplay capability or quality-of-life improvement.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Verticopolis is a homage to the 1994 **SimTower**. A tower is founded in one of two modes: **Classic** (plays like the 1994 original) or **Modern** (adds things the original couldn't do). New ideas that change how the original played usually belong in **Modern**, so Classic stays true to 1994.

        **⚠️ This form is for things the game doesn't do yet.** If something the game already has works differently from the 1994 original, use the **SimTower parity report** instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what's missing or frustrating today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Describe the player-facing behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why this one is better.
  - type: dropdown
    id: mode
    attributes:
      label: Which game mode should this target?
      description: Classic must stay faithful to the 1994 original; new/expanded behavior usually belongs in Modern.
      options:
        - "Classic: restore a faithful behavior the original had that we never implemented"
        - "Modern: a new behavior the original never had"
        - Both / mode-agnostic
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
