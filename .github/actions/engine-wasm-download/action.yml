name: Download the engine WASM package
description: >-
  Download the engine WASM package that .github/actions/engine-wasm uploaded
  earlier in this run, and check it was built from the Rust sources in this
  job's checkout (a job that checks out another ref than the uploader fails
  here instead of serving a different engine). For container jobs, which have
  no Rust toolchain to build it. Needs a checkout and Node set up first.

inputs:
  artifact-name:
    description: The run artifact .github/actions/engine-wasm uploaded.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: ${{ inputs.artifact-name }}
        path: src/public/engine

    - name: Check the package matches the sources
      shell: bash
      env:
        ARTIFACT: ${{ inputs.artifact-name }}
      run: |
        want=$(node --input-type=module -e 'import { engineSourceHash } from "./src/wasmhost/packageHash.ts"; process.stdout.write(engineSourceHash("engine-rs"))')
        built=$(node -p 'require("./src/public/engine/BUILD.json").sources')
        if [ "$built" != "$want" ]; then
          echo "::error::the engine package in $ARTIFACT was built from sources $built, but this checkout's Rust sources hash to $want"
          exit 1
        fi
        for f in verticopolis_engine.js verticopolis_engine_bg.wasm; do
          test -f "src/public/engine/$f" || { echo "::error::src/public/engine/$f is missing from $ARTIFACT"; exit 1; }
        done
