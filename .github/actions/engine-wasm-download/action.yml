name: Download the engine WASM package
description: >-
  Download the engine WASM package that .github/actions/engine-wasm uploaded
  earlier in this run, and check it was built from the Rust sources in this
  job's checkout (a job that checks out another ref than the uploader fails
  here instead of serving a different engine). For container jobs, which have
  no Rust toolchain to build it. Needs a checkout and Node set up first.

inputs:
  artifact-name:
    description: The run artifact .github/actions/engine-wasm uploaded.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact-name }}
        # The artifact holds src/public/engine/ (the player package) and
        # engine-rs/pkg-web-tooling/ (the tooling package a VC_TOOLING=1
        # build serves, #1057) at their workspace paths.
        path: .

    - name: Check the package matches the sources
      shell: bash
      env:
        ARTIFACT: ${{ inputs.artifact-name }}
      run: |
        want=$(node --input-type=module -e 'import { engineSourceHash } from "./src/wasmhost/packageHash.ts"; process.stdout.write(engineSourceHash("engine-rs"))')
        for dir in src/public/engine engine-rs/pkg-web-tooling; do
          for f in verticopolis_engine.js verticopolis_engine_bg.wasm THIRD-PARTY.json BUILD.json; do
            test -f "$dir/$f" || { echo "::error::$dir/$f is missing from $ARTIFACT"; exit 1; }
          done
          built=$(node -p "require('./$dir/BUILD.json').sources")
          if [ "$built" != "$want" ]; then
            echo "::error::$dir in $ARTIFACT was built from sources $built, but this checkout's Rust sources hash to $want"
            exit 1
          fi
        done
