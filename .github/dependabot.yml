version: 2
updates:
  # Security updates only. A limit of 0 turns off routine version-update PRs
  # without affecting security updates, which have their own limit. The group
  # rolls every npm security fix into one PR per run, so fixes land together
  # instead of as separate lockfile PRs that conflict with each other.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # Rebase open Dependabot PRs automatically when they conflict with main.
    # This is the default, set here so it is not turned off by accident.
    # Dependabot still stops rebasing a PR once it has been open 30 days.
    rebase-strategy: auto
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
