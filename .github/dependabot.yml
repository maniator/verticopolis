version: 2
updates:
  # Security updates only. A limit of 0 turns off routine version-update PRs
  # without affecting security updates, which have their own limit. The group
  # rolls every npm security fix into one PR per run, so fixes land together
  # instead of as separate lockfile PRs that conflict with each other.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    # Rebase open Dependabot PRs automatically when they conflict with main.
    # This is the default, set here so it is not turned off by accident.
    # Dependabot still stops rebasing a PR once it has been open 30 days.
    rebase-strategy: auto
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Actions, unlike npm above, DO get routine version-update PRs. The pins in
  # .github/workflows are SHAs maintained by hand, and nothing else watches
  # them: they sat three and four majors behind through the whole Node 20
  # deprecation and the only thing that noticed was a person reading a run
  # warning. A pin with no staleness signal is a liability with a tidy name.
  # Monthly and grouped so the signal arrives as one PR a month rather than
  # five. Dependabot rewrites the SHA and the trailing `# vX.Y.Z` comment
  # together, so the comment cannot drift from the pin it labels.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    rebase-strategy: auto
    groups:
      actions:
        patterns:
          - "*"
