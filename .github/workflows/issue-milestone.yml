name: Milestone new and closed issues

# Every issue has a milestone (see "How items flow" in
# _bmad-output/implementation-artifacts/backlog.md). Whoever files an issue sets
# one. This is the safety net: an issue that is opened with no milestone goes to
# Triage, where it gets a decision. It does not overwrite a milestone that is
# already set: it checks again just before writing, and it reads the issue's
# live state, so a milestone added a moment after the issue was created (the
# usual two-step create) wins.
#
# A closed issue is not left in Triage unflagged either, and it does not all go
# to one place. If an issue is closed while it is still in Triage or Backlog (or
# has no milestone at all):
#   - closed by a merged pull request: it takes that pull request's milestone
#     (finished work belongs with the release the pull request shipped in);
#   - otherwise (closed as not planned or a duplicate, or the pull request has
#     no milestone either): the workflow cannot tell where it belongs, so it
#     moves to (or stays in) Triage with the needs-triage label and a comment
#     asking a person to pick the milestone it would have had. It never goes
#     to Backlog.
on:
  issues:
    types: [opened, closed]

# One run at a time per issue, so an issue opened and closed within seconds is
# handled in order: the closed run always sees what the opened run did.
concurrency:
  group: issue-milestone-${{ github.event.issue.number }}
  cancel-in-progress: false

# Least privilege: setting a milestone only needs write access to issues.
permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - name: Put a milestone-less issue in Triage
        if: github.event.action == 'opened'
        run: |
          set -euo pipefail
          current=$(gh api "repos/${GH_REPO}/issues/${ISSUE}" --jq '.milestone.number // empty')
          if [ -n "$current" ]; then
            echo "Issue #${ISSUE} already has milestone ${current}; nothing to do."
            exit 0
          fi
          triage=$(gh api "repos/${GH_REPO}/milestones?state=open&per_page=100" --jq 'first(.[] | select(.title == "Triage") | .number) // empty')
          if [ -z "$triage" ]; then
            echo "::error::No open milestone named Triage."
            exit 1
          fi
          # GitHub has no compare-and-set, so read once more right before the
          # write to shrink the window in which a person's milestone could be lost.
          current=$(gh api "repos/${GH_REPO}/issues/${ISSUE}" --jq '.milestone.number // empty')
          if [ -n "$current" ]; then
            echo "Issue #${ISSUE} got milestone ${current} in the meantime; nothing to do."
            exit 0
          fi
          gh api -X PATCH "repos/${GH_REPO}/issues/${ISSUE}" -F milestone="$triage" --silent
          echo "Issue #${ISSUE} had no milestone; set Triage (${triage})."
      - name: Place an issue closed in Triage, Backlog or with no milestone
        if: github.event.action == 'closed'
        run: |
          set -euo pipefail
          issue=$(gh api "repos/${GH_REPO}/issues/${ISSUE}")
          title=$(jq -r '.milestone.title // empty' <<<"$issue")
          if [ -n "$title" ] && [ "$title" != "Triage" ] && [ "$title" != "Backlog" ]; then
            echo "Issue #${ISSUE} closed in milestone '${title}'; nothing to do."
            exit 0
          fi
          closed_at=$(jq -r '.closed_at' <<<"$issue")
          # The merged pull request that closed it: a merged pull request that
          # mentions this issue and merged within two minutes before the close
          # (the close fires on the merge). Its milestone is the answer, when it
          # has one that is not Triage or Backlog.
          pr_milestone=$(gh api --paginate "repos/${GH_REPO}/issues/${ISSUE}/timeline?per_page=100" \
            | jq -r --arg closed "$closed_at" '
                .[] | select(.event == "cross-referenced") | .source.issue
                | select(.pull_request.merged_at != null)
                | select((($closed | fromdateiso8601) - (.pull_request.merged_at | fromdateiso8601)) | . >= -5 and . <= 120)
                | .milestone.title // empty | select(. != "Triage" and . != "Backlog")')
          pr_milestone=${pr_milestone%%$'\n'*}
          if [ -n "$pr_milestone" ]; then
            target=$(gh api "repos/${GH_REPO}/milestones?state=all&per_page=100" \
              | jq -r --arg t "$pr_milestone" 'first(.[] | select(.title == $t) | .number) // empty')
            if [ -n "$target" ]; then
              gh api -X PATCH "repos/${GH_REPO}/issues/${ISSUE}" -F milestone="$target" --silent
              gh api -X POST "repos/${GH_REPO}/issues/${ISSUE}/comments" \
                -f body="This issue had no decided milestone when a merged pull request closed it, so it took that pull request's milestone, ${pr_milestone}. Change it if that is wrong." --silent
              echo "Issue #${ISSUE} moved to '${pr_milestone}' (${target}) from its closing pull request."
              exit 0
            fi
          fi
          # Cannot decide: keep it findable in Triage and flag it for a person.
          if [ -z "$title" ] || [ "$title" = "Backlog" ]; then
            triage=$(gh api "repos/${GH_REPO}/milestones?state=open&per_page=100" --jq 'first(.[] | select(.title == "Triage") | .number) // empty')
            if [ -z "$triage" ]; then
              echo "::error::No open milestone named Triage."
              exit 1
            fi
            gh api -X PATCH "repos/${GH_REPO}/issues/${ISSUE}" -F milestone="$triage" --silent
          fi
          gh api -X POST "repos/${GH_REPO}/issues/${ISSUE}/labels" -f "labels[]=needs-triage" --silent
          gh api -X POST "repos/${GH_REPO}/issues/${ISSUE}/comments" \
            -f body="Closed without a decided milestone and no merged pull request with a milestone to copy, so it stays in Triage and is flagged needs-triage. Please give it the milestone it would have belonged to (never Backlog): 3.0.0 or 3.x for finished Rust-cycle work, 1.x or 2.x for older closed work." --silent
          echo "Issue #${ISSUE} closed with no decidable milestone; left in Triage and flagged."
