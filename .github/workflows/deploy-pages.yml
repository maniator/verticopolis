name: Deploy to GitHub Pages

# Build the game and publish it to GitHub Pages whenever main updates
# (i.e. when a PR is merged into main). Can also be run on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the deploy job elevates to publish via OIDC.
permissions:
  contents: read

# Only one Pages deploy at a time; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

# The Vite build does not need Playwright browsers.
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build # outputs to ./dist (vite base is "./", so it works at the Pages subpath)

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job gets the Pages/OIDC write scope — the build job, which runs
    # untrusted npm lifecycle/build scripts, stays at contents:read.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      # Whichever attempt actually published reports the live URL.
      url: ${{ steps.deploy3.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      # The Pages backend is intermittently unreliable in TWO ways: it queues
      # past the action's 10-minute default, AND it returns fast transient
      # failures (2026-07-02: an 8-minute wait on a SUCCESSFUL deploy, four
      # timeouts in a row, and a healthy deploy that failed the publish step in
      # ~5s). A single attempt drops otherwise-good releases on the floor — and a
      # dropped deploy leaves clients a version behind. So try up to three times
      # with backoff, each attempt given the same 30-minute timeout so a slow
      # queue alone never counts as a failure. Only first-party
      # actions/deploy-pages runs in this job — it holds pages:write +
      # id-token:write, so no third-party action is trusted with that scope.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000

      - name: Back off before attempt 2
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000

      - name: Back off before attempt 3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60
      # Final attempt: NOT continue-on-error, so if it too fails the job fails
      # (and the run is visibly red) rather than passing on a dropped deploy.
      - name: Deploy to GitHub Pages (attempt 3)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
