name: Deploy to GitHub Pages

# Build the game and publish it to GitHub Pages whenever main updates
# (i.e. when a PR is merged into main). Can also be run on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the deploy job elevates to publish via OIDC.
permissions:
  contents: read

# Only one Pages deploy at a time; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

# The Vite build does not need Playwright browsers.
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build # outputs to ./dist (vite base is "./", so it works at the Pages subpath)

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job gets the Pages/OIDC write scope — the build job, which runs
    # untrusted npm lifecycle/build scripts, stays at contents:read.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The Pages backend queue sometimes backs up well past the action's
          # 10-minute default (2026-07-02: an 8-minute wait on a SUCCESSFUL
          # deploy, then four timeouts in a row). Wait up to 30 minutes before
          # giving up so a slow queue doesn't fail otherwise-healthy deploys.
          timeout: 1800000
