name: Screenshot capture (reusable)

# The SHARED, sharded, self-verifying screenshot capture. Called (workflow_call)
# by both update-screenshots.yml (the marker/dispatch regen) and pr-drift-check.yml
# (the per-PR check), so the two never drift on HOW pixels are generated or how
# nondeterminism is caught. The caller supplies the git ref to render and, after
# this returns, does its own thing with the artifacts (commit on a marker, or
# detect drift + commit on approval).
#
# For each shard (scripts/screenshot-shards.ts partitions SCENES; the `verify`
# coverage gate here fails the run if any scene is in no shard or two), ONE job:
#   - renders the shard's scenes TWICE in the same pinned Playwright image, each
#     leg from its OWN `npm run build` + its OWN preview server, the two legs
#     running CONCURRENTLY (both build+render at once), and
#   - diffs the two renders against EACH OTHER. A byte difference is
#     nondeterminism (a wall-clock read leaking into a BUILD or a capture, the
#     exact leak PR #188 chased), always a bug: the job FAILS, so nothing
#     downstream commits.
# Each leg builds independently so the diff covers build-time and startup
# nondeterminism (a value baked into the bundle at build, or set at server start),
# not only render-time leaks: rendering one shared build twice would show such a
# value identically in both legs and pass, then churn on the next run. a/b in the
# SAME container is as strong a guard as a/b in two separate jobs (same pinned
# image), while saving the second checkout + npm ci vs a run:[a,b] matrix. Running
# the two legs in PARALLEL (each fully isolated: own build outDir, own preview
# port, own SHOTS_DIR output root) makes wall-clock ~1x a leg's build+render
# instead of ~2x, without weakening the guard: both builds are still independent,
# they just overlap in time. The verified run-a set is uploaded as shots-<shard>
# for the caller to assemble.
#
# This job is READ-ONLY: it checks out and executes PR-head code (npm ci, build,
# the screenshot scripts), so it must never hold a write-scoped token, and its
# checkouts set persist-credentials:false. The caller grants write only to its
# own downstream commit job.

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref or SHA to render (the caller's branch tip or PR head sha)."
        required: true
        type: string
    outputs:
      shards:
        description: "JSON array of shard names (for the caller to loop over the shots-<shard> artifacts)."
        value: ${{ jobs.resolve-image.outputs.shards }}
      image:
        description: "The pinned Playwright image tag used."
        value: ${{ jobs.resolve-image.outputs.image }}

# Give the EXPENSIVE capture its OWN concurrency group so a superseding run
# actually cancels these jobs. A caller's top-level `cancel-in-progress` only
# gates the caller's own jobs; it does NOT reliably cancel a called reusable
# workflow's in-progress jobs (GitHub community discussion #30708). Since the
# render matrix below (`shoot`: two full builds + renders per shard, in the
# pinned Playwright container) is the only thing here that costs real minutes,
# without this a new commit on a PR would leave the previous run's captures
# burning compute even though the caller `pr-drift-check.yml` already superseded
# it. The `github` context inside a reusable workflow reflects the CALLER's
# triggering event, so this key sees the caller's event.
#
# Key per caller-event + PR/branch. Use a hardcoded `screenshot-capture-` prefix,
# NEVER `github.workflow` (which resolves to the CALLER's workflow name and would
# collide with the caller's own group, deadlocking or self-cancelling the run,
# discussion #30708). The prefix keeps this group distinct from every caller's own
# top-level group (`pr-drift-*`, `regen-ci-artifacts-*`), so a reusable run never
# contends with its caller's group: no caller/callee deadlock. Cancel ONLY for
# `pull_request` runs (the PR drift-check, where a new push means new pixels
# anyway). The push/dispatch caller `update-screenshots.yml` deliberately
# serializes with `cancel-in-progress: false` to avoid racing on the branch it
# pushes to, so its capture must never be cancelled: the expression below keeps
# that path non-cancelling.
#
# INVARIANTS this key relies on (nothing enforces them, so honor them when adding
# a caller): the group distinguishes runs by event + PR/branch, NOT by caller, so
# there must be at most ONE caller per (event_name, ref); today that holds (only
# `update-screenshots.yml` triggers on push/dispatch, only `pr-drift-check.yml` on
# pull_request). A second push-event caller on the same branch would share
# `screenshot-capture-push-<ref>` and serialize against an unrelated run. And a
# new caller on any event where a fresh push SHOULD supersede the capture would
# get no cancellation here (only `pull_request` cancels); extend the expression if
# you add one.
concurrency:
  group: screenshot-capture-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Resolve the pinned container tag from the repo's Playwright version and gate
  # on shard coverage before any capture. `verify`/`matrix` load the real SCENES
  # (which pulls in node_modules), so install deps first; no browser download
  # since this job never renders.
  resolve-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    outputs:
      image: ${{ steps.pin.outputs.image }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Verify shard coverage
        run: node scripts/screenshot-shards.ts verify

      - id: shards
        name: Emit the shard matrix
        run: echo "shards=$(node scripts/screenshot-shards.ts matrix)" >> "$GITHUB_OUTPUT"

      - id: pin
        run: |
          ver=$(node -e "const l=require('./package-lock.json');const p=l.packages&&l.packages['node_modules/playwright'];process.stdout.write((p&&p.version)||require('./package.json').devDependencies.playwright.replace(/[^0-9.]/g,''))")
          echo "image=mcr.microsoft.com/playwright:v${ver}-jammy" >> "$GITHUB_OUTPUT"

  # One job per shard: render its scenes twice, prove the two renders match, and
  # upload the verified set. The whole determinism guard lives here.
  shoot:
    needs: resolve-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ${{ needs.resolve-image.outputs.image }}
    # Inside a container the default shell is `sh` (dash); the render step uses
    # bash features (functions, process substitution, `read -d ''`), so pin bash.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.resolve-image.outputs.shards) }}
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      # A container checkout trips git's dubious-ownership guard; mark the tree safe.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      # Render the shard TWICE, each leg from its OWN build + fresh preview server,
      # and prove the two renders are byte-identical. Independent builds are what let
      # the diff catch build-time / startup nondeterminism, not just render-time
      # leaks (see the header). The two legs run CONCURRENTLY (both build+render at
      # once) rather than one-after-the-other, so wall-clock is ~1x a leg's
      # build+render instead of ~2x, WITHOUT sharing a build (a shared build rendered
      # twice would hide the build-time class this guard exists to catch). Each leg is
      # fully isolated: its own build outDir, its own preview port (--strictPort makes
      # a genuine clash fail loudly), and its own SHOTS_DIR output root, so nothing
      # the two legs touch collides. Each leg renders into a FRESH empty root, so the
      # root IS exactly that leg's output (no `find -newer` marker needed). SHARD comes
      # in via an env var (not `${{ }}` in the script) so a shard name can never break
      # out.
      - name: Render this shard twice from independent builds in parallel and prove it is deterministic
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          # Locate the image's pinned Chromium and fail fast if it is not there:
          # an empty PW_CHROME would let Playwright fall back to some other browser,
          # silently breaking the "pinned browser" guarantee (and the committed
          # pixels). An image-layout change surfaces here with a clear error.
          PW_CHROME="$(ls -d /ms-playwright/chromium-*/chrome-linux*/chrome 2>/dev/null | head -1)"
          if [ -z "$PW_CHROME" ] || [ ! -x "$PW_CHROME" ]; then
            echo "::error::could not locate the pinned Chromium under /ms-playwright/chromium-*/chrome-linux*/chrome; the Playwright image layout may have changed. Refusing to render with a non-pinned browser."
            exit 1
          fi
          export PW_CHROME
          ONLY="$(node scripts/screenshot-shards.ts print "$SHARD")"
          export ONLY
          echo "shard '$SHARD' renders: $ONLY"
          # Reap a leg's preview server. `kill $!` alone is not enough: `npx vite
          # preview` leaves the actual node server as a process the recorded pid does
          # not reliably reap, so a plain kill can orphan it for the rest of the job.
          # A leg-scoped `pkill` keyed on this leg's UNIQUE build outDir finishes the
          # job and is safe under the two parallel legs: leg a's `/tmp/dist-a` pattern
          # can never match leg b's `/tmp/dist-b` server.
          stop_server() {
            local pid="$1" outdir="$2"
            kill "$pid" 2>/dev/null || true
            pkill -f "vite preview --outDir $outdir " 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          render_leg() {
            # $1 = output root (ends up holding docs/screenshots/...), $2 = preview
            # port, $3 = build outDir. Clean build into THIS leg's own outDir, start
            # `vite preview` on THIS leg's own port serving that outDir, wait for
            # readiness, then render against it (RUN_SERVER unset, so the generator
            # uses the external server at BASE_URL) with SHOTS_DIR pointed at this
            # leg's fresh root, so the whole root is exactly this leg's output. Every
            # piece of state (outDir, port, SHOTS_DIR) is per-leg, so two legs run at
            # once without colliding. Returns non-zero on any failure so the caller can
            # fail the shard.
            local dest="$1" port="$2" outdir="$3"
            rm -rf "$dest" "$outdir"; mkdir -p "$dest"
            npm run build -- --outDir "$outdir" || return 1
            npx vite preview --outDir "$outdir" --port "$port" --strictPort &
            local server_pid=$!
            if ! node -e 'const u="http://localhost:"+process.argv[1];(async()=>{for(let i=0;i<120;i++){try{const res=await fetch(u);if(res.ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,500))}console.error("preview server did not come up (200) on "+u);process.exit(1)})()' "$port"; then
              stop_server "$server_pid" "$outdir"
              return 1
            fi
            # Capture the render's exit WITHOUT letting errexit (GitHub runs bash
            # with -eo pipefail) abort the subshell first: a bare failing command
            # would exit the backgrounded leg immediately and skip the teardown
            # below, orphaning this leg's preview server for the rest of the job.
            # The `|| rc=$?` guard keeps the exit code and guarantees the teardown
            # still runs.
            local rc=0
            SHOTS_DIR="$dest/docs/screenshots" BASE_URL="http://localhost:$port" node scripts/screenshots.ts || rc=$?
            stop_server "$server_pid" "$outdir"
            return "$rc"
          }
          # Fire both legs at once, each logging to its own file (interleaved live
          # output from two parallel builds+renders would be unreadable), then print
          # both logs in full once they finish. Distinct ports (4173/4174), outDirs
          # (/tmp/dist-a|b), and output roots (/tmp/run-a|b) keep the legs isolated.
          render_leg /tmp/run-a 4173 /tmp/dist-a >/tmp/leg-a.log 2>&1 &
          pid_a=$!
          render_leg /tmp/run-b 4174 /tmp/dist-b >/tmp/leg-b.log 2>&1 &
          pid_b=$!
          rc_a=0; rc_b=0
          wait "$pid_a" || rc_a=$?
          wait "$pid_b" || rc_b=$?
          echo "::group::leg a (run-a) output"; cat /tmp/leg-a.log; echo "::endgroup::"
          echo "::group::leg b (run-b) output"; cat /tmp/leg-b.log; echo "::endgroup::"
          if [ "$rc_a" -ne 0 ] || [ "$rc_b" -ne 0 ]; then
            echo "::error::screenshot shard '$SHARD' failed to render (leg a exit=$rc_a, leg b exit=$rc_b); see the per-leg logs above."
            exit 1
          fi
          if ! diff -rq /tmp/run-a /tmp/run-b; then
            echo "::error::screenshot shard '$SHARD' is nondeterministic: two independent builds+renders in the same pinned image produced different pixels. A wall-clock/RNG read leaked into the build or a capture (likely a new time-driven decoration in the engine render path, or a build-time timestamp); fix it before screenshots can update."
            exit 1
          fi
          echo "shard '$SHARD' is deterministic ($(find /tmp/run-a -type f -name '*.png' | wc -l) shot(s))."
          # Stage the verified run-a set for upload. The .shard-complete marker is
          # the authoritative "this shard finished" signal (the consumers count it),
          # so a shard that legitimately renders nothing still uploads a marker and
          # is not mistaken for a missing artifact.
          stage=/tmp/stage
          rm -rf "$stage"; mkdir -p "$stage/shots"
          touch "$stage/.shard-complete"
          [ -d /tmp/run-a ] && cp -a /tmp/run-a/. "$stage/shots/"

      - name: Upload this shard's verified screenshots
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.shard }}
          path: /tmp/stage
          retention-days: 5
          if-no-files-found: error
          include-hidden-files: true
