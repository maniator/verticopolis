name: Screenshot capture (reusable)

# The SHARED, sharded, self-verifying screenshot capture. Called (workflow_call)
# by both update-screenshots.yml (the marker/dispatch regen) and pr-drift-check.yml
# (the per-PR check), so the two never drift on HOW pixels are generated or how
# nondeterminism is caught. The caller supplies the git ref to render and, after
# this returns, does its own thing with the artifacts (commit on a marker, or
# detect drift + commit on approval).
#
# For each shard (scripts/screenshot-shards.ts partitions SCENES; the `verify`
# coverage gate here fails the run if any scene is in no shard or two), ONE job:
#   - renders the shard's scenes TWICE in the same pinned Playwright image, each
#     leg from its OWN `npm run build` + its OWN preview server, and
#   - diffs the two renders against EACH OTHER. A byte difference is
#     nondeterminism (a wall-clock read leaking into a BUILD or a capture, the
#     exact leak PR #188 chased), always a bug: the job FAILS, so nothing
#     downstream commits.
# Each leg builds independently so the diff covers build-time and startup
# nondeterminism (a value baked into the bundle at build, or set at server start),
# not only render-time leaks: rendering one shared build twice would show such a
# value identically in both legs and pass, then churn on the next run. a/b in the
# SAME container is as strong a guard as a/b in two separate jobs (same pinned
# image), while saving the second checkout + npm ci vs a run:[a,b] matrix. The
# verified run-a set is uploaded as shots-<shard> for the caller to assemble.
#
# This job is READ-ONLY: it checks out and executes PR-head code (npm ci, build,
# the screenshot scripts), so it must never hold a write-scoped token, and its
# checkouts set persist-credentials:false. The caller grants write only to its
# own downstream commit job.

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref or SHA to render (the caller's branch tip or PR head sha)."
        required: true
        type: string
    outputs:
      shards:
        description: "JSON array of shard names (for the caller to loop over the shots-<shard> artifacts)."
        value: ${{ jobs.resolve-image.outputs.shards }}
      image:
        description: "The pinned Playwright image tag used."
        value: ${{ jobs.resolve-image.outputs.image }}

permissions:
  contents: read

jobs:
  # Resolve the pinned container tag from the repo's Playwright version and gate
  # on shard coverage before any capture. `verify`/`matrix` load the real SCENES
  # (which pulls in node_modules), so install deps first; no browser download
  # since this job never renders.
  resolve-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    outputs:
      image: ${{ steps.pin.outputs.image }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Verify shard coverage
        run: node scripts/screenshot-shards.ts verify

      - id: shards
        name: Emit the shard matrix
        run: echo "shards=$(node scripts/screenshot-shards.ts matrix)" >> "$GITHUB_OUTPUT"

      - id: pin
        run: |
          ver=$(node -e "const l=require('./package-lock.json');const p=l.packages&&l.packages['node_modules/playwright'];process.stdout.write((p&&p.version)||require('./package.json').devDependencies.playwright.replace(/[^0-9.]/g,''))")
          echo "image=mcr.microsoft.com/playwright:v${ver}-jammy" >> "$GITHUB_OUTPUT"

  # One job per shard: render its scenes twice, prove the two renders match, and
  # upload the verified set. The whole determinism guard lives here.
  shoot:
    needs: resolve-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ${{ needs.resolve-image.outputs.image }}
    # Inside a container the default shell is `sh` (dash); the render step uses
    # bash features (functions, process substitution, `read -d ''`), so pin bash.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.resolve-image.outputs.shards) }}
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      # A container checkout trips git's dubious-ownership guard; mark the tree safe.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      # Render the shard TWICE, each leg from its OWN build + fresh preview server,
      # and prove the two renders are byte-identical. Independent builds are what let
      # the diff catch build-time / startup nondeterminism, not just render-time
      # leaks (see the header). Each render is captured via a `find -newer` marker
      # (the generator rewrites every shot it renders, so every rendered file sorts as
      # newer). SHARD comes in via an env var (not `${{ }}` in the script) so a shard
      # name can never break out.
      - name: Render this shard twice from independent builds and prove it is deterministic
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          export PW_CHROME="$(ls -d /ms-playwright/chromium-*/chrome-linux*/chrome | head -1)"
          ONLY="$(node scripts/screenshot-shards.ts print "$SHARD")"
          echo "shard '$SHARD' renders: $ONLY"
          render_into() {
            # $1 = dest dir, $2 = port. Clean build, start `vite preview` on THIS
            # leg's own port, wait for readiness, render against it (RUN_SERVER unset,
            # so the generator uses the external server at BASE_URL), copy exactly this
            # leg's output into $1 (files touched during it, preserving the
            # docs/screenshots/... path), then tear the server down. Each leg has its
            # own port so a lingering server from leg a can never be mistaken for leg
            # b's; --strictPort makes a genuine port clash fail loudly instead.
            local dest="$1" port="$2"
            rm -rf "$dest"; mkdir -p "$dest"
            npm run build
            npx vite preview --port "$port" --strictPort &
            local server_pid=$!
            if ! node -e 'const u="http://localhost:"+process.argv[1];(async()=>{for(let i=0;i<120;i++){try{await fetch(u);process.exit(0)}catch{}await new Promise(r=>setTimeout(r,500))}console.error("preview server did not come up on "+u);process.exit(1)})()' "$port"; then
              kill "$server_pid" 2>/dev/null || true
              exit 1
            fi
            touch -d '1 second ago' /tmp/render-marker
            BASE_URL="http://localhost:$port" ONLY="$ONLY" node scripts/screenshots.ts
            while IFS= read -r -d '' f; do
              mkdir -p "$dest/$(dirname "$f")"
              cp -a "$f" "$dest/$f"
            done < <(find docs/screenshots -type f -name '*.png' -newer /tmp/render-marker -print0)
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          render_into /tmp/run-a 4173
          render_into /tmp/run-b 4174
          if ! diff -rq /tmp/run-a /tmp/run-b; then
            echo "::error::screenshot shard '$SHARD' is nondeterministic: two independent builds+renders in the same pinned image produced different pixels. A wall-clock/RNG read leaked into the build or a capture (likely a new time-driven decoration in the engine render path, or a build-time timestamp); fix it before screenshots can update."
            exit 1
          fi
          echo "shard '$SHARD' is deterministic ($(find /tmp/run-a -type f -name '*.png' | wc -l) shot(s))."
          # Stage the verified run-a set for upload. The .shard-complete marker is
          # the authoritative "this shard finished" signal (the consumers count it),
          # so a shard that legitimately renders nothing still uploads a marker and
          # is not mistaken for a missing artifact.
          stage=/tmp/stage
          rm -rf "$stage"; mkdir -p "$stage/shots"
          touch "$stage/.shard-complete"
          [ -d /tmp/run-a ] && cp -a /tmp/run-a/. "$stage/shots/"

      - name: Upload this shard's verified screenshots
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.shard }}
          path: /tmp/stage
          retention-days: 5
          if-no-files-found: error
          include-hidden-files: true
