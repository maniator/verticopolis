name: Screenshot capture (reusable)

# The sharded, self-verifying screenshot capture. Called (workflow_call) by
# pr-drift-check.yml (the per-PR drift check), its only caller. Kept as a separate
# reusable workflow so the capture logic (render + twice-render determinism guard)
# lives in one place. The caller supplies the git ref to render and, after this
# returns, does its own thing with the artifacts (detect drift + commit on
# approval).
#
# For each shard (scripts/screenshot-shards.ts partitions SCENES; the `verify`
# coverage gate here fails the run if any scene is in no shard or two), ONE job:
#   - renders the shard's scenes TWICE in the same pinned Playwright image, each
#     leg from its OWN `npm run build` + its OWN preview server, the two legs
#     running CONCURRENTLY (both build+render at once), and
#   - diffs the two renders against EACH OTHER. A byte difference is
#     nondeterminism (a wall-clock read leaking into a BUILD or a capture, the
#     exact leak PR #188 chased), always a bug: the job FAILS, so nothing
#     downstream commits.
# Each leg builds independently so the diff covers build-time and startup
# nondeterminism (a value baked into the bundle at build, or set at server start),
# not only render-time leaks: rendering one shared build twice would show such a
# value identically in both legs and pass, then churn on the next run. a/b in the
# SAME container is as strong a guard as a/b in two separate jobs (same pinned
# image), while saving the second checkout + npm ci vs a run:[a,b] matrix. Running
# the two legs in PARALLEL (each fully isolated: own build outDir, own preview
# port, own SHOTS_DIR output root) makes wall-clock ~1x a leg's build+render
# instead of ~2x, without weakening the guard: both builds are still independent,
# they just overlap in time. The verified run-a set is uploaded as shots-<shard>
# for the caller to assemble.
#
# This job is READ-ONLY: it checks out and executes PR-head code (npm ci, build,
# the screenshot scripts), so it must never hold a write-scoped token, and its
# checkouts set persist-credentials:false. The caller grants write only to its
# own downstream commit job.

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref or SHA to render (the caller's branch tip or PR head sha)."
        required: true
        type: string
    outputs:
      shards:
        description: "JSON array of shard names (for the caller to loop over the shots-<shard> artifacts)."
        value: ${{ jobs.resolve-image.outputs.shards }}
      image:
        description: "The pinned Playwright image tag used."
        value: ${{ jobs.resolve-image.outputs.image }}

# Give the EXPENSIVE capture its OWN concurrency group so a superseding run
# actually cancels these jobs. A caller's top-level `cancel-in-progress` only
# gates the caller's own jobs; it does NOT reliably cancel a called reusable
# workflow's in-progress jobs (GitHub community discussion #30708). Since the
# render matrix below (`shoot`: two full builds + renders per shard, in the
# pinned Playwright container) is the only thing here that costs real minutes,
# without this a new commit on a PR would leave the previous run's captures
# burning compute even though the caller `pr-drift-check.yml` already superseded
# it. The `github` context inside a reusable workflow reflects the CALLER's
# triggering event, so this key sees the caller's event.
#
# Key per caller-event + PR/branch. Use a hardcoded `screenshot-capture-` prefix,
# NEVER `github.workflow` (which resolves to the CALLER's workflow name and would
# collide with the caller's own group, deadlocking or self-cancelling the run,
# discussion #30708). The prefix keeps this group distinct from every caller's own
# top-level group (`pr-drift-*`), so a reusable run never contends with its
# caller's group: no caller/callee deadlock. Cancel ONLY for `pull_request` runs
# (the PR drift-check, where a new push means new pixels anyway). Today the only
# caller is pr-drift-check.yml on `pull_request`, so the expression below cancels
# every run; the event guard is kept so a future non-`pull_request` caller that
# should NOT be cancelled (e.g. a serialized push/dispatch regen) stays safe
# without editing this key.
#
# INVARIANTS this key relies on (nothing enforces them, so honor them when adding
# a caller): the group distinguishes runs by event + PR/branch, NOT by caller, so
# there must be at most ONE caller per (event_name, ref); today that holds (only
# `pr-drift-check.yml` calls this, on pull_request). A second caller on the same
# event and branch would share the group and serialize against an unrelated run.
# And a new caller on any event where a fresh push SHOULD supersede the capture
# would get no cancellation here (only `pull_request` cancels); extend the
# expression if you add one.
concurrency:
  group: screenshot-capture-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Resolve the pinned container tag from the repo's Playwright version and gate
  # on shard coverage before any capture. `verify`/`matrix` load the real SCENES
  # (which pulls in node_modules), so install deps first; no browser download
  # since this job never renders.
  resolve-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    outputs:
      image: ${{ steps.pin.outputs.image }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Verify shard coverage
        run: node scripts/screenshot-shards.ts verify

      - id: shards
        name: Emit the shard matrix
        run: echo "shards=$(node scripts/screenshot-shards.ts matrix)" >> "$GITHUB_OUTPUT"

      - id: pin
        run: |
          ver=$(node -e "const l=require('./package-lock.json');const p=l.packages&&l.packages['node_modules/playwright'];process.stdout.write((p&&p.version)||require('./package.json').devDependencies.playwright.replace(/[^0-9.]/g,''))")
          echo "image=mcr.microsoft.com/playwright:v${ver}-jammy" >> "$GITHUB_OUTPUT"

  # One job per shard: render its scenes twice, prove the two renders match, and
  # upload the verified set. The whole determinism guard lives here.
  shoot:
    needs: resolve-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ${{ needs.resolve-image.outputs.image }}
    # Inside a container the default shell is `sh` (dash); the staging step uses
    # bash-isms, so pin bash. (The determinism check itself is a Node script.)
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.resolve-image.outputs.shards) }}
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      # A container checkout trips git's dubious-ownership guard; mark the tree safe.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      # Render the shard TWICE from two independent builds and byte-compare the
      # renders (the whole determinism guard). The logic lives in a standalone
      # script (scripts/screenshot-determinism-check.ts) so a person or an agent can
      # run the exact same check locally, not only in CI. Independent builds are what
      # let the diff catch build-time / startup nondeterminism, not just render-time
      # leaks (see the header). The two legs run CONCURRENTLY (both build+render at
      # once), so wall-clock is about one leg's build+render rather than two, WITHOUT
      # sharing a build (a shared build rendered twice would hide the build-time class
      # this guard exists to catch). This step only supplies the pinned browser and
      # stages the verified run-a set to upload; the script does the rest.
      - name: Render this shard twice in parallel and prove it is deterministic
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          # Locate the image's pinned Chromium and fail fast if it is not there:
          # an empty PW_CHROME would let Playwright fall back to some other browser,
          # silently breaking the "pinned browser" guarantee (and the committed
          # pixels). An image-layout change surfaces here with a clear error.
          PW_CHROME="$(ls -d /ms-playwright/chromium-*/chrome-linux*/chrome 2>/dev/null | head -1)"
          if [ -z "$PW_CHROME" ] || [ ! -x "$PW_CHROME" ]; then
            echo "::error::could not locate the pinned Chromium under /ms-playwright/chromium-*/chrome-linux*/chrome; the Playwright image layout may have changed. Refusing to render with a non-pinned browser."
            exit 1
          fi
          export PW_CHROME
          # Render each leg into its own fresh root and byte-diff them. SHARD is passed
          # as an argument (not interpolated into a script body), so a shard name can
          # never break out. The script exits non-zero on any render failure or on
          # nondeterminism, which fails this step.
          node scripts/screenshot-determinism-check.ts "$SHARD"
          # Stage the verified run-a set for upload. run-a lives under the same temp
          # base the check uses (os.tmpdir(), overridable via SCREENSHOT_TMP), so read
          # it from there rather than a hardcoded path. The .shard-complete marker is
          # the authoritative "this shard finished" signal (the consumers count it),
          # so a shard that legitimately renders nothing still uploads a marker and
          # is not mistaken for a missing artifact.
          run_a="$(node -p 'process.env.SCREENSHOT_TMP || require("os").tmpdir()')/run-a"
          stage=/tmp/stage
          rm -rf "$stage"; mkdir -p "$stage/shots"
          touch "$stage/.shard-complete"
          [ -d "$run_a" ] && cp -a "$run_a/." "$stage/shots/"

      - name: Upload this shard's verified screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shots-${{ matrix.shard }}
          path: /tmp/stage
          retention-days: 5
          if-no-files-found: error
          include-hidden-files: true
