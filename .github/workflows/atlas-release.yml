name: Sprite atlas release

# Builds the sprite atlas archive (scripts/export-atlas.ts, issue #909) for a
# tag and attaches it to that tag's GitHub release with a SHA-256 checksum, so
# any frontend on the open engine can fetch the art for the exact commit it
# pins. Nothing generated is committed. The bake runs inside the pinned
# Playwright image (the same Chromium the screenshot workflows use), so the
# pixels and the checksum are reproducible.
on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build the atlas for"
        required: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

permissions:
  contents: read

concurrency:
  group: atlas-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.pin.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: pin
        run: |
          ver=$(node -e "const l=require('./package-lock.json');const p=l.packages&&l.packages['node_modules/playwright'];process.stdout.write((p&&p.version)||require('./package.json').devDependencies.playwright.replace(/[^0-9.]/g,''))")
          echo "image=mcr.microsoft.com/playwright:v${ver}-jammy" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The image ships an older Node; install the repo's pinned one over it.
      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      # A manual run names an existing tag; fail before the long bake if not.
      - name: Check the tag
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --tags --force origin > /dev/null
          git rev-parse --verify --quiet "refs/tags/$TAG" > /dev/null || { echo "$TAG is not a tag."; exit 1; }

      # The export launches Playwright's own Chromium from the image (the
      # binary the e2e comparison uses), checks the atlas against the game's
      # paint for the sample signatures, then writes the archive. It records
      # the checked-out commit, so a manual rebuild names the tag's commit.
      - name: Bake the atlas in the pinned Chromium
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: npm run atlas -- --out dist-atlas --label "$TAG"

      - name: Check the checksum file
        working-directory: dist-atlas
        run: sha256sum --check ./*.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sprite-atlas
          path: dist-atlas/
          if-no-files-found: error

  attach:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sprite-atlas
          path: dist-atlas

      - name: Attach to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # A tag push is the release signal: create the release when the tag
          # has none yet (a release another job created in the meantime is
          # fine), then replace any atlas files already attached.
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "Sprite atlas attached by the atlas release workflow." \
              || gh release view "$TAG" > /dev/null
          fi
          gh release upload "$TAG" dist-atlas/*.zip dist-atlas/*.sha256 --clobber
