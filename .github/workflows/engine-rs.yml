name: Rust engine

# The Rust port of the engine lives in engine-rs/. Its referee is the same
# conformance suite the TypeScript engine runs (conformance/): the port must
# reproduce every pinned checkpoint, so this job runs it on every change to the
# crate, the scenarios or the lock, and on main. Format and lint run as hard
# gates, like the TypeScript lane.

concurrency:
  # Cancel superseded PR runs; preserve main pushes for cache warming.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - "engine-rs/**"
      - "conformance/**"
      - "src/engine/**"
      - "src/shared/vacateReasonText.ts"
      - "src/storage/**"
      - "src/tests/conformance/**"
      - "src/tests/integration/conformance.integration.test.ts"
      - "src/tests/integration/conformanceWasm.integration.test.ts"
      - "src/tests/integration/conformanceWasmLoadFidelity.integration.test.ts"
      - "src/tests/integration/conformanceWasmCanBuild.integration.test.ts"
      - "src/tests/integration/conformanceWasmVctower.integration.test.ts"
      - "src/tests/integration/conformanceWasmSaves.integration.test.ts"
      - "src/tests/integration/dualRunDay.integration.test.ts"
      - "src/tests/integration/dualRunEdits.integration.test.ts"
      - "src/tests/integration/chargeBindingRaw.integration.test.ts"
      - "src/tests/integration/panelGettersWasm.integration.test.ts"
      - "src/tests/integration/panelGettersCost.integration.test.ts"
      - "src/tests/integration/engineView.integration.test.ts"
      - "src/tests/integration/tsEngine.golden.integration.test.ts"
      - "src/tests/integration/viewReader.integration.test.ts"
      - "src/tests/integration/viewLayoutJson.integration.test.ts"
      - "src/tests/dualrun/**"
      - "src/dualrun/**"
      - "src/wasmhost/**"
      - "src/tests/integration/wasmHost.integration.test.ts"
      - "src/tests/integration/wasmHostCatalog.integration.test.ts"
      - "src/tests/integration/wasmHostExtermination.integration.test.ts"
      - "e2e/wasmEngine.spec.ts"
      - "src/game/frameLoop.ts"
      - "src/tests/integration/loaderCases.integration.test.ts"
      - "src/tests/fixtures/tdtBuilder.ts"
      - "src/tests/fixtures/tdtLayout.ts"
      - "scripts/wasm-build.ts"
      - "scripts/build-engine-wasm.sh"
      - "scripts/gen-gameplay-events.ts"
      - ".github/actions/engine-wasm/**"
      - "scripts/engine-third-party.ts"
      - "scripts/license-files.ts"
      - "src/build/thirdPartyNotices.ts"
      - "src/build/rustNotices.ts"
      - "src/build/engineCompat.ts"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "vite.config.ts"
      - "scripts/fuzz-compare.ts"
      - "scripts/fuzz-corpus.ts"
      - "scripts/fuzz-key.ts"
      - "scripts/fuzz-shrink.ts"
      - "tsconfig.json"
      - ".github/workflows/engine-fuzz.yml"
      - ".github/workflows/engine-rs.yml"
  # Every PR runs this workflow, because engine-rs is a required check: a
  # path filter here would leave a PR that touches none of these files
  # waiting on a check that never starts. The changes job below reads this
  # same push.paths list at runtime, so the workflow owns its filter once.
  # An unreadable list fails closed and runs the engine jobs.
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Whether this change touches the engine. Pushes to main only fire on
  # the push paths above, so they always run; a PR runs the jobs below
  # when one of these files changed or when this filter cannot decide.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A missing sha or a failed diff fails this job, which runs the
          # engine checks below (they skip only on a successful "false").
          [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ] || { echo "::error::missing PR shas"; exit 1; }
          # --no-renames lists both sides of a move, so a file moved out of an
          # engine path still counts. The three-dot form diffs from the merge
          # base, as the paths filter did, so engine changes that landed on
          # main after the branch split do not count as this PR's.
          # -z keeps every path unquoted, so a name with a quote, tab,
          # backslash or newline still matches its pattern.
          list="$RUNNER_TEMP/changed-files"
          git diff -z --no-renames --name-only "$BASE_SHA...$HEAD_SHA" > "$list" || exit 1
          # Reuse the authoritative on.push.paths globs for pull requests.
          # Bash case patterns match slashes (including a trailing **).
          # If someone changes the YAML shape, fail closed rather than
          # silently skipping required engine checks.
          mapfile -t patterns < <(
            awk '
              /^  push:$/ { push = 1; next }
              push && /^    paths:$/ { paths = 1; next }
              paths && /^      - "/ {
                sub(/^      - "/, "", $0)
                sub(/"$/, "", $0)
                print
                next
              }
              paths { exit }
            ' .github/workflows/engine-rs.yml
          )
          if [ "${#patterns[@]}" -lt 30 ]; then
            echo "::error::Cannot read the engine path filter from on.push.paths"
            exit 1
          fi
          engine=false
          while IFS= read -r -d '' f; do
            [ -z "$f" ] && continue
            for pattern in "${patterns[@]}"; do
              case "$f" in
                $pattern) engine=true; break ;;
              esac
            done
            [ "$engine" = true ] && break
          done < "$list"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"

  # A host outside the web game. The job runs in the official Rust image
  # (pinned by digest), which has the toolchain and git and no Node.js, so
  # nothing on the runner is changed or removed. The checkout holds only
  # engine-rs/ and conformance/. engine-rs/consumer/ is then copied out of
  # the checkout and built there against the engine by an absolute path, the
  # way a crate in its own repository would depend on a local clone, and it
  # lints, tests, runs the smoke and replays every scenario of the lock
  # (API.md). The engine's own tests and referee run in the rust job, not
  # again here. The consumer still replays the full suite against a copied
  # fixture directory outside the checkout. What
  # this proves and what it does not: the engine builds, tests and runs with
  # no web game and no Node.js, from a crate outside the tree; it does not
  # prove a packaged or registry release, which needs the conformance files
  # inside the crate first (#893).
  consumer:
    needs: changes
    # Fail closed: run unless the filter succeeded and found no engine file.
    # always() rather than !cancelled(): a skipped required job counts as
    # passed, so a run cancelled before this job starts must not skip it.
    # Its last step fails the job if the run was cancelled.
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.engine == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    container:
      # rust:1.97.0-bookworm, the toolchain the engine pins (rust-version).
      image: rust:1.97.0-bookworm@sha256:8fa55b2f3ddf97471ab6a767bfa3f37e6bad0986ba823e75fea57e2a2a5c3073
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /engine-rs/
            /conformance/

      - name: Only the engine and the conformance suite are checked out
        run: |
          top="$(ls -A | grep -vx '.git' | sort | tr '\n' ' ')"
          if [ "$top" != "conformance engine-rs " ]; then
            echo "the checkout holds: $top"; exit 1
          fi
          test -f engine-rs/Cargo.toml
          test -f conformance/expected.json

      # The Actions runner mounts its own Node.js under /__e for JavaScript
      # actions such as checkout; it is not on PATH, and the image has none.
      - name: Node.js is unreachable
        run: |
          for n in node nodejs npm npx corepack yarn pnpm bun; do
            if command -v "$n"; then echo "$n is on PATH"; exit 1; fi
          done
          if find /usr /opt /bin /sbin /root /home -xdev \( -name node -o -name nodejs \) -type f 2>/dev/null | grep .; then
            echo "the image holds Node.js"; exit 1
          fi

      - name: Rust toolchain
        run: |
          rustup show active-toolchain | grep -q '^1\.97\.0'
          rustup component add rustfmt clippy

      # The cargo registry and the compiled dependencies, keyed on the
      # installed toolchains, each Cargo.lock and the job. Only a run on main
      # saves, so a pull request reads main's cache and never writes one of
      # its own. Old dependency builds are kept across lockfile bumps; bump
      # prefix-key to start the cache over when it grows.
      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          workspaces: |
            engine-rs -> target
            engine-rs/consumer -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Default features: no binding and no conformance harness, the
      # library a host that only plays the game links.
      - name: The engine library builds alone
        working-directory: engine-rs
        run: cargo build --locked --lib

      # The default/WASM tests, instrumented conformance tests and release
      # referee run in the rust job. Repeating them here duplicates minutes without
      # adding host-independence coverage: the external consumer below
      # exercises the engine from an actual standalone crate instead.

      - name: The consumer, in place
        working-directory: engine-rs/consumer
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          # The JavaScript binding is a feature a native host never turns on,
          # and no browser crate or getrandom is in the tree. Normal and
          # build dependencies on every target count; the tree is captured
          # first so a cargo failure fails the step.
          tree="$(cargo tree --locked -e normal,build --target all --prefix none)"
          test -n "$tree"
          if grep -E '^(wasm-bindgen|js-sys|web-sys|getrandom) ' <<<"$tree"; then
            echo "a browser or host crate reached a native host's tree"; exit 1
          fi

      - name: The consumer, as a crate outside the checkout
        run: |
          ws="$PWD"
          host="$RUNNER_TEMP/host"
          mkdir -p "$host"
          cp -R engine-rs/consumer/Cargo.toml engine-rs/consumer/Cargo.lock engine-rs/consumer/src "$host/"
          sed -i "s|^verticopolis-engine = { path = \"..\", |verticopolis-engine = { path = \"$ws/engine-rs\", |" "$host/Cargo.toml"
          grep -qx "verticopolis-engine = { path = \"$ws/engine-rs\", features = \[\"conformance\"\] }" "$host/Cargo.toml"
          # The suite under another name, as a packaged copy would be: a
          # fixture resolves inside whatever directory holds the suite.
          suite="$RUNNER_TEMP/suite-copy"
          rm -rf "$suite"
          cp -R conformance "$suite"
          cd "$host"
          VC_CONFORMANCE="$suite" cargo test --locked
          cargo run --locked --release -- "$suite"

      # A cancelled run can skip every step above and still leave the job
      # green, which would pass the required check unchecked. Fail instead.
      - name: Fail a cancelled run
        if: ${{ cancelled() }}
        run: exit 1

  rust:
    needs: changes
    # Fail closed: run unless the filter succeeded and found no engine file.
    # always() rather than !cancelled(): a run cancelled before this job
    # starts must not skip it. Its last step fails the job if the run was
    # cancelled.
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.engine == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ubuntu-latest ships a stable toolchain through rustup; pin the channel
      # the crate was written against rather than whatever the image happens
      # to carry. Every cargo step runs --locked so a stale Cargo.lock fails
      # the run instead of being rewritten on the runner.
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          rustup default 1.97.0
          rustup target add wasm32-unknown-unknown
          # The image's own stable toolchain is unused here, and the cache
          # key hashes every installed toolchain, so an image update would
          # otherwise miss the cache on every pull request.
          rustup toolchain uninstall stable || true

      # The cargo registry and the compiled dependencies, keyed on the
      # installed toolchains, Cargo.lock and the job. Only a run on main
      # saves, so a pull request reads main's cache and never writes one of
      # its own. Bump prefix-key to start the cache over when it grows.
      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          workspaces: engine-rs -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features conformance -- -D warnings
          cargo clippy --locked --all-targets --features wasm -- -D warnings
          cargo clippy --locked --lib --target wasm32-unknown-unknown --features wasm -- -D warnings

      - name: Unit tests
        # Run native/default and WASM-feature variants. The conformance
        # feature variant is exercised below by cargo llvm-cov's test run;
        # don't run those same tests twice in this job.
        # Keep debug assertions and overflow checks enabled.
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: "1"
        run: |
          cargo test --locked
          cargo test --locked --features wasm

      - name: Conformance
        run: cargo run --locked --release --features conformance --bin conformance

      # The prebuilt cargo-llvm-cov release, checked against the hash the
      # action's manifest records, in place of a compile from source. With
      # no fallback, a version the manifest lacks fails the step instead of
      # installing another way.
      - name: cargo-llvm-cov
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none

      # Coverage of the unit tests plus the referee, with a line floor that
      # only ratchets up as scenarios land (80.58% at the first measurement,
      # 84.47% after the first scenario slice, 88.7% with the full library; the
      # floor sits about a point and a half under the measurement).
      # The conformance-feature unit tests run here (not a second time
      # in the Unit tests step). The referee runs in the debug profile here
      # to merge coverage; the release replay above is the parity gate.
      - name: Coverage
        run: |
          rustup component add llvm-tools-preview
          cargo llvm-cov --version | grep -qw '0\.9\.1'
          cargo llvm-cov --no-report --locked test --features conformance
          cargo llvm-cov --no-report --locked run --features conformance --bin conformance
          cargo llvm-cov report --fail-under-lines 87

      # A cancelled run can skip every step above and still leave the job
      # green, which would pass the required check unchecked. Fail instead.
      - name: Fail a cancelled run
        if: ${{ cancelled() }}
        run: exit 1

  # Verify the WASM binding builds and its generated declarations match
  # the sources. The host-driven WASM conformance and dual-run suites are
  # executed ONCE in the required test-wasm-parity (integrationWasm) check
  # from test.yml. Running them again here would duplicate billed minutes.
  # This job and fuzz-corpus below need Node.js; the native Rust jobs do not.
  # The package comes from .github/actions/engine-wasm, shared by cache with
  # the other workflows, and built on a miss using a pinned wasm-bindgen CLI
  # verified by scripts/build-engine-wasm.sh and scripts/wasm-build.ts.
  wasm-binding:
    needs: changes
    # Fail closed, as the rust job above.
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.engine == 'true') }}
    runs-on: ubuntu-latest
    # A cache miss compiles the crate for wasm32 (a few minutes, with the
    # prebuilt CLI); anything near this is a hang.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - uses: ./.github/actions/engine-wasm

      # The checked-in declarations have to be the ones the package's build
      # wrote. The action checks the package was built from this tree's
      # sources, so its declaration is the build's own, cached or not
      # (scripts/wasm-build.ts copies it to src/dualrun/engine.d.ts byte for
      # byte, and on a cache miss has just done so). The gameplay event files
      # come from the event catalog through npm run gen:events.
      - name: The declarations match the build
        run: |
          test -f engine-rs/pkg/verticopolis_engine.d.ts || { echo "the engine package has no engine-rs/pkg/verticopolis_engine.d.ts"; exit 1; }
          cmp engine-rs/pkg/verticopolis_engine.d.ts src/dualrun/engine.d.ts || { echo "src/dualrun/engine.d.ts is stale: run npm run wasm:build and commit it"; exit 1; }
          npm run gen:events
          test -z "$(git status --porcelain -- src/dualrun/engine.d.ts src/engine/gameplayEvents.d.ts src/engine/gameplayEventRules.ts src/engine/viewLayout.json)" || { echo "src/dualrun/engine.d.ts, src/engine/gameplayEvents.d.ts, src/engine/gameplayEventRules.ts or src/engine/viewLayout.json is stale or untracked: run npm run wasm:build (or npm run gen:events for the two event files) and commit them"; exit 1; }

      - name: Fail a cancelled run
        if: ${{ cancelled() }}
        run: exit 1

  # The seeded differential's corpus (conformance/fuzz-corpus/): scenarios the
  # nightly once diverged on, shrunk by scripts/fuzz-shrink.ts, plus smoke
  # entries so the job never runs on nothing. Each is replayed on the Rust
  # engine (the fuzzer's --replay mode) and on the TypeScript engine, and the
  # two must agree at every checkpoint. The nightly keeps growing new seeds;
  # this job only holds what it already found. The whole job is held to ten
  # minutes, and the script stops at its own 240 s budget and fails rather
  # than skip an entry.
  fuzz-corpus:
    needs: changes
    # Fail closed, as the rust job above.
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.engine == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci

      - name: Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0

      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          workspaces: engine-rs -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the fuzzer
        run: cargo build --locked --release --features conformance --bin fuzz
        working-directory: engine-rs

      - name: Replay the corpus on both engines
        run: npx tsx scripts/fuzz-corpus.ts --budget 240

      - name: Fail a cancelled run
        if: ${{ cancelled() }}
        run: exit 1

  # The check branch protection requires on main. It always runs and
  # passes in two cases only: the changes filter succeeded and found no
  # engine file (the four engine jobs above skipped on purpose), or all
  # four passed. Anything else (a failure, a cancellation, a skip the
  # filter did not ask for) fails it, so the binding's checks and the
  # Node-free consumer gate a merge alongside the Rust job.
  engine-rs:
    needs: [changes, consumer, rust, wasm-binding, fuzz-corpus]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every engine job passed, or the change touches no engine file
        env:
          FILTER: ${{ needs.changes.result }}
          ENGINE: ${{ needs.changes.outputs.engine }}
          CONSUMER: ${{ needs.consumer.result }}
          RUST: ${{ needs.rust.result }}
          BINDING: ${{ needs.wasm-binding.result }}
          CORPUS: ${{ needs.fuzz-corpus.result }}
        run: |
          echo "changes: $FILTER (engine=$ENGINE), consumer: $CONSUMER, rust: $RUST, wasm-binding: $BINDING, fuzz-corpus: $CORPUS"
          if [ "$FILTER" = success ] && [ "$ENGINE" = false ] && [ "$CONSUMER" = skipped ] && [ "$RUST" = skipped ] && [ "$BINDING" = skipped ] && [ "$CORPUS" = skipped ]; then
            exit 0
          fi
          test "$CONSUMER" = success && test "$RUST" = success && test "$BINDING" = success && test "$CORPUS" = success

      - name: Fail a cancelled run
        if: ${{ cancelled() }}
        run: exit 1
