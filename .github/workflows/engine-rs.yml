name: Rust engine

# The Rust port of the engine lives in engine-rs/. Its referee is the same
# conformance suite the TypeScript engine runs (conformance/): the port must
# reproduce every pinned checkpoint, so this job runs it on every change to the
# crate, the scenarios or the lock, and on main. Format and lint run as hard
# gates, like the TypeScript lane.

on:
  push:
    branches: [main]
    paths:
      - "engine-rs/**"
      - "conformance/**"
      - "src/engine/**"
      - "src/storage/**"
      - "src/tests/conformance/**"
      - "src/tests/integration/conformance.integration.test.ts"
      - "src/tests/integration/conformanceWasm.integration.test.ts"
      - "src/tests/integration/conformanceWasmTdt.integration.test.ts"
      - "src/tests/integration/conformanceWasmCanBuild.integration.test.ts"
      - "src/tests/integration/conformanceWasmVctower.integration.test.ts"
      - "src/tests/integration/dualRunDay.integration.test.ts"
      - "src/tests/integration/dualRunEdits.integration.test.ts"
      - "src/tests/integration/chargeBindingRaw.integration.test.ts"
      - "src/tests/dualrun/**"
      - "src/dualrun/**"
      - "src/wasmhost/**"
      - "src/tests/integration/wasmHost.integration.test.ts"
      - "src/tests/integration/wasmHostCatalog.integration.test.ts"
      - "e2e/wasmEngine.spec.ts"
      - "src/game/frameLoop.ts"
      - "src/tests/integration/loaderCases.integration.test.ts"
      - "src/tests/integration/tdtCases.integration.test.ts"
      - "src/tests/fixtures/tdtBuilder.ts"
      - "src/tests/fixtures/tdtImportCases.ts"
      - "src/tests/fixtures/tdtExportCases.ts"
      - "scripts/wasm-build.ts"
      - "scripts/engine-third-party.ts"
      - "scripts/license-files.ts"
      - "src/build/thirdPartyNotices.ts"
      - "src/build/rustNotices.ts"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - "vite.config.ts"
      - ".github/workflows/engine-rs.yml"
  # Every PR runs this workflow, because engine-rs is a required check: a
  # path filter here would leave a PR that touches none of these files
  # waiting on a check that never starts. The changes job below applies the
  # same list instead, and the jobs skip (which counts as passing) only when
  # the filter succeeded and found no engine file. Keep the list in step
  # with the push paths above.
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Whether this change touches the engine. Pushes to main only fire on
  # the push paths above, so they always run; a PR runs the jobs below
  # when one of these files changed or when this filter cannot decide.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A missing sha or a failed diff fails this job, which runs the
          # engine checks below (they skip only on a successful "false").
          [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ] || { echo "::error::missing PR shas"; exit 1; }
          # --no-renames lists both sides of a move, so a file moved out of an
          # engine path still counts. The three-dot form diffs from the merge
          # base, as the paths filter did, so engine changes that landed on
          # main after the branch split do not count as this PR's.
          files=$(git -c core.quotePath=false diff --no-renames --name-only "$BASE_SHA...$HEAD_SHA") || exit 1
          engine=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in engine-rs/*) engine=true ;; esac
            case "$f" in conformance/*) engine=true ;; esac
            case "$f" in src/engine/*) engine=true ;; esac
            case "$f" in src/storage/*) engine=true ;; esac
            case "$f" in src/tests/conformance/*) engine=true ;; esac
            case "$f" in src/tests/integration/conformance.integration.test.ts) engine=true ;; esac
            case "$f" in src/tests/integration/conformanceWasm.integration.test.ts) engine=true ;; esac
            case "$f" in src/tests/integration/conformanceWasmTdt.integration.test.ts) engine=true ;; esac
            case "$f" in src/tests/integration/conformanceWasmCanBuild.integration.test.ts) engine=true ;; esac
            case "$f" in src/tests/integration/conformanceWasmVctower.integration.test.ts) engine=true ;; esac
            case "$f" in src/tests/integration/dualRunDay.integration.test.ts) engine=true ;; esac
            case "$f" in src/tests/integration/dualRunEdits.integration.test.ts) engine=true ;; esac
            case "$f" in src/tests/integration/chargeBindingRaw.integration.test.ts) engine=true ;; esac
            case "$f" in src/tests/dualrun/*) engine=true ;; esac
            case "$f" in src/dualrun/*) engine=true ;; esac
            case "$f" in src/wasmhost/*) engine=true ;; esac
            case "$f" in src/tests/integration/wasmHost.integration.test.ts) engine=true ;; esac
            case "$f" in src/tests/integration/wasmHostCatalog.integration.test.ts) engine=true ;; esac
            case "$f" in e2e/wasmEngine.spec.ts) engine=true ;; esac
            case "$f" in src/game/frameLoop.ts) engine=true ;; esac
            case "$f" in src/tests/integration/loaderCases.integration.test.ts) engine=true ;; esac
            case "$f" in src/tests/integration/tdtCases.integration.test.ts) engine=true ;; esac
            case "$f" in src/tests/fixtures/tdtBuilder.ts) engine=true ;; esac
            case "$f" in src/tests/fixtures/tdtImportCases.ts) engine=true ;; esac
            case "$f" in src/tests/fixtures/tdtExportCases.ts) engine=true ;; esac
            case "$f" in scripts/wasm-build.ts) engine=true ;; esac
            case "$f" in scripts/engine-third-party.ts) engine=true ;; esac
            case "$f" in scripts/license-files.ts) engine=true ;; esac
            case "$f" in src/build/thirdPartyNotices.ts) engine=true ;; esac
            case "$f" in src/build/rustNotices.ts) engine=true ;; esac
            case "$f" in package.json) engine=true ;; esac
            case "$f" in package-lock.json) engine=true ;; esac
            case "$f" in .nvmrc) engine=true ;; esac
            case "$f" in vite.config.ts) engine=true ;; esac
            case "$f" in .github/workflows/engine-rs.yml) engine=true ;; esac
          done <<< "$files"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"

  # A host outside the web game. The job runs in the official Rust image
  # (pinned by digest), which has the toolchain and git and no Node.js, so
  # nothing on the runner is changed or removed. The checkout holds only
  # engine-rs/ and conformance/. engine-rs/consumer/ is then copied out of
  # the checkout and built there against the engine by an absolute path, the
  # way a crate in its own repository would depend on a local clone, and it
  # lints, tests, runs the smoke and replays every scenario of the lock
  # (API.md). The engine's own tests and the full referee also run from the
  # sparse checkout, the save fixtures included (conformance/fixtures/). What
  # this proves and what it does not: the engine builds, tests and runs with
  # no web game and no Node.js, from a crate outside the tree; it does not
  # prove a packaged or registry release, which needs the conformance files
  # inside the crate first (#893).
  consumer:
    needs: changes
    # Fail closed: run unless the filter succeeded and found no engine file.
    # always() rather than !cancelled(): a skipped required job counts as
    # passed, so a run cancelled before this job starts must not skip it.
    # Its last step fails the job if the run was cancelled.
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.engine == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    container:
      # rust:1.97.0-bookworm, the toolchain the engine pins (rust-version).
      image: rust:1.97.0-bookworm@sha256:8fa55b2f3ddf97471ab6a767bfa3f37e6bad0986ba823e75fea57e2a2a5c3073
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /engine-rs/
            /conformance/

      - name: Only the engine and the conformance suite are checked out
        run: |
          top="$(ls -A | grep -vx '.git' | sort | tr '\n' ' ')"
          if [ "$top" != "conformance engine-rs " ]; then
            echo "the checkout holds: $top"; exit 1
          fi
          test -f engine-rs/Cargo.toml
          test -f conformance/expected.json

      # The Actions runner mounts its own Node.js under /__e for JavaScript
      # actions such as checkout; it is not on PATH, and the image has none.
      - name: Node.js is unreachable
        run: |
          for n in node nodejs npm npx corepack yarn pnpm bun; do
            if command -v "$n"; then echo "$n is on PATH"; exit 1; fi
          done
          if find /usr /opt /bin /sbin /root /home -xdev \( -name node -o -name nodejs \) -type f 2>/dev/null | grep .; then
            echo "the image holds Node.js"; exit 1
          fi

      - name: Rust toolchain
        run: |
          rustup show active-toolchain | grep -q '^1\.97\.0'
          rustup component add rustfmt clippy

      # Default features: no binding and no conformance harness, the
      # library a host that only plays the game links.
      - name: The engine library builds alone
        working-directory: engine-rs
        run: cargo build --locked --lib

      # Every crate test, the binding's included (it builds natively), and
      # every scenario of the lock, from a checkout that holds no web game:
      # the tests and the referee read nothing outside engine-rs/ and
      # conformance/.
      - name: The engine's tests and the full referee, without the web game
        working-directory: engine-rs
        run: |
          cargo test --locked
          cargo test --locked --features conformance
          cargo test --locked --features wasm
          cargo run --locked --release --features conformance --bin conformance

      - name: The consumer, in place
        working-directory: engine-rs/consumer
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          # The JavaScript binding is a feature a native host never turns on,
          # and no browser crate or getrandom is in the tree. Normal and
          # build dependencies on every target count; the tree is captured
          # first so a cargo failure fails the step.
          tree="$(cargo tree --locked -e normal,build --target all --prefix none)"
          test -n "$tree"
          if grep -E '^(wasm-bindgen|js-sys|web-sys|getrandom) ' <<<"$tree"; then
            echo "a browser or host crate reached a native host's tree"; exit 1
          fi

      - name: The consumer, as a crate outside the checkout
        run: |
          ws="$PWD"
          host="$RUNNER_TEMP/host"
          mkdir -p "$host"
          cp -R engine-rs/consumer/Cargo.toml engine-rs/consumer/Cargo.lock engine-rs/consumer/src "$host/"
          sed -i "s|^verticopolis-engine = { path = \"..\", |verticopolis-engine = { path = \"$ws/engine-rs\", |" "$host/Cargo.toml"
          grep -qx "verticopolis-engine = { path = \"$ws/engine-rs\", features = \[\"conformance\"\] }" "$host/Cargo.toml"
          # The suite under another name, as a packaged copy would be: a
          # fixture resolves inside whatever directory holds the suite.
          suite="$RUNNER_TEMP/suite-copy"
          rm -rf "$suite"
          cp -R conformance "$suite"
          cd "$host"
          VC_CONFORMANCE="$suite" cargo test --locked
          cargo run --locked --release -- "$suite"

      # A cancelled run can skip every step above and still leave the job
      # green, which would pass the required check unchecked. Fail instead.
      - name: Fail a cancelled run
        if: ${{ cancelled() }}
        run: exit 1

  engine-rs:
    needs: changes
    # Fail closed: run unless the filter succeeded and found no engine file.
    # always() rather than !cancelled(): a skipped required job counts as
    # passed, so a run cancelled before this job starts must not skip it.
    # Its last step fails the job if the run was cancelled.
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.engine == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: engine-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ubuntu-latest ships a stable toolchain through rustup; pin the channel
      # the crate was written against rather than whatever the image happens
      # to carry. Every cargo step runs --locked so a stale Cargo.lock fails
      # the run instead of being rewritten on the runner.
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          rustup default 1.97.0
          rustup target add wasm32-unknown-unknown

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features conformance -- -D warnings
          cargo clippy --locked --all-targets --features wasm -- -D warnings
          cargo clippy --locked --lib --target wasm32-unknown-unknown --features wasm -- -D warnings

      - name: Unit tests
        run: |
          cargo test --locked
          cargo test --locked --features conformance
          cargo test --locked --features wasm

      - name: Conformance
        run: cargo run --locked --release --features conformance --bin conformance

      # The referee again, through the WASM binding from Node: the same
      # TypeScript runner replays every scenario on the module wasm-bindgen
      # generates (story-engine-wasm-binding), and the dual run's day gate
      # (story-engine-dual-run) compares both engines every hour for a day on
      # every fixture at each game speed. The CLI version must match the
      # crate version Cargo.toml pins, so the pin is read from there and
      # scripts/wasm-build.ts checks the match. The CLI is compiled from
      # source here (a few minutes); the job's timeout allows for it.
      - name: WASM binding
        run: |
          pin="$(grep -m1 -oP '^wasm-bindgen = \{ version = "=\K[0-9.]+' Cargo.toml)"
          test -n "$pin"
          cargo install wasm-bindgen-cli --locked --version "$pin"
      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Conformance through the binding
        working-directory: .
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          # A missing package fails the suite here instead of skipping it.
          VC_REQUIRE_WASM: "1"
        run: |
          npm ci
          npm run wasm:build
          # The checked-in declarations have to be the ones this build wrote.
          test -z "$(git status --porcelain -- src/dualrun/engine.d.ts src/engine/gameplayEvents.d.ts src/engine/gameplayEventRules.ts)" || { echo "src/dualrun/engine.d.ts, src/engine/gameplayEvents.d.ts or src/engine/gameplayEventRules.ts is stale or untracked: run npm run wasm:build and commit them"; exit 1; }
          npm run test:wasm

      # Coverage of the unit tests plus the referee, with a line floor that
      # only ratchets up as scenarios land (80.58% at the first measurement,
      # 84.47% after the first scenario slice, 88.7% with the full library; the
      # floor sits about a point and a half under the measurement).
      # The referee is replayed in the debug profile here so one report
      # merges both runs; the release replay above is the parity gate.
      - name: Coverage
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked --version 0.9.1
          cargo llvm-cov --no-report --locked test --features conformance
          cargo llvm-cov --no-report --locked run --features conformance --bin conformance
          cargo llvm-cov report --fail-under-lines 87

      # A cancelled run can skip every step above and still leave the job
      # green, which would pass the required check unchecked. Fail instead.
      - name: Fail a cancelled run
        if: ${{ cancelled() }}
        run: exit 1
