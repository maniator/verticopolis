name: Analytics Report

# Twice-weekly rollup of the Verticopolis custom events (see src/analytics.ts).
# Two reports run side by side through the PostHog migration:
#   - scripts/posthog-report.mjs  (PostHog / HogQL, exact percentiles + per-session
#     and per-tool splits) is the report going forward.
#   - scripts/analytics-report.mjs  (Vercel Web Analytics) stays until S6 retires
#     the Vercel path, so the two can be compared during the cutover.
# Each renders its report inline into the run's job summary (viewable with no
# download) and uploads the styled HTML as a downloadable artifact; the raw
# responses print to the run log. Both are read-only and write nothing to the repo.
#
# Secrets / vars:
#   POSTHOG_PERSONAL_API_KEY  (secret)  a phx_... personal API key with query:read.
#   POSTHOG_PROJECT_ID        (var, optional)  defaults to 524085.
#   POSTHOG_HOST              (var, optional)  defaults to https://us.posthog.com.
#   VERCEL_TOKEN              (secret)  Vercel > Account Settings > Tokens (team).
# The Vercel project and team IDs are not secrets.

on:
  schedule:
    # Tuesdays and Fridays at 13:00 UTC.
    - cron: "0 13 * * 2,5"
  workflow_dispatch:
    inputs:
      window:
        description: "Look-back window: days by default (30, 0.5), or with a unit (12h, 3d). Minimum 1 hour, maximum 365 days; an invalid value fails the run. The Vercel report rounds sub-day windows up to 1 day."
        required: false
        default: "30"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Generate PostHog report
        # The dispatch input goes through env, never interpolated into the shell
        # command, so a crafted "window" value can't inject into the run step.
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID || '524085' }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://us.posthog.com' }}
          WINDOW_INPUT: ${{ github.event.inputs.window || '30' }}
        run: node scripts/posthog-report.mjs --window "$WINDOW_INPUT" --out reports

      - name: Generate Vercel report (retires at S6)
        # Kept alongside the PostHog report until S6 removes the Vercel path, so the
        # two can be compared during the cutover. Same env-not-shell rule as above.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_06eFZFQdFZ49EiEWmXkkphKAOSSF
          VERCEL_TEAM_ID: team_ArE8nhexpkACNIlDHVKU80Pj
          WINDOW_INPUT: ${{ github.event.inputs.window || '30' }}
        run: node scripts/analytics-report.mjs --window "$WINDOW_INPUT" --out reports

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analytics-report
          path: reports/
          retention-days: 90
