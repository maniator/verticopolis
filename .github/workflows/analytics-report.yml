name: Analytics Report

# Twice-weekly rollup of the Verticopolis custom events (see src/analytics.ts),
# rendered by scripts/posthog-report.mjs (PostHog / HogQL: exact percentiles
# plus per-session and per-tool splits). The report renders inline into the
# run's job summary (viewable with no download) and uploads the styled HTML as
# a downloadable artifact; the raw responses print to the run log. Read-only,
# writes nothing to the repo.
#
# The Vercel Web Analytics report that used to run alongside this one was
# retired in PR #692 (owner ruling, ahead of the S6 story that planned it);
# the client-side dual-write and the Speed Insights keep-or-drop call remain
# with S6 in the analytics migration epic.
#
# Secrets / vars:
#   POSTHOG_PERSONAL_API_KEY  (secret)  a phx_... personal API key with query:read.
#   POSTHOG_PROJECT_ID        (var, optional)  defaults to 524085.
#   POSTHOG_HOST              (var, optional)  defaults to https://us.posthog.com.

on:
  schedule:
    # Tuesdays and Fridays at 13:00 UTC.
    - cron: "0 13 * * 2,5"
  workflow_dispatch:
    inputs:
      window:
        description: "Look-back window: days by default (30, 0.5), or with a unit (12h, 3d). Minimum 1 hour, maximum 365 days; an invalid value fails the run."
        required: false
        default: "30"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Generate PostHog report
        # The dispatch input goes through env, never interpolated into the shell
        # command, so a crafted "window" value can't inject into the run step.
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID || '524085' }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST || 'https://us.posthog.com' }}
          WINDOW_INPUT: ${{ github.event.inputs.window || '30' }}
        run: node scripts/posthog-report.mjs --window "$WINDOW_INPUT" --out reports

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: analytics-report
          path: reports/
          retention-days: 90
