name: Test CI

concurrency:
  # Cancel superseded PR runs; preserve main pushes for cache warming.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue tests each pull request on top of the latest main before it
  # lands, so a merge cannot turn main red. These runs report the same required
  # checks as the pull request run.
  merge_group:

# The default job (lint/typecheck/tests/build) needs no browser, and the e2e job
# runs inside the pinned Playwright image whose Chromium is already bundled, so
# skip Playwright's browser download during `npm ci` workflow-wide. The docs
# gallery is regenerated on a PR by pr-drift-check.yml (its approval-gated commit),
# not here.
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

# Least privilege for every job: this workflow only checks out and tests code,
# so nothing here ever needs more than read access to the repo contents. The
# jobs below restate it where they predate this block; the workflow-level
# default is what guarantees a future job cannot silently inherit a wider
# repo-default token scope.
permissions:
  contents: read

jobs:
  # Two tiers: the WASM/browser checks need application inputs (code), while
  # lint/unit/build also cover README, changelog and backlog inputs (tests).
  # CI-only automation/config/docs do not need either tier. The required job
  # names remain visible via no-op successes, never missing statuses.
  # Unknown paths, main pushes, and failed file lookups run full validation.
  # Process old rename paths too, so moving code cannot bypass these gates.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          # Each line is "F <path>" for a changed file or "P <path>" for the old
          # path of a rename, so a file moved out of a code path still counts.
          # A pull request lists its own files; a merge queue entry lists what
          # it adds to main (the compare API, which stops at 300 files).
          list="$RUNNER_TEMP/changed-files"
          if [ "$EVENT" = "pull_request" ] && [ -n "$PR_NUMBER" ]; then
            limit=3000
            listed() { gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq ".[] | $1"; }
          elif [ "$EVENT" = "merge_group" ] && [ -n "$QUEUE_BASE" ] && [ -n "$QUEUE_HEAD" ]; then
            limit=300
            listed() { gh api "repos/$REPO/compare/$QUEUE_BASE...$QUEUE_HEAD" --jq ".files[]? | $1"; }
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! listed '"F " + .filename, (if .previous_filename then "P " + .previous_filename else empty end)' > "$list"; then
            echo "::warning::could not list the changed files; running every job"
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Past the API's listing limit, the change runs everything.
          if [ "$(grep -c '^F ' "$list" || true)" -ge "$limit" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          tests=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/screenshots/*) code=true ;; # the help media the app builds in
              docs/* | _bmad-output/*) ;;
              .github/workflows/test.yml) code=true ;; # exercise changes to this CI gate
              .github/workflows/* | .github/ISSUE_TEMPLATE/* | .github/dependabot.yml | .pr_agent.toml) ;;
              */*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
            case "$f" in
              .github/workflows/test.yml) tests=true ;;
              .github/workflows/* | .github/ISSUE_TEMPLATE/* | .github/dependabot.yml | .pr_agent.toml | docs/ci/*) ;;
              *) tests=true ;;
            esac
          done < <(sed 's/^[FP] //' "$list")
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "application paths changed: $code; lint/unit/build inputs changed: $tests"

  # The Rust engine's WASM package (src/public/engine/, engine-rs/pkg/) is build
  # output and is not checked in. This job restores it from the Actions cache,
  # keyed on the engine's source hash, or builds and caches it on a miss (an
  # engine change), then hands it to the e2e job as a run artifact: e2e serves
  # it to the browser projects, and its container has no Rust toolchain to
  # build it. The test job needs no package (its hash test skips without one),
  # so lint, typecheck and the unit tests never wait on a Rust build.
  engine-wasm:
    needs: changes
    # Skipped only on a successful "false" from the filter (prose-only change).
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # A cache miss compiles the crate (a few minutes); anything near this is a hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - uses: ./.github/actions/engine-wasm
        with:
          artifact-name: engine-wasm

      # Build the tooling app once and share it with both browser jobs.
      # This artifact carries checksums and source SHA so consumers verify
      # they are testing an immutable build from this exact commit.
      - name: Install dependencies
        run: npm ci

      - name: Build tooling app
        run: npm run build
        env:
          VC_TOOLING: "1"

      - name: Pack tooling app
        shell: bash
        run: |
          tar -C dist -czf "$RUNNER_TEMP/tooling-dist.tgz" .
          (
            cd "$RUNNER_TEMP"
            sha256sum tooling-dist.tgz > tooling-dist.tgz.sha256
          )
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/tooling-dist.source-sha"

      - name: Upload tooling app artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tooling-dist
          overwrite: true
          path: |
            ${{ runner.temp }}/tooling-dist.tgz
            ${{ runner.temp }}/tooling-dist.tgz.sha256
            ${{ runner.temp }}/tooling-dist.source-sha
          if-no-files-found: error

  test:
    needs: changes
    # Even a failed classifier must not silently suppress this required check.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # About ten minutes at the slowest in the last two days.
    timeout-minutes: 30

    steps:
      - name: No test-relevant files changed
        if: ${{ needs.changes.outputs.tests == 'false' }}
        run: echo "Only unrelated CI metadata/docs changed; lint, unit tests and build skipped."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.changes.outputs.tests != 'false' }}

      - name: Use Node.js (from .nvmrc)
        if: ${{ needs.changes.outputs.tests != 'false' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        if: ${{ needs.changes.outputs.tests != 'false' }}
        run: npm ci

      - name: Lint
        if: ${{ needs.changes.outputs.tests != 'false' }}
        run: npm run lint

      - name: Typecheck
        if: ${{ needs.changes.outputs.tests != 'false' }}
        run: npm run typecheck

      # engine conformance (holidays-classic runs 720 in-game hours of a large
      # tower, 15 s of CPU alone) is excluded here and runs in the next step.
      # Under v8 coverage with the other test files running beside it, it took
      # 61 s against its 60 s limit and failed unrelated PRs. Keep the scenario
      # in the separate no-coverage step, which CI executes directly (on the
      # integrationWasm leg below, so it runs in parallel with this one). The same
      # holds for two long port-kit suites: condoRelocationEngine (30 years of
      # hourly ticks, about 60 s locally, 390 s under coverage against its
      # 300 s limit) and roomCountsEngine (a check after every step on three
      # conformance towers, 225 s under coverage against 300 s).
      - name: Run tests
        if: ${{ needs.changes.outputs.tests != 'false' }}
        run: npm run test:coverage -- --run --exclude '**/conformance.integration.test.ts' --exclude '**/condoRelocationEngine.integration.test.ts' --exclude '**/roomCountsEngine.integration.test.ts'

      # The three excluded suites run without coverage on the integrationWasm
      # leg of test-wasm-parity, beside this job instead of after it.

      # This job only proves the bundle builds, with no engine package (the e2e
      # job below builds with one), so it opts out of the engine requirement
      # scripts/verify-precache.ts puts on every build.
      - name: Build
        if: ${{ needs.changes.outputs.tests != 'false' }}
        run: npm run build
        env:
          VC_ALLOW_NO_ENGINE: "1"

      # Versions move only in a release PR; a feature PR adds a .changes note
      # instead (CONTRIBUTING.md "Versioning"). The checkout is the PR's merge
      # commit, so its first parent is main as the PR would merge into it. It runs
      # last and after a failed step too, so a missing note never hides a test result.
      - name: Versions and change notes
        if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.tests != 'false' }}
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch --no-tags --quiet --depth=2 origin "$GITHUB_SHA"
          node scripts/version-check.ts --base HEAD^1 --branch "$HEAD_REF"

  # The suites that need the Rust/WASM engine package, with the package
  # required (VC_REQUIRE_WASM=1), so a missing one fails instead of skipping.
  # Until #1421 these legs ran the unit and integration suites again with
  # every Simulation hosted on the engine (the unitWasm and integrationWasm
  # Vitest projects); the legs keep those names because the two checks are
  # required for merging. The unitWasm leg runs the unit tests, which include
  # the engine package's own (they skip in the plain unit job); the
  # integrationWasm leg runs the host suites below. Runs after engine-wasm,
  # so the package comes from the cache it filled.
  test-wasm-parity:
    needs: [changes, engine-wasm]
    # A matrix job that is skipped as a whole reports under its unexpanded
    # name, and the two required checks are named per leg. So the legs always
    # run on a prose-only change and skip their steps, which keeps both names
    # reporting. With code changed, a failed engine package skips them as it
    # always has.
    if: ${{ !cancelled() && (needs.changes.outputs.code == 'false' || needs.engine-wasm.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: [unitWasm, integrationWasm]
    steps:
      - name: No code changed, nothing to run
        if: ${{ needs.changes.outputs.code == 'false' }}
        run: echo "Only prose changed; the WASM engine suites are skipped."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.changes.outputs.code != 'false' }}
        with:
          persist-credentials: false

      - name: Use Node.js (from .nvmrc)
        if: ${{ needs.changes.outputs.code != 'false' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        if: ${{ needs.changes.outputs.code != 'false' }}
        run: npm ci

      - uses: ./.github/actions/engine-wasm
        if: ${{ needs.changes.outputs.code != 'false' }}

      - name: Unit tests with the engine package required
        if: ${{ needs.changes.outputs.code != 'false' && matrix.project == 'unitWasm' }}
        env:
          VC_REQUIRE_WASM: "1"
          VC_LOG_TEST_STARTS: "1"
        run: npx vitest run --project unit

      # The two halves of `npm run test:wasm` used to run one after the other
      # on the integrationWasm leg. The port-kit suites run on this leg
      # instead, and the no-coverage engine conformance from the test job
      # runs on the integrationWasm leg, so the two legs take about the same
      # time (about 8 minutes each).
      - name: Port-kit suites
        if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && matrix.project == 'unitWasm' }}
        run: npm run test:port

      # The suites that start the Rust engine themselves (conformance, the
      # goldens, perf comparison), run once, on the integrationWasm leg; the
      # Rust workflow does not repeat this test:wasm script. The script's
      # test:port half runs on the unitWasm leg.
      # This step has its own timeout and logs each test start (#1152). With
      # both diagnostics corpus differentials in it (#1811), the step takes
      # 4.5 to 8.5 minutes, depending on the runner, so the timeout leaves
      # room above the slowest run seen and for the next corpus differential.
      - name: Host suites on the WASM engine
        if: ${{ needs.changes.outputs.code != 'false' && matrix.project == 'integrationWasm' }}
        timeout-minutes: 18
        env:
          VC_LOG_TEST_STARTS: "1"
        run: npm run test:wasm:host

      - name: Engine conformance (no coverage)
        if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.tests != 'false' && matrix.project == 'integrationWasm' }}
        run: npm exec --no -- vitest run --project integration conformance.integration condoRelocationEngine roomCountsEngine

  # Resolve the Playwright container tag from the repo's own Playwright version so
  # the e2e job's browser can never drift from the one baselines were minted with
  # the whole basis of a stable visual gate. (container.image is fixed before a
  # job's steps run, so the tag has to come from a prior job's output.)
  resolve-image:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      image: ${{ steps.pin.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pin
        run: |
          ver=$(node -e "const l=require('./package-lock.json');const p=l.packages&&l.packages['node_modules/playwright'];process.stdout.write((p&&p.version)||require('./package.json').devDependencies.playwright.replace(/[^0-9.]/g,''))")
          echo "image=mcr.microsoft.com/playwright:v${ver}-jammy" >> "$GITHUB_OUTPUT"

  # Tier-2 end-to-end smoke: drive the BUILT app in a real browser and prove the
  # TOWER win surfaces (the congratulations modal), plus the visual.spec.ts pixel
  # baselines. Runs INSIDE the pinned Playwright image, the same Chromium build
  # update-visual-baselines and the screenshot capture (screenshot-capture.yml) use,
  # so the baselines it compares against are minted against the identical renderer. Kept
  # in its own job so the container pull never slows the fast lint/test lane.
  e2e:
    needs: [changes, resolve-image, engine-wasm]
    # Skipped only for a prose-only change; a skipped job counts as passed for
    # the required check. With code changed, a failed engine package or image
    # lookup fails this job instead of skipping it.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: ${{ needs.resolve-image.outputs.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image ships Node 20; install the repo's pinned Node over it (keeping
      # the image's browsers) so every job runs the same Node the tests expect.
      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download tooling app artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tooling-dist
          path: ${{ runner.temp }}/tooling-dist

      - name: Verify and unpack tooling app
        shell: bash
        run: |
          cd "$RUNNER_TEMP/tooling-dist"
          sha256sum -c tooling-dist.tgz.sha256
          test "$(< tooling-dist.source-sha)" = "$GITHUB_SHA"
          rm -rf "$GITHUB_WORKSPACE/dist"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          tar -C "$GITHUB_WORKSPACE/dist" -xzf tooling-dist.tgz

      - name: Run end-to-end tests
        run: npm run e2e -- --project=chromium-serial

      # The E5-S0 perf gate: run the ui.update micro-benchmark, the throttled
      # end-to-end speed probe, and the node-identity check against the committed
      # baseline (e2e/perf/baseline.json). Runs in the SAME pinned container the
      # baseline was minted in, so the numbers are comparable. When no baseline is
      # committed yet, the spec captures one and skips the assertions (bootstrap),
      # so this is inert until update-perf-baseline.yml mints the reference set.
      #
      # The committed baseline is the Rust engine's, minted by
      # update-perf-baseline.yml.
      - name: Perf gate (E5-S0)
        run: npm run perf

      # When a visual baseline (visual.spec.ts) fails, Playwright writes the
      # actual/expected/diff triplet to test-results/, upload it so the drift
      # can be reviewed (and, if intentional, adopted as the new baseline)
      # without rerunning locally.
      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-visual-diffs
          path: test-results/
          if-no-files-found: ignore

  # The player build, the one every deploy makes (src/build/engineBundle.ts):
  # the Rust/WASM engine is the only engine, with no runtime switch, none of
  # the TypeScript engine and no fallback. Its postbuild guard
  # (scripts/verify-engine-bundle.ts) reads the emitted sourcemaps and the
  # precache; this job also proves that guard fails when app code imports the
  # TypeScript step loop, then runs the general e2e suite (the `chromium`
  # project) on a tooling build. The `e2e` job above runs the
  # serial project: pixel baselines, the perf gate and the engine-status specs.
  e2e-wasm-only:
    # Not a required check. It runs in two shards on two runners, since one
    # worker on one runner took 13 to 18 minutes, the longest job on a pull
    # request. Each shard keeps one worker (see playwright.config.ts), so the
    # specs keep the timing they expect.
    needs: [changes, resolve-image, engine-wasm]
    # As the e2e job: skipped only for a prose-only change. It is not a
    # required check, so a merge queue run skips it; the pull request's own run
    # already ran it on the same change.
    if: ${{ !cancelled() && github.event_name != 'merge_group' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    permissions:
      contents: read
    container:
      image: ${{ needs.resolve-image.outputs.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - uses: ./.github/actions/engine-wasm-download
        with:
          artifact-name: engine-wasm

      # The player build, exactly as a deploy would make it, with every
      # postbuild check (the engine bundle guard among them). The tests run
      # on the tooling build below, so the player build and its canary run
      # on the first shard only.
      - name: Build (player)
        if: ${{ matrix.shard == 1 }}
        run: npm run build

      # A legacy import from app code (the alias only covers Simulation.ts's
      # own import) must fail the build with the guard's message.
      - name: The bundle guard catches a TypeScript step loop import
        if: ${{ matrix.shard == 1 }}
        shell: bash
        run: |
          cp src/bootstrap.ts "$RUNNER_TEMP/bootstrap.ts"
          # Put the file back however the step ends; the next build step then
          # rebuilds dist/ from the real source.
          trap 'cp "$RUNNER_TEMP/bootstrap.ts" src/bootstrap.ts' EXIT
          printf 'import { tick as legacyTick } from "./engine/sim/loop";\n(globalThis as unknown as { legacyTick?: unknown }).legacyTick = legacyTick;\n' >> src/bootstrap.ts
          if npm run build > canary.log 2>&1; then
            cat canary.log
            echo "::error::the build passed with the TypeScript step loop imported; scripts/verify-engine-bundle.ts missed it"
            exit 1
          fi
          grep -F "carries the TypeScript step loop (src/engine/sim/loop.ts)" canary.log

      - name: Download tooling app artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tooling-dist
          path: ${{ runner.temp }}/tooling-dist

      - name: Verify and unpack tooling app
        shell: bash
        run: |
          cd "$RUNNER_TEMP/tooling-dist"
          sha256sum -c tooling-dist.tgz.sha256
          test "$(< tooling-dist.source-sha)" = "$GITHUB_SHA"
          rm -rf "$GITHUB_WORKSPACE/dist"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          tar -C "$GITHUB_WORKSPACE/dist" -xzf tooling-dist.tgz

      # Playwright decides which shard gets milestones.spec.ts, so the shard
      # that lists it is the one whose upload must find the shots.
      - name: Does this shard run the milestone spec
        id: milestones
        shell: bash
        run: |
          npx playwright test --project=chromium --grep-invert @perf --shard=${{ matrix.shard }}/2 --list > "$RUNNER_TEMP/shard-list.txt"
          if grep -q 'milestones\.spec\.ts' "$RUNNER_TEMP/shard-list.txt"; then
            echo "here=true" >> "$GITHUB_OUTPUT"
          else
            echo "here=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run end-to-end tests (general suite)
        run: npx playwright test --project=chromium --grep-invert @perf --shard=${{ matrix.shard }}/2

      # Per-run visual proof of the ★-progression. milestones.spec.ts writes to
      # the untracked e2e/output/ dir (never the committed, human-blessed
      # docs/screenshots/milestones/ gallery, which only the pinned-container
      # pipeline may regenerate), and this uploads that per-run set.
      - name: Upload milestone screenshots
        if: ${{ always() && steps.milestones.outputs.here == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: milestone-screenshots
          path: e2e/output/milestones/
          if-no-files-found: error

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-wasm-only-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
