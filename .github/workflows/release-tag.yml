name: Release tags

# Tags each release when its release PR merges (CONTRIBUTING.md "Change notes
# and the release PR"), so every app and crate version gets a GitHub release
# without a maintainer pushing a tag:
#
# - an app version change in package.json tags v<version> on the merge commit
#   and dispatches github-release.yml for it, which publishes the release with
#   the version's player notes and then hands the tag to sprite-atlas.yml to
#   attach the sprite atlas, and dispatches deploy-production.yml, which
#   deploys production from the tag. A tag created with the
#   workflow token does not start a tag-push workflow, so this dispatches the
#   runs itself (a workflow_dispatch from the workflow token does run);
# - a crate version change in engine-rs/Cargo.toml publishes engine-v<version>
#   as its own release with that version's engine-rs/CHANGELOG.md section. It
#   is never marked Latest, so the app release stays the repo's Latest. It
#   carries the built WASM package (Node and browser builds) as a zip and as
#   the npm tarball, each with its checksum, and the crate release dispatches
#   engine-publish.yml, which waits for the owner's approval and then
#   publishes the crate to crates.io and that tarball to npm as
#   @verticopolis/engine. When the app version did not move, the crate tag
#   dispatches the production deploy.
#
# A tag or release that already exists is left alone, so a re-run is safe.
on:
  push:
    branches: [main]

permissions:
  contents: read

# No concurrency group on purpose: GitHub keeps one pending run per group, so a
# later push to main could replace a queued release merge's run, and that run
# would never be tagged. Each run acts only on its own push's version change and
# skips a tag or release that exists, so two runs at once cannot collide.

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the versions before and after the push
        id: versions
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          read_app() { node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8")).version)'; }
          read_crate() { awk '/^\[package\]/ { p = 1; next } /^\[/ { p = 0 } p && /^version *=/ { gsub(/.*= *"|".*/, ""); print; exit }'; }
          echo "app=$(read_app < package.json)" >> "$GITHUB_OUTPUT"
          echo "crate=$(read_crate < engine-rs/Cargo.toml)" >> "$GITHUB_OUTPUT"
          # A new branch or a force-push has no usable "before"; tag nothing then.
          if ! printf '%s' "$BEFORE" | grep -Eq '^[0-9a-f]{40}$' || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git fetch --no-tags --quiet --depth=1 origin "$BEFORE"; then
            echo "No previous main commit to compare with; tagging nothing."
            echo "compare=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "compare=true" >> "$GITHUB_OUTPUT"
          echo "app_was=$(git show "$BEFORE:package.json" | read_app)" >> "$GITHUB_OUTPUT"
          echo "crate_was=$(git show "$BEFORE:engine-rs/Cargo.toml" | read_crate)" >> "$GITHUB_OUTPUT"

      - name: Tag the app version and publish its release
        if: ${{ steps.versions.outputs.compare == 'true' && steps.versions.outputs.app != steps.versions.outputs.app_was }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.versions.outputs.app }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "::error::App version $VERSION is not a plain x.y.z."; exit 1; fi
          tag="v$VERSION"
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" > /dev/null 2>&1; then
            echo "$tag already exists; leaving it."
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
            echo "Tagged $tag at $GITHUB_SHA."
          fi
          gh workflow run github-release.yml --ref main -f tag="$tag"
          echo "Dispatched the GitHub release for $tag."
          gh workflow run deploy-production.yml --ref main -f tag="$tag"
          echo "Dispatched the production deploy for $tag."

      # The crate release carries the built WASM package. These steps run only
      # for a crate version change, and the package usually comes from the
      # cache the test runs already filled for this engine source.
      - name: Use Node.js (from .nvmrc)
        if: ${{ steps.versions.outputs.compare == 'true' && steps.versions.outputs.crate != steps.versions.outputs.crate_was }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        if: ${{ steps.versions.outputs.compare == 'true' && steps.versions.outputs.crate != steps.versions.outputs.crate_was }}
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Engine WASM package
        if: ${{ steps.versions.outputs.compare == 'true' && steps.versions.outputs.crate != steps.versions.outputs.crate_was }}
        uses: ./.github/actions/engine-wasm

      # The built player package: engine-rs/pkg-player (Node) and
      # src/public/engine (browser), without the binding's tier 3 ops (#1057), with their third-party records, as a zip and as the npm
      # tarball, each with a checksum, for the release. engine-publish.yml
      # publishes that tarball to npm, so the bytes on npm are the ones here.
      # scripts/engine-package-files.sh adds the package's own README and the
      # browser build's declarations from packages/verticopolis-engine/
      # (outside engine-rs/, so they do not move the engine's source hash),
      # the engine changelog and the license, and writes package.json.
      - name: Pack the engine
        id: pack
        if: ${{ steps.versions.outputs.compare == 'true' && steps.versions.outputs.crate != steps.versions.outputs.crate_was }}
        env:
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.versions.outputs.crate }}
        run: |
          set -euo pipefail
          mkdir -p npm/node npm/web
          cp -R engine-rs/pkg-player/. npm/node/
          cp -R src/public/engine/. npm/web/
          npm_name="$(sh scripts/engine-package-files.sh npm "$VERSION" "$GH_REPO")"
          zip="verticopolis-engine-wasm-$VERSION.zip"
          (cd npm && zip -qr "../$zip" node web README.md CHANGELOG.md LICENSE)
          sha256sum "$zip" > "$zip.sha256"
          # npm names the tarball after the package: verticopolis-engine-<version>.tgz.
          tgz="$(cd npm && npm pack --pack-destination .. --json | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename)')"
          test -f "$tgz"
          sha256sum "$tgz" > "$tgz.sha256"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"
          echo "npm=$npm_name" >> "$GITHUB_OUTPUT"

      - name: Tag the crate version and publish its release
        if: ${{ steps.pack.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.versions.outputs.crate }}
          ZIP: ${{ steps.pack.outputs.zip }}
          TGZ: ${{ steps.pack.outputs.tgz }}
          NPM_NAME: ${{ steps.pack.outputs.npm }}
        run: |
          set -euo pipefail
          tag="engine-v$VERSION"
          # A published release is left alone; a draft from a failed run is redone.
          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != "true" ]; then echo "$tag already has a release; leaving it."; exit 0; fi
            gh release delete "$tag" --yes
          fi
          # The version's section of the engine changelog, heading excluded.
          awk -v v="$VERSION" '/^## / { if (on) exit; if ($2 == v) { on = 1; next } } on' engine-rs/CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then echo "::error::engine-rs/CHANGELOG.md has no $VERSION section."; exit 1; fi
          {
            printf '\nThe crate is [`verticopolis-engine` %s](https://crates.io/crates/verticopolis-engine/%s) on crates.io, or `verticopolis-engine = { git = "https://github.com/%s", tag = "%s" }` through git.\n' "$VERSION" "$VERSION" "$GH_REPO" "$tag"
            printf '\n`%s` holds the built WASM package (`node/` for Node, `web/` for the browser) with its SHA-256 checksum beside it. The same build is [`%s@%s`](https://www.npmjs.com/package/%s/v/%s) on npm, published from `%s`.\n' "$ZIP" "$NPM_NAME" "$VERSION" "$NPM_NAME" "$VERSION" "$TGZ"
            printf '\nThe registry copies appear once the owner approves the publish run (`engine-publish.yml`).\n'
          } >> notes.md
          # Attach while a draft, then publish, so a published release is never edited.
          gh release create "$tag" --target "$GITHUB_SHA" --title "Engine crate $VERSION" --notes-file notes.md --latest=false --draft
          gh release upload "$tag" "$ZIP" "$ZIP.sha256" "$TGZ" "$TGZ.sha256"
          gh release edit "$tag" --draft=false --latest=false
          echo "Published $tag with $ZIP and $TGZ."

      # A release that raised only the crate still changes the engine the web
      # game ships, so it deploys too, from the crate tag the step above
      # created. An app release already dispatched its own deploy. A failed
      # crate release holds this deploy; re-run this workflow, or run Deploy
      # production by hand with the crate tag once it exists.
      - name: Deploy production for a crate-only release
        if: ${{ steps.pack.outcome == 'success' && steps.versions.outputs.app == steps.versions.outputs.app_was }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.versions.outputs.crate }}
        run: |
          set -euo pipefail
          tag="engine-v$VERSION"
          gh workflow run deploy-production.yml --ref main -f tag="$tag"
          echo "Dispatched the production deploy for $tag."

      # The registries: engine-publish.yml publishes the crate to crates.io
      # and the release's npm tarball to npm, each through trusted publishing
      # (a short-lived OIDC token, no stored registry token). Its publish jobs
      # wait on the `registry` environment, so nothing reaches a registry
      # until the owner approves that run. A run for a version a registry
      # already holds leaves that registry alone, so a re-run is safe.
      # Publishing is off until the owner turns it on: the step runs only
      # when the repository variable ENGINE_REGISTRY_PUBLISH is `on`, so a
      # release ships the game and its GitHub releases without touching a
      # registry (held while the engine and game repositories are split).
      - name: Hand the crate release to the registry publish
        if: ${{ steps.pack.outcome == 'success' && vars.ENGINE_REGISTRY_PUBLISH == 'on' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.versions.outputs.crate }}
        run: |
          set -euo pipefail
          gh workflow run engine-publish.yml --ref main -f version="$VERSION"
          echo "Dispatched the registry publish for $VERSION; it waits for approval in the registry environment."

      - name: Note that the registry publish is off
        if: ${{ steps.pack.outcome == 'success' && vars.ENGINE_REGISTRY_PUBLISH != 'on' }}
        env:
          VERSION: ${{ steps.versions.outputs.crate }}
        run: echo "::notice::Registry publishing is off (repository variable ENGINE_REGISTRY_PUBLISH is not 'on'), so $VERSION was not handed to engine-publish.yml."
