name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/engine-wasm/**
      - scripts/build-engine-wasm.sh
      - scripts/wasm-build.ts
      - src/wasmhost/packageHash.ts
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/engine-wasm/**
      - scripts/build-engine-wasm.sh
      - scripts/wasm-build.ts
      - src/wasmhost/packageHash.ts

# Least privilege at the workflow level too (the job below restates it): setup
# only checks out and builds, so read access to contents is all it ever needs.
permissions:
  contents: read

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      # If you want to clone the repository as part of your setup steps, for example to install dependencies, you'll need the `contents: read` permission. If you don't clone the repository in your setup steps, Copilot will do this for you automatically after the steps complete.
      contents: read

    # You can define any steps you want, and they will run before the agent starts.
    # If you do not check out your code, Copilot will do this for you.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js (from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install JavaScript dependencies
        run: npm ci

      # The engine's WASM package (src/public/engine/, engine-rs/pkg/) is build
      # output, not checked in: restore it from the Actions cache, or build it,
      # so `?engine=wasm`, the e2e chromium-wasm project and the WASM test
      # suites work for the agent. continue-on-error for the same reason as the
      # Rust steps below: the TypeScript side must still start (without the
      # package, npm test skips the package's hash test).
      - name: Engine WASM package
        continue-on-error: true
        uses: ./.github/actions/engine-wasm

      # A tooling build, so an agent that runs `npm run e2e` against this dist
      # gets the `window.game` handle the specs depend on (production builds
      # compile it away).
      - name: Build TypeScript project
        run: npm run build
        env:
          VC_TOOLING: "1"

      # The Rust engine (engine-rs/) builds on the same toolchain engine-rs.yml
      # pins, with the conformance referee compiled in release so an agent can
      # run `cargo run --release --bin conformance` at once. Each step is
      # continue-on-error: a toolchain hiccup must not keep the agent from
      # starting on the TypeScript side.
      - name: Rust toolchain (pinned to engine-rs.yml)
        continue-on-error: true
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          rustup default 1.97.0

      - name: Build Rust engine and referee
        continue-on-error: true
        working-directory: engine-rs
        run: |
          cargo build --locked --all-targets
          cargo build --locked --release --bin conformance --bin dump
