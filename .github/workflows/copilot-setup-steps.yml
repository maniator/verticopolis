name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - tools/agent-env/pinned.sh
      - package.json
      - package-lock.json
      - scripts/engine-install.ts
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - tools/agent-env/pinned.sh
      - package.json
      - package-lock.json
      - scripts/engine-install.ts

# Least privilege at the workflow level too (the job below restates it): setup
# only checks out and builds, so read access to contents is all it ever needs.
permissions:
  contents: read

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      # If you want to clone the repository as part of your setup steps, for example to install dependencies, you'll need the `contents: read` permission. If you don't clone the repository in your setup steps, Copilot will do this for you automatically after the steps complete.
      contents: read

    # You can define any steps you want, and they will run before the agent starts.
    # If you do not check out your code, Copilot will do this for you.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js (from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install JavaScript dependencies
        run: npm ci

      # npm ci installs the engine packages from npm (its postinstall copies
      # the browser build into src/public/engine/, scripts/engine-install.ts),
      # so the game, the e2e projects and the engine test suites work for the
      # agent with nothing to compile.

      # A tooling build, so an agent that runs `npm run e2e` against this dist
      # gets the `window.game` handle the specs depend on (production builds
      # compile it away).
      - name: Build TypeScript project
        run: npm run build
        env:
          VC_TOOLING: "1"

      # The pinned Playwright image, so the agent can render the screenshot
      # gallery and the visual baselines the way CI does with
      # tools/agent-env/pinned.sh. continue-on-error: a registry hiccup must not
      # keep the agent from starting.
      - name: Pull the pinned Playwright image
        continue-on-error: true
        run: docker pull "$(bash tools/agent-env/pinned.sh --image)"
