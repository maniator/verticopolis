name: Welcome first-time contributors

# Thanks a person on their first pull request or first issue in this
# repository, and points them at CONTRIBUTING.md and the "good first issue"
# and "help wanted" lists so they can find something else to work on. The
# rules are in src/build/firstContribution.ts (with its tests), and the
# messages are in .github/welcome/.
#
# An opened issue runs from the default branch with a write token, so it is
# welcomed at once. A first pull request almost always comes from a fork,
# whose pull_request run gets a read-only token, and GitHub blocks
# pull_request_target on public repositories from 2026-12-02, so pull
# requests are welcomed by an hourly sweep from main over those opened in the
# last few days instead. The checkout is the default branch's own commit,
# never a pull request's head, and nothing from a pull request runs. Event
# values reach the script only through environment variables or the API,
# never interpolated into it.
on:
  issues:
    types: [opened]
  schedule:
    # Hourly at minute 23.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the welcomes without posting any"
        type: boolean
        default: false

concurrency:
  group: first-contribution-${{ github.event.issue.number || 'sweep' }}
  cancel-in-progress: false

# Commenting on a pull request goes through the issues endpoint, but GitHub
# checks pull requests against the pull-requests permission there.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  welcome:
    if: github.repository == 'Verticopolis/web'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Welcome the author if this is their first issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
          AUTHOR_TYPE: ${{ github.event.issue.user.type }}
          ASSOCIATION: ${{ github.event.issue.author_association }}
        run: node scripts/first-contribution.ts

      - name: Welcome the authors of new first pull requests
        if: github.event_name != 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: node scripts/first-contribution.ts --sweep $DRY_RUN
