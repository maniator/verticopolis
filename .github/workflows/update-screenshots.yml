name: Update screenshots

# Regenerates the committed docs gallery (docs/screenshots/**) with the SINGLE
# generator, scripts/screenshots.ts, running INSIDE the official Playwright
# Docker image, the same image `npm run screenshots` uses locally, pinned to the
# repo's own Playwright version. Chromium build + container fonts decide
# antialiasing, so this is the one way a local run and CI produce byte-identical
# PNGs. The refreshed shots come back as a bot commit on the same branch.
#
# Trigger by pushing so the HEAD commit's message contains "[update-screenshots]"
# (only the head commit of the push is checked), or run it by hand from the
# Actions tab. The bot pushes with GITHUB_TOKEN, which never triggers workflows,
# so the screenshot commit gets no CI run of its own, push once more after
# pulling it to get a green check on the final head.

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

# SHARED with update-visual-baselines.yml: the two bot workflows both commit to
# this branch, so they must never run at the same time or they'd race on push.
# One group + cancel-in-progress:false serializes them (the second queues behind
# the first); the second then checks out the first's commit (ref below) and
# fast-forwards. cancel-in-progress is false so a queued regen is never dropped.
concurrency:
  group: regen-ci-artifacts-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Resolve the container tag from the repo's Playwright version so the image can
  # never drift from the browser `npm ci` installs, the whole basis of stable
  # pixels. (container.image is set before steps run, so it must come from a
  # prior job's output, not a step in the same job.)
  resolve-image:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[update-screenshots]')
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.pin.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: |
          ver=$(node -e "const l=require('./package-lock.json');const p=l.packages&&l.packages['node_modules/playwright'];process.stdout.write((p&&p.version)||require('./package.json').devDependencies.playwright.replace(/[^0-9.]/g,''))")
          echo "image=mcr.microsoft.com/playwright:v${ver}-jammy" >> "$GITHUB_OUTPUT"

  screenshots:
    needs: resolve-image
    runs-on: ubuntu-latest
    # Every step runs inside the pinned Playwright image, the browser + fonts
    # that make the output reproducible.
    container:
      image: ${{ needs.resolve-image.outputs.image }}
    env:
      # Browsers already ship in the image; don't re-download them on npm ci.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      # Check out the branch TIP (not the triggering SHA) with full history: when
      # this run is queued behind the sibling baselines run, the tip already has
      # that run's commit, so the push here fast-forwards. Full history (depth 0)
      # also lets the rebase-retry below reconcile cleanly if anything did land.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # A container checkout trips git's dubious-ownership guard; mark the tree safe
      # so the later add/commit/push work.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The Playwright jammy image ships Node 20, but scripts/screenshots.ts is
      # run directly (native TS type-stripping) which needs Node ≥ 22.18, install
      # the repo's pinned Node over the image's, keeping the image's browsers.
      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Capture every screenshot
        run: |
          export PW_CHROME="$(ls -d /ms-playwright/chromium-*/chrome-linux*/chrome | head -1)"
          RUN_SERVER=1 node scripts/screenshots.ts

      - name: Commit refreshed screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots already match this environment, nothing to commit."
            exit 0
          fi
          git commit -m "Update screenshots from CI"
          # The sibling baselines workflow may push concurrently; it touches only
          # e2e/visual.spec.ts-snapshots (disjoint from docs/screenshots), so a
          # rejected push just needs a rebase over its commit, then retry.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push rejected, rebasing on the remote and retrying ($attempt)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "could not push refreshed screenshots after retries" >&2
          exit 1
