name: Update screenshots

# Regenerates the committed docs gallery (docs/screenshots/**) via the SHARED
# reusable capture (screenshot-capture.yml), the SAME one pr-drift-check.yml uses,
# so the two workflows can never drift on HOW pixels are generated or how
# nondeterminism is caught. The generator (scripts/screenshots.ts) runs inside the
# official Playwright Docker image pinned to the repo's own Playwright version:
# Chromium build + container fonts decide antialiasing, so regenerating here (not
# on a laptop) is what keeps the committed PNGs reproducible. The local
# `npm run screenshots` is only a host-Chromium preview and is NOT canonical.
#
# Trigger by pushing so the HEAD commit's message contains "[update-screenshots]"
# (only the head commit of the push is checked), or run it by hand from the
# Actions tab. This marker path is DELIBERATELY KEPT (it is complementary to the
# per-PR pr-drift-check.yml, not redundant): it regenerates on any branch, with no
# open PR, as a force-refresh, or for a pixel change that arrives via a non-gated
# path (a Playwright/font/dependency bump). The bot pushes with GITHUB_TOKEN,
# which never triggers workflows, so the screenshot commit gets no CI run of its
# own; push once more after pulling it to get a green check on the final head.
#
# DETERMINISM GUARD (do NOT weaken): a regen must only change pixels when the UI
# actually changed. The shared `capture` renders every shard TWICE and FAILS if
# the two renders differ byte-for-byte (nondeterminism, e.g. a wall-clock read
# leaking into a capture: code review twice missed exactly that). So this workflow
# only ever commits a set proven deterministic by the capture. Do NOT "optimize"
# the capture down to a single render or a subset of scenes.

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

# SHARED with update-visual-baselines.yml: the two bot workflows both commit to
# this branch, so they must never run at the same time or they'd race on push.
# One group + cancel-in-progress:false serializes them (the second queues behind
# the first); the second then checks out the first's commit and fast-forwards.
concurrency:
  group: regen-ci-artifacts-${{ github.ref }}
  cancel-in-progress: false

# Default read-only; only the commit job requests contents:write.
permissions:
  contents: read

jobs:
  # Shared, sharded, self-verifying capture. Gated on the marker/dispatch. It
  # renders each shard twice and hard-fails on nondeterminism, so nothing is
  # committed unless the generator agreed with itself. Read-only (runs the
  # generator, i.e. repo code, so no write token).
  capture:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[update-screenshots]')
    uses: ./.github/workflows/screenshot-capture.yml
    with:
      ref: ${{ github.ref_name }}
    permissions:
      contents: read

  # Assemble the verified shard sets into the committed gallery and push. Rebuilds
  # from scratch (rm the generated PNGs, then overlay every shard) so a removed
  # scene's stale file is pruned while tracked non-generated files (e.g.
  # features/README.md) are preserved. Runs no repo code beyond git/jq/cp, so its
  # write token is never exposed to generator execution.
  commit:
    needs: capture
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SHARDS_JSON: ${{ needs.capture.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download the shard artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/dl
          pattern: shots-*

      - name: Commit refreshed screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Require EVERY expected shard present before touching the tree, so a
          # download failure can never commit a partial gallery.
          expected=$(echo "$SHARDS_JSON" | jq 'length')
          assembled=0
          for shard in $(echo "$SHARDS_JSON" | jq -r '.[]'); do
            [ -d "/tmp/dl/shots-$shard/shots/docs/screenshots" ] && assembled=$((assembled + 1))
          done
          if [ "$assembled" -ne "$expected" ]; then
            echo "::error::expected $expected shard galleries but found $assembled; a capture, upload, or download step must have failed."
            exit 1
          fi
          find docs/screenshots -type f -name '*.png' -delete
          for shard in $(echo "$SHARDS_JSON" | jq -r '.[]'); do
            src="/tmp/dl/shots-$shard/shots/docs/screenshots"
            [ -d "$src" ] && cp -a "$src/." docs/screenshots/
          done
          git add -A docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots already match this environment, nothing to commit."
            exit 0
          fi
          git commit -m "Update screenshots from CI"
          # The sibling baselines workflow may push concurrently; it touches only
          # e2e/visual.spec.ts-snapshots (disjoint from docs/screenshots), so a
          # rejected push just needs a rebase over its commit, then retry.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push rejected, rebasing on the remote and retrying ($attempt)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "could not push refreshed screenshots after retries" >&2
          exit 1
