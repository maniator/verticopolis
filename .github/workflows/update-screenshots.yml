name: Update screenshots

# Regenerates the committed docs gallery (docs/screenshots/**) with the SINGLE
# generator, scripts/screenshots.ts, running INSIDE the official Playwright
# Docker image pinned to the repo's own Playwright version. Chromium build +
# container fonts decide antialiasing, so regenerating here (not on a laptop) is
# what keeps the committed PNGs reproducible. The local `npm run screenshots` is
# only a host-Chromium preview and its pixels are NOT canonical. The refreshed
# shots come back as a bot commit on the same branch.
#
# Trigger by pushing so the HEAD commit's message contains "[update-screenshots]"
# (only the head commit of the push is checked), or run it by hand from the
# Actions tab. The bot pushes with GITHUB_TOKEN, which never triggers workflows,
# so the screenshot commit gets no CI run of its own, push once more after
# pulling it to get a green check on the final head.
#
# DETERMINISM GUARD (do NOT delete without understanding why it exists): the
# generator is meant to be a pure function of the seeded sim + step count, so a
# regen only changes pixels when the UI actually changed. That property has no
# other enforcement (code review twice missed a wall-clock leak that recommitted
# churn on every nightly run). This workflow proves it by generating TWICE, in
# parallel (the `shoot` matrix below), and failing if the two runs differ
# byte-for-byte (`verify-and-commit`). The likeliest future regression is not an
# edit to scripts/: it is someone adding a time-reading decoration to the ENGINE
# render path, never touching this generator, and going green. The full-set,
# both-runs comparison is what catches that. If the extra runner-minutes ever
# bite, the two `shoot` jobs already run concurrently (wall-clock is one
# generation, not two); do not "optimize" it down to a subset of scenes, which
# would go blind exactly when a new live scene is added.

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

# SHARED with update-visual-baselines.yml: the two bot workflows both commit to
# this branch, so they must never run at the same time or they'd race on push.
# One group + cancel-in-progress:false serializes them (the second queues behind
# the first); the second then checks out the first's commit (ref below) and
# fast-forwards. cancel-in-progress is false so a queued regen is never dropped.
concurrency:
  group: regen-ci-artifacts-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Resolve the container tag from the repo's Playwright version so the image can
  # never drift from the browser `npm ci` installs, the whole basis of stable
  # pixels. (container.image is set before steps run, so it must come from a
  # prior job's output, not a step in the same job.)
  resolve-image:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[update-screenshots]')
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.pin.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: |
          ver=$(node -e "const l=require('./package-lock.json');const p=l.packages&&l.packages['node_modules/playwright'];process.stdout.write((p&&p.version)||require('./package.json').devDependencies.playwright.replace(/[^0-9.]/g,''))")
          echo "image=mcr.microsoft.com/playwright:v${ver}-jammy" >> "$GITHUB_OUTPUT"

  # Two INDEPENDENT full generations, one per matrix leg, running in parallel on
  # separate runners of the SAME pinned image. Each uploads its docs/screenshots
  # as an artifact; verify-and-commit diffs the two. Because they share the image
  # (one Chromium build + fonts), a byte difference between them can only come
  # from a nondeterministic input (a wall-clock read leaking into a capture), not
  # from the environment. Running them concurrently keeps the wall-clock at one
  # generation even though we shoot twice.
  shoot:
    needs: resolve-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-image.outputs.image }}
    strategy:
      fail-fast: false
      matrix:
        run: [a, b]
    env:
      # Browsers already ship in the image; don't re-download them on npm ci.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      # Check out the branch TIP (not the triggering SHA) with full history so
      # both legs generate from the same source. (Only verify-and-commit pushes.)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # A container checkout trips git's dubious-ownership guard; mark the tree safe.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The Playwright jammy image ships Node 20, but scripts/screenshots.ts is
      # run directly (native TS type-stripping) which needs Node ≥ 22.18, install
      # the repo's pinned Node over the image's, keeping the image's browsers.
      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Capture every screenshot
        run: |
          export PW_CHROME="$(ls -d /ms-playwright/chromium-*/chrome-linux*/chrome | head -1)"
          RUN_SERVER=1 node scripts/screenshots.ts

      - name: Upload this run's gallery
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.run }}
          path: docs/screenshots
          retention-days: 1
          if-no-files-found: error

  # Determinism guard + commit. Downloads both generations, diffs them, and only
  # if they match byte-for-byte commits one back to the branch. A mismatch fails
  # the workflow (nothing committed) rather than letting a nondeterministic
  # generator recommit wall-clock churn. See the header note above.
  verify-and-commit:
    needs: shoot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download generation A
        uses: actions/download-artifact@v4
        with:
          name: shots-a
          path: /tmp/shots-a
      - name: Download generation B
        uses: actions/download-artifact@v4
        with:
          name: shots-b
          path: /tmp/shots-b

      - name: Verify the generator is deterministic
        run: |
          # Both artifacts were uploaded the same way, so their trees match
          # structurally; a per-file byte difference can only be nondeterminism.
          if ! diff -rq /tmp/shots-a /tmp/shots-b; then
            echo "::error::screenshot generator is nondeterministic: two parallel runs in the same pinned image produced different pixels. A wall-clock read leaked into a capture (likely a new time-driven decoration in the engine render path); fix it before committing."
            exit 1
          fi
          echo "Generator is deterministic: two independent runs in the pinned image matched byte-for-byte."

      - name: Commit refreshed screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Adopt generation A as the committed set (identical to B by the check
          # above). upload-artifact strips the common path prefix, so the gallery
          # may sit at the artifact root OR under docs/screenshots/; find it.
          src=/tmp/shots-a
          [ -d "$src/docs/screenshots" ] && src="$src/docs/screenshots"
          rm -rf docs/screenshots
          mkdir -p docs/screenshots
          cp -a "$src/." docs/screenshots/
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots already match this environment, nothing to commit."
            exit 0
          fi
          git commit -m "Update screenshots from CI"
          # The sibling baselines workflow may push concurrently; it touches only
          # e2e/visual.spec.ts-snapshots (disjoint from docs/screenshots), so a
          # rejected push just needs a rebase over its commit, then retry.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push rejected, rebasing on the remote and retrying ($attempt)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "could not push refreshed screenshots after retries" >&2
          exit 1
