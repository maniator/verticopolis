name: Engine hour-boundary bench

# Tracks the Rust engine's tick cost over time: the weekly run builds the
# bench crate (engine-bench/), which lays a ~20k-unit tower shaped like the
# audit's noise-scan diagnosis and walks 24 in-game hours, reporting regular
# vs hour-boundary tick cost. The audit's one-off numbers (8.6 ms regular /
# 53 ms boundary at 25k units, TypeScript engine, 2026-07-21) began the
# series (audit section 14a commitment, #540); the TypeScript bench this
# replaces timed an engine the game no longer runs.
#
# NON-BLOCKING by design: the bench gates nothing. Timings on shared runners
# are venue-noisy, so the numbers are trend evidence for humans (the run's job
# summary and a downloadable log), never assertions; the bench itself fails
# only when its tower does not build or its walk misses an hour boundary.
# A pull request that touches the bench or the engine gets the lint step only,
# so an engine API change that breaks the bench shows up before Monday.

on:
  schedule:
    # Mondays at 05:17 UTC (off the top of the hour to dodge scheduler load).
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "engine-bench/**"
      - "engine-rs/src/**"
      - "engine-rs/Cargo.toml"
      - "conformance/events/**"
      - ".github/workflows/engine-bench.yml"

# Read-only: the bench checks out and measures; it never writes to the repo.
permissions:
  contents: read

concurrency:
  group: engine-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    container:
      # rust:1.97.0-bookworm, the toolchain the engine pins (rust-version).
      image: rust:1.97.0-bookworm@sha256:8fa55b2f3ddf97471ab6a767bfa3f37e6bad0986ba823e75fea57e2a2a5c3073
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          # The engine compiles in files from conformance/ (the event
          # catalog among them), so the suite comes along.
          sparse-checkout: |
            /engine-rs/
            /engine-bench/
            /conformance/

      - name: Rust toolchain
        run: |
          rustup show active-toolchain | grep -q '^1\.97\.0'
          rustup component add rustfmt clippy

      - name: Lint the bench
        working-directory: engine-bench
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Run the hour-boundary bench
        if: github.event_name != 'pull_request'
        working-directory: engine-bench
        run: |
          set -o pipefail
          echo "runner: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | sed 's/^ //') x $(nproc)" | tee bench-output.txt
          cargo run --locked --release 2>&1 | tee -a bench-output.txt

      - name: Publish the numbers to the job summary
        if: always() && github.event_name != 'pull_request'
        working-directory: engine-bench
        run: |
          {
            echo "## Engine hour-boundary bench ($(date -u +%F))"
            echo
            echo "Commit: \`${GITHUB_SHA}\`. Rust engine, native release build. Shared-runner timings: read as a trend, not an absolute."
            echo
            echo '```'
            grep -E "^(runner:|bench |regular |boundary |per hour)" bench-output.txt || echo "bench lines not found; see the uploaded log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the full bench log
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # run_attempt keeps a manual re-run from colliding with the first
          # attempt's immutable artifact name and failing an otherwise green run.
          name: engine-bench-${{ github.run_id }}-${{ github.run_attempt }}
          path: engine-bench/bench-output.txt
          retention-days: 90
