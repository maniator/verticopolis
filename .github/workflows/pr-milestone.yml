name: Milestone pull requests

# Every pull request has a milestone, like every issue (see "How items flow" in
# _bmad-output/implementation-artifacts/backlog.md). The rules live in
# src/build/prMilestone.ts (with its tests): a pull request takes the open
# milestone of the issue it closes, or the current release below; it never
# assigns a closed milestone and never overwrites one a person set. This also
# gives issue-milestone.yml a milestone to copy when a pull request closes an
# issue that had none.
#
# Change CURRENT_RELEASE when a release ships and the next one opens. If it
# names a milestone that is closed or missing, the job fails instead of
# filing the pull request under a release that already shipped.
#
# GitHub blocks pull_request_target on public repositories from 2026-12-02, so
# this runs on pull_request. A branch in this repository gets the write token
# below; a fork's pull request and Dependabot's get a read-only one, so they
# skip the event job and the hourly sweep, which runs from main, gives them a
# milestone instead. Nothing from a pull request is checked out or run by the
# sweep, and the event job runs only for branches whose authors can already
# push here. The description is read from the API as data.
on:
  pull_request:
    types: [opened, reopened, edited, ready_for_review]
  schedule:
    # Hourly at minute 17.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the milestones without setting any"
        type: boolean
        default: false

concurrency:
  group: pr-milestone-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

# Setting a milestone on a pull request goes through the issues endpoint, but
# GitHub checks pull requests against the pull-requests permission there, so a
# token with only issues: write gets a 403 on the PATCH.
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  milestone:
    if: >-
      github.repository == 'Verticopolis/web' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CURRENT_RELEASE: "5.x"
    steps:
      # The event job checks out the pull request's merge commit, which only
      # a branch in this repository reaches (see the job's condition); the
      # sweep checks out main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Give the pull request a milestone
        if: github.event_name == 'pull_request'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: node scripts/pr-milestone.ts

      - name: Give every open pull request without one a milestone
        if: github.event_name != 'pull_request'
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: node scripts/pr-milestone.ts --sweep $DRY_RUN
