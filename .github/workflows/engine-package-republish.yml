name: Republish engine package

# Republishes one already-released engine version to GitHub Packages with the
# package files main has now (its README, the browser build's declarations),
# for a version that was published before those files existed. Run by hand
# only, and only on the owner's say-so: it deletes the published version first,
# because a published npm version cannot be changed in place.
#
# The engine itself is not rebuilt. The node/ and web/ trees come from the
# zip attached to the version's GitHub release (engine-v<version>), checked
# against the SHA-256 beside it, so the republished WebAssembly is byte for
# byte the one first published. The changelog comes from the version's own tag.
# If the publish fails after the delete, the step restores the deleted version.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Engine version to republish (x.y.z, with an engine-v<version> release)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: engine-package-republish
  cancel-in-progress: false

jobs:
  republish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Rebuild the package from the release's files
        id: pack
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "::error::$VERSION is not a plain x.y.z."; exit 1; fi
          tag="engine-v$VERSION"
          zip="verticopolis-engine-wasm-$VERSION.zip"
          gh release download "$tag" --pattern "$zip" --pattern "$zip.sha256" --dir release
          (cd release && sha256sum -c "$zip.sha256")
          mkdir npm
          (cd npm && unzip -q "../release/$zip" 'node/*' 'web/*')
          git fetch --no-tags --quiet --depth=1 origin "refs/tags/$tag:refs/tags/$tag"
          git show "$tag:engine-rs/CHANGELOG.md" > release/CHANGELOG.md
          npm_name="$(sh scripts/engine-package-files.sh npm "$VERSION" "$OWNER" "$GH_REPO" release/CHANGELOG.md)"
          echo "npm=$npm_name" >> "$GITHUB_OUTPUT"
          (cd npm && npm pack --dry-run)

      - name: Replace the published version
        working-directory: npm
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          NPM_NAME: ${{ steps.pack.outputs.npm }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          printf '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > .npmrc
          versions="/users/$OWNER/packages/npm/verticopolis-engine/versions"
          id="$(gh api --paginate "$versions" --jq ".[] | select(.name == \"$VERSION\") | .id")"
          if [ -n "$id" ]; then
            gh api -X DELETE "$versions/$id"
            echo "Deleted $NPM_NAME@$VERSION (package version $id)."
          else
            echo "$NPM_NAME@$VERSION is not published; publishing it."
          fi
          if ! npm publish --registry https://npm.pkg.github.com; then
            if [ -n "$id" ]; then
              gh api -X POST "$versions/$id/restore"
              echo "::error::Publishing failed, so the deleted $NPM_NAME@$VERSION was restored as it was."
            fi
            exit 1
          fi
          echo "Republished $NPM_NAME@$VERSION with its README."
