name: PR screenshot drift-check

# Moves the screenshot determinism guard LEFT, onto the pull request, and turns a
# pixel change into a one-click update in the same run. It calls the reusable
# capture (screenshot-capture.yml) to render the gallery. This is the SOLE path
# that regenerates the committed gallery: there is no separate marker-push
# workflow anymore (update-screenshots.yml was retired once drift became a hard
# gate here, so every gallery refresh flows through a PR). Two separate signals:
#
#   1. HARD FAIL: the reusable `capture` renders every shard TWICE and fails if the
#      two renders differ (nondeterminism, the exact leak PR #188 chased). If it
#      fails, this whole workflow is red and nothing below runs.
#
#   2. DRIFT GATE: when the freshly generated (pinned-container, canonical) pixels
#      differ from the committed gallery, `drift-gate` is RED on a same-repo PR (so
#      a merge cannot leave the gallery stale on main). The author clears it by
#      approving the `commit-on-approval` job, which regenerates and commits the
#      gallery straight to the PR branch in the SAME run: no marker push, no second
#      run. Fork PRs cannot run that job, so they are exempt from the drift gate.
#
# PREREQUISITE: the `screenshot-approval` Environment must exist with a required
# reviewer (repo Settings -> Environments). Without a required reviewer the gate
# does NOT gate, so treat a missing/unprotected environment as a setup error, not
# a silent auto-commit.

on:
  # No top-level `paths:` filter: this workflow runs on EVERY PR so its final
  # `drift-gate` job always reports a status and can be marked a REQUIRED check
  # without hanging "pending" on PRs that touch no render paths (the trap the old
  # WARNING here called out). The render-path decision moved INTO the `changes`
  # job below, which gates the expensive capture; `drift-gate` then reports green
  # when nothing render-affecting changed, or mirrors the determinism result when
  # it did. See the `changes` job for the exact path rules.
  pull_request:
    types: [opened, synchronize, reopened]

# One run per PR; a new push supersedes the previous run. This cancels THIS
# workflow's own jobs (verify-drift, and a commit-on-approval still waiting at the
# gate). It does NOT reliably cancel the jobs of the reusable
# `screenshot-capture.yml` this calls (a caller's cancel-in-progress does not
# propagate into a called workflow's in-progress jobs, GitHub discussion #30708),
# so that reusable workflow carries its OWN concurrency group to cancel its
# expensive Playwright captures on a new push. The two groups are deliberately
# distinct (`pr-drift-*` vs `screenshot-capture-*`) so they never deadlock.
concurrency:
  group: pr-drift-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Default read-only; the two downstream jobs request the narrow write they need.
permissions:
  contents: read

jobs:
  # Decide whether this PR touches anything that can change committed pixels. This
  # replaces the old top-level `paths:` filter so the workflow still runs (and
  # `drift-gate` still reports) on every PR, which is what lets `drift-gate` be a
  # required check. The rules mirror the old filter exactly:
  #   Committed pixels can change from almost any app code: the engine sim state
  #   that gets rendered (src/engine/** is the "engine render path" blind spot the
  #   guard watches), the render path (src/render/**), DOM chrome (src/ui/**,
  #   src/main.ts, styles, index.html), and the save-loading scenes (src/storage/**).
  #   So match all of src/, minus tests (the legacy src/tests/** home and the
  #   colocated *.test.ts files), but re-include the fixtures the screenshot scenes
  #   load (the migration scene reads a real save under src/tests/fixtures/**).
  #   Plus the generator, this workflow, and the reusable capture. The app version
  #   is deliberately NOT matched: the generator masks it to a fixed placeholder at
  #   capture time (pgMaskVersion), so a package.json/vite.config.ts version bump no
  #   longer changes committed pixels; matching them would fire the capture on every
  #   version-only PR for no pixel change.
  # Matching is last-match-wins per file, same as GitHub's `paths:`. It is done in
  # bash rather than a third-party action: a `case` glob's `*` crosses `/`, so a
  # single `src/*` pattern models `src/**`. Over-matching is safe (the capture just
  # runs when it need not, and drift-gate is still green); under-matching would
  # silently skip a real render change, so keep the rules inclusive.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      render: ${{ steps.filter.outputs.render }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          render=false
          # Two-dot diff (all files differing between base tip and head): if the
          # base moved a render file too, that only over-includes, which is safe.
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            sign=""
            case "$f" in src/*) sign=+ ;; esac
            case "$f" in src/tests/*) sign=- ;; esac
            case "$f" in src/tests/fixtures/*) sign=+ ;; esac
            case "$f" in src/*.test.ts) sign=- ;; esac
            case "$f" in scripts/screenshots.ts) sign=+ ;; esac
            case "$f" in scripts/screenshot-*.ts) sign=+ ;; esac
            case "$f" in .github/workflows/pr-drift-check.yml) sign=+ ;; esac
            case "$f" in .github/workflows/screenshot-capture.yml) sign=+ ;; esac
            # The pinned Playwright/browser + font versions come from the lockfile, and
            # a bump there can shift antialiasing across the WHOLE committed gallery.
            # This filter used to exclude the lockfile to avoid a capture on every
            # dependency PR. With drift now a hard gate, treat it as render-affecting so
            # a Playwright/font bump is caught and its screenshots refreshed in the PR
            # rather than silently drifting main. The cost is a capture on lockfile PRs,
            # which is the price of never missing a dependency-driven pixel change.
            case "$f" in package-lock.json) sign=+ ;; esac
            if [ "$sign" = "+" ]; then render=true; break; fi
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "render=$render" >> "$GITHUB_OUTPUT"
          echo "render-affecting paths changed: $render"

  # Shared, sharded, self-verifying capture (renders each shard twice and hard-
  # fails on nondeterminism). Read-only; runs PR-head code, so no write token. Runs
  # whenever render-affecting paths changed. There is no marker-skip anymore: with
  # update-screenshots.yml retired, no push-event workflow renders the gallery in
  # parallel, so there is no double-capture to dedup, and this is the only capture.
  capture:
    needs: changes
    if: needs.changes.outputs.render == 'true'
    uses: ./.github/workflows/screenshot-capture.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    permissions:
      contents: read

  # Signal 2's detector: assemble the verified run over the PR's committed gallery
  # and record whether anything changed (has_drift), WITHOUT committing. Posts a
  # best-effort advisory comment. Never fails on drift.
  verify-drift:
    needs: capture
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      has_drift: ${{ steps.drift.outputs.has_drift }}
      drift_count: ${{ steps.drift.outputs.drift_count }}
    env:
      SHARDS_JSON: ${{ needs.capture.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the shard artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/dl
          pattern: shots-*

      - id: drift
        name: Detect drift vs the committed gallery (no commit)
        run: |
          # Rebuild the gallery from the verified shard sets over the PR's committed
          # set and see whether git records any change. Require every shard present,
          # counted via the .shard-complete marker (not the pixel dir), so a shard
          # that legitimately renders nothing still counts as present.
          expected=$(echo "$SHARDS_JSON" | jq 'length')
          assembled=0
          for shard in $(echo "$SHARDS_JSON" | jq -r '.[]'); do
            [ -f "/tmp/dl/shots-$shard/.shard-complete" ] && assembled=$((assembled + 1))
          done
          if [ "$assembled" -ne "$expected" ]; then
            echo "::error::expected $expected shard galleries but found $assembled; a capture, upload, or download step must have failed."
            exit 1
          fi
          find docs/screenshots -type f -name '*.png' -delete
          for shard in $(echo "$SHARDS_JSON" | jq -r '.[]'); do
            src="/tmp/dl/shots-$shard/shots/docs/screenshots"
            [ -d "$src" ] && cp -a "$src/." docs/screenshots/
          done
          git add -A docs/screenshots
          if git diff --cached --quiet; then
            echo "has_drift=false" >> "$GITHUB_OUTPUT"
            echo "drift_count=0" >> "$GITHUB_OUTPUT"
            echo "No screenshot drift: the committed gallery already matches a fresh deterministic generation."
          else
            n=$(git diff --cached --name-only -- docs/screenshots | wc -l | tr -d ' ')
            echo "has_drift=true" >> "$GITHUB_OUTPUT"
            echo "drift_count=$n" >> "$GITHUB_OUTPUT"
            echo "$n committed screenshot(s) would change; the approval gate will offer to commit them."
          fi
          # Discard the working-tree changes: this job only reports, never commits.
          git reset -q --hard

      # Advisory only (best-effort): a single sticky comment pointing the author at
      # the pending approval. Only posts when drift was actually computed, so a
      # failed capture (nondeterminism) never yields a misleading "no drift".
      - name: Advisory sticky comment
        if: ${{ !cancelled() && steps.drift.outcome == 'success' }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- screenshot-drift-check -->';
            const hasDrift = '${{ steps.drift.outputs.has_drift }}' === 'true';
            const count = '${{ steps.drift.outputs.drift_count }}';
            const body = hasDrift
              ? `${marker}\n### 📸 Screenshot drift detected\nThis PR would change **${count}** committed screenshot(s). The generator is deterministic (the hard check passed), so this is the expected result of a UI change, not a bug.\n\nTo refresh the committed gallery: a maintainer approves the \`commit-on-approval\` job for this run (Actions tab → this run → **Review deployments** → approve **screenshot-approval**). The regenerated, pinned-container pixels are then committed to this branch in the same run.`
              : `${marker}\n### 📸 Screenshot drift check\nNo drift: the committed screenshots already match a fresh deterministic generation. ✅`;
            // Paginate: on a busy PR the marker comment can be past the first 30,
            // and a first-page-only search would post a duplicate sticky each run.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

  # Signal 2 (the approval gate). Runs ONLY when there is drift and the PR is from a
  # branch on this repo (a fork PR gets a read-only token and cannot be pushed to).
  # The `screenshot-approval` environment pauses the run until a required reviewer
  # approves; on approval it rebuilds the gallery and commits it to the PR branch.
  commit-on-approval:
    needs: [capture, verify-drift]
    if: >-
      needs.verify-drift.outputs.has_drift == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: screenshot-approval
    # Earns write: it pushes the approved commit. It runs no PR-head code (only
    # git/jq/cp over downloaded artifacts), so the write token is never exposed to
    # PR-controlled execution.
    permissions:
      contents: write
    env:
      SHARDS_JSON: ${{ needs.capture.outputs.shards }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Check out the exact SHA the screenshots were rendered from (what verify-drift
      # measured against), NOT the branch tip. The approval gate can hold this job
      # for a while, and a non-gated push landing meanwhile would not trigger a fresh
      # run to supersede this one, so committing onto the tip could bury newer code
      # under stale pixels. The push step refuses if the branch advanced past HEAD_SHA.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Download the shard artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/dl
          pattern: shots-*

      - name: Assemble and commit the regenerated gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Count via the .shard-complete marker (not the pixel dir) so a shard that
          # legitimately renders nothing still counts as present.
          expected=$(echo "$SHARDS_JSON" | jq 'length')
          assembled=0
          for shard in $(echo "$SHARDS_JSON" | jq -r '.[]'); do
            [ -f "/tmp/dl/shots-$shard/.shard-complete" ] && assembled=$((assembled + 1))
          done
          if [ "$assembled" -ne "$expected" ]; then
            echo "::error::expected $expected shard galleries but found $assembled; a capture, upload, or download step failed, or the artifacts expired (retention window) before this approval. Re-run the drift-check to regenerate."
            exit 1
          fi
          # Prune only generated PNGs (so a removed scene's stale image goes) while
          # preserving tracked non-generated files under docs/screenshots.
          find docs/screenshots -type f -name '*.png' -delete
          for shard in $(echo "$SHARDS_JSON" | jq -r '.[]'); do
            src="/tmp/dl/shots-$shard/shots/docs/screenshots"
            [ -d "$src" ] && cp -a "$src/." docs/screenshots/
          done
          git add -A docs/screenshots
          if git diff --cached --quiet; then
            echo "Nothing to commit (the gallery already matches)."
            exit 0
          fi
          git commit -m "Update screenshots from CI (approved on PR #${{ github.event.pull_request.number }})"
          # The commit's parent is HEAD_SHA. Push only as a fast-forward: if the tip
          # advanced during the approval wait, refuse rather than bury newer code
          # under stale pixels. Retry only transient (non-advance) push failures. The
          # bot pushes with GITHUB_TOKEN, which fires no workflow events on the new
          # commit, so the required `drift-gate` does not re-run on the refreshed head
          # automatically. A maintainer re-triggers CI on that new commit; the fresh
          # run finds no drift and the gate goes green.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${HEAD_REF}"; then exit 0; fi
            git fetch origin "${HEAD_REF}"
            tip="$(git rev-parse "origin/${HEAD_REF}")"
            if [ "$tip" != "${HEAD_SHA}" ]; then
              echo "::error::the PR branch advanced past ${HEAD_SHA} (now ${tip}) since these screenshots were rendered; refusing to commit stale pixels over newer code. Re-run the drift-check so it regenerates from the current tip."
              exit 1
            fi
            echo "push failed but the branch tip is unchanged; retrying ($attempt)"
            sleep $((attempt * 2))
          done
          echo "could not push refreshed screenshots after retries" >&2
          exit 1

  # THE required status check. It runs on every non-cancelled outcome, so it always
  # reports a result and never hangs "pending" the way a path-filtered required
  # check would. It gates on TWO things: the hard determinism guard, then drift.
  #
  # Determinism gate:
  #   - changes-detection itself failed   -> RED (fail closed: we cannot tell
  #                                          whether a render change went unchecked,
  #                                          so do not pass it).
  #   - no render-affecting paths changed  -> green (nothing to check).
  #   - capture ran and passed             -> determinism OK, fall through to the
  #                                          drift gate below.
  #   - capture failed or did not run      -> RED (a shard's two independent renders
  #                                          differ (nondeterminism), or an upstream
  #                                          job did not succeed; fail closed).
  #
  # Drift gate (same-repo PRs only): once determinism passes, a drifting committed
  # gallery is RED. A merge can no longer land committed screenshots that a fresh
  # deterministic render would change, so a scene removed/edited in a sibling PR (or
  # a lockfile bump that shifts pixels) cannot leave the gallery stale on main. The
  # author clears it by approving commit-on-approval for the run, which regenerates
  # and commits the pinned-container pixels to the branch. Fork PRs are exempt
  # (SAME_REPO false): a fork cannot run commit-on-approval (read-only token, no
  # push to the fork from here), so blocking it on drift would strand it with no way
  # to clear. We also fail closed if verify-drift did not succeed, so a broken
  # detector cannot pass a possibly-stale gallery.
  # Mark THIS job (`drift-gate`) as the required status check in branch protection,
  # not `capture` or any path-gated job.
  # `if: !cancelled()` (not `always()`): it runs on every non-cancelled outcome
  # (success, failure, or skip) so it always reports on the LIVE run, but it is
  # itself skipped when the run is cancelled. That matters because a superseding
  # push cancels this run's `capture`; with `always()` the gate would then run,
  # see `capture: cancelled`, and post a spurious red on the now-stale SHA. Branch
  # protection gates on the newest SHA, whose own run reports normally, so skipping
  # on cancellation avoids the false red without ever leaving the live head without
  # a status.
  drift-gate:
    needs: [changes, capture, verify-drift]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report the determinism and drift result
        env:
          CHANGES: ${{ needs.changes.result }}
          RENDER: ${{ needs.changes.outputs.render }}
          CAPTURE: ${{ needs.capture.result }}
          VERIFY_DRIFT: ${{ needs.verify-drift.result }}
          HAS_DRIFT: ${{ needs.verify-drift.outputs.has_drift }}
          DRIFT_COUNT: ${{ needs.verify-drift.outputs.drift_count }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "::error::the changes-detection job did not succeed ($CHANGES); cannot tell whether render paths changed, so failing closed rather than passing a possibly-unchecked PR."
            exit 1
          fi
          if [ "$RENDER" != "true" ]; then
            echo "No render-affecting paths changed; the screenshot determinism check is not required for this PR. ✅"
            exit 0
          fi
          # Render paths changed, so the determinism capture was expected to run.
          if [ "$CAPTURE" != "success" ]; then
            echo "::error::the screenshot determinism guard did not pass (capture: $CAPTURE). Either a shard's two independent renders differ (nondeterminism), or the capture did not run because an upstream job did not succeed. This is the hard check, not the drift approval gate; fix it before merging."
            exit 1
          fi
          echo "Screenshot determinism check passed. ✅"

          # Second gate: drift. A same-repo PR must not leave the committed gallery
          # stale. A fork PR is exempt (SAME_REPO false): it cannot run commit-on-
          # approval to clear drift (read-only token, no push to the fork from here),
          # so blocking it would strand it with no way to go green.
          if [ "$SAME_REPO" != "true" ]; then
            if [ "$HAS_DRIFT" = "true" ]; then
              echo "Drift detected ($DRIFT_COUNT screenshot(s)) on a fork PR, which cannot clear it from here; not blocking. A maintainer refreshes the gallery before merge (for example by taking the change onto a same-repo branch, where the approval gate can commit the regenerated pixels). ✅"
            fi
            exit 0
          fi
          # Fail closed if the detector did not run cleanly, so a broken detector
          # cannot pass a possibly-stale gallery.
          if [ "$VERIFY_DRIFT" != "success" ]; then
            echo "::error::the verify-drift job did not succeed ($VERIFY_DRIFT); cannot tell whether the committed gallery is stale, so failing closed."
            exit 1
          fi
          if [ "$HAS_DRIFT" = "true" ]; then
            echo "::error::the committed screenshots are stale: a fresh deterministic render changes $DRIFT_COUNT of them. Refresh the gallery by approving the commit-on-approval job for this run (Actions tab -> this run -> Review deployments -> approve screenshot-approval), which regenerates and commits the pinned-container pixels to this branch; the bot commits with GITHUB_TOKEN, so re-trigger CI on that new commit for this gate to re-evaluate the refreshed gallery and go green."
            exit 1
          fi
          echo "No screenshot drift: the committed gallery matches a fresh deterministic generation. ✅"
