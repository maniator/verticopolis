name: disc-fuzz

# Nightly hostile-input fuzz of the disc reader: damaged images and damaged
# KWAJ files from the test kit, each checked for a typed refusal (never a
# panic or a hang), with every KWAJ case held to the libmspack comparison
# rule. Never a pull-request gate; a failing seed is pinned as a named
# regression test in the fix PR.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: "How many seeds to run (a positive whole number)"
        default: "20000"
      seed:
        description: "Replay one explicit seed instead (the number a failing run printed)"
        default: ""

permissions:
  contents: read

concurrency:
  group: disc-fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: disc-rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
      - name: libmspack oracle
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmspack-dev
          cc -O2 -o "$RUNNER_TEMP/kwajd" ../tools/simtower/docker/kwajd.c -lmspack
      - name: Build the fuzzer
        run: cargo build --locked --release --features testkit --bin disc-fuzz
      - name: Fuzz
        env:
          VC_KWAJ_ORACLE: ${{ runner.temp }}/kwajd
          VC_REQUIRE_KWAJ_ORACLE: "1"
          SEEDS: ${{ github.event.inputs.seeds || '20000' }}
          ONE: ${{ github.event.inputs.seed }}
        run: |
          case "$SEEDS" in ''|*[!0-9]*|0*) echo "seeds must be a positive whole number without leading zeros, got '$SEEDS'"; exit 2;; esac
          if [ "${#SEEDS}" -gt 6 ]; then echo "seeds must be at most 999999"; exit 2; fi
          status=0
          if [ -n "$ONE" ]; then
            case "$ONE" in *[!0-9]*|0?*) echo "seed must be a whole number without leading zeros, got '$ONE'"; exit 2;; esac
            if [ "${#ONE}" -gt 18 ]; then echo "seed is too large"; exit 2; fi
            target/release/disc-fuzz --seed "$ONE" || status=$?
          else
            # Nightly runs take a fresh block of 1,000,000 seeds per day. A
            # manual run takes its own block, by run number, in a space far
            # above every nightly block, so no two runs share a seed.
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              offset=$(( (1 << 40) + GITHUB_RUN_NUMBER * 1000000 ))
            else
              offset=$(( $(date +%s) / 86400 * 1000000 ))
            fi
            # Each case's seed goes to stderr before it runs; keep the log so
            # an abort no handler sees still names its seed.
            target/release/disc-fuzz --seeds "$SEEDS" --offset "$offset" 2> fuzz.err || status=$?
            if [ "$status" -ne 0 ]; then tail -n 40 fuzz.err; fi
          fi
          echo "replay a seed with: workflow_dispatch seed=<number>, or locally: VC_KWAJ_ORACLE=<kwajd> cargo run --release --features testkit --bin disc-fuzz -- --seed <number>"
          exit $status
