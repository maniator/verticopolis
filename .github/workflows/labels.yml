name: Sync labels

# Create or update the repository's labels.
#
# Runs on a push to main that changes the list (.github/labels.yml), its reader
# or this workflow, daily as a backstop, and by hand from Actions > Sync labels
# > Run workflow.
# Every run uses the default branch's list, since labels are repository-wide.
# Non-destructive: it creates or updates the listed labels and never deletes a
# label that isn't listed, so a daily run only puts back a color or
# description someone changed by hand.
#
# The list is .github/labels.yml, read by scripts/sync-labels.ts through
# src/build/labelList.ts (a narrow reader with its own tests, so a color like
# 5319e7 stays a string). The same script runs by hand with gh signed in.
on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - .github/workflows/labels.yml
      - scripts/sync-labels.ts
      - src/build/labelList.ts
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: sync-labels
  cancel-in-progress: false

# Least privilege: label management needs write access to issues, and the
# checkout reads the list.
permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Create or update labels
        run: node scripts/sync-labels.ts
