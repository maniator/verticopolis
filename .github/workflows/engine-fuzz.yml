name: engine-fuzz

# Nightly differential fuzz of the two engines: random scenarios grown on the
# Rust engine, replayed on the TypeScript engine, hashes compared at every
# checkpoint. Never a pull-request gate; a divergence is pinned as a named
# scenario in the fix PR.

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: "How many seeds to run (a positive whole number)"
        default: "20"
      seed:
        description: "Replay one explicit seed instead (the number a failing run printed)"
        default: ""
      seed_block:
        description: "Replay one night's seeds: the block number a run summary printed (days since 1970-01-01). Empty takes a block the nightly run does not use."
        default: ""

permissions:
  contents: read

# A manual run has its own group, so it queues behind other manual runs and
# never replaces the scheduled night that is waiting.
concurrency:
  group: engine-fuzz-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
      - name: Build the fuzzer
        run: cargo build --locked --release --features conformance --bin fuzz
        working-directory: engine-rs
      - name: Fuzz
        env:
          SEEDS: ${{ github.event.inputs.seeds || '20' }}
          ONE: ${{ github.event.inputs.seed }}
          BLOCK: ${{ github.event.inputs.seed_block }}
          EVENT: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          seeds="$SEEDS"
          case "$seeds" in ''|*[!0-9]*|0) echo "seeds must be a positive whole number, got '$seeds'"; exit 2;; esac
          # A seed block is one day's worth of seeds: the nightly run takes
          # today's, and a summary names the block so the night can be replayed.
          # A manual run without a block takes one the nightly run does not use.
          block=$(( $(date +%s) / 86400 ))
          offset=0
          if [ -n "$BLOCK" ]; then
            case "$BLOCK" in *[!0-9]*) echo "seed_block must be a whole number, got '$BLOCK'"; exit 2;; esac
            if [ "${#BLOCK}" -gt 6 ]; then echo "seed_block must be below 1000000, got '$BLOCK'"; exit 2; fi
            block=$BLOCK
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            offset=$(( 10000 + (RUN_NUMBER % 900) * 100 ))
          fi
          if [ "${#seeds}" -gt 6 ] || [ "$seeds" -gt $(( 100000 - offset )) ]; then
            echo "seeds must be at most $(( 100000 - offset )) for this run"; exit 2
          fi
          if [ -n "$ONE" ]; then
            case "$ONE" in *[!0-9]*) echo "seed must be a whole number, got '$ONE'"; exit 2;; esac
            if [ "${#ONE}" -gt 10 ] || [ "$ONE" -gt 4294967295 ]; then echo "seed must be below 4294967296, got '$ONE'"; exit 2; fi
            list="$ONE"
          else
            # One block of seeds per day; a block holds up to 100000 seeds.
            base=$(( block * 100000 + offset ))
            list=$(seq $(( base + 1 )) $(( base + seeds )))
          fi
          engine=""; diverged=""; harness=""
          for seed in $list; do
            echo "seed $seed"
            # The fuzzer exits non-zero when the Rust engine refuses a scenario
            # it grew itself: an engine finding, kept apart from a broken run.
            if ! engine-rs/target/release/fuzz "$seed" fuzz-out 40; then engine="$engine $seed"; continue; fi
            code=0
            npx tsx scripts/fuzz-compare.ts "fuzz-out/fuzz-$seed.json" || code=$?
            case "$code" in
              0) ;;
              1) diverged="$diverged $seed" ;;
              *) harness="$harness $seed" ;;
            esac
          done
          {
            echo "### engine-fuzz"
            echo "- commit: \`$GITHUB_SHA\`, seed block: $block (offset $offset), seeds: $(echo $list | wc -w)"
            echo "- TypeScript and Rust diverged:${diverged:- none}"
            echo "- Rust engine refused its own scenario:${engine:- none}"
            echo "- harness failed (missing or malformed record, bad arguments):${harness:- none}"
            echo "- replay a block with seed_block=$block; replay one seed with seed=<number>"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "replay one seed with: workflow_dispatch seed=<number>, or locally: cargo run --release --manifest-path engine-rs/Cargo.toml --features conformance --bin fuzz -- <number> out 40 && npx tsx scripts/fuzz-compare.ts out/fuzz-<number>.json"
          [ -z "$diverged$engine$harness" ]
      - name: Keep the scenarios of this run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-scenarios
          path: fuzz-out
          if-no-files-found: ignore
          retention-days: 30
