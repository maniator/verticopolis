name: engine-fuzz

# Nightly differential fuzz of the two engines: random scenarios grown on the
# Rust engine, replayed on the TypeScript engine, hashes compared at every
# checkpoint. One seed in `wasm_every` is also replayed through the shipped
# WASM build in Node and compared with the native Rust run, which is how a
# wasm32-only difference (32-bit usize, float handling in the build) shows.
# Never a pull-request gate; a divergence is pinned as a named scenario in the
# fix PR.

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: "How many seeds to run (a positive whole number)"
        default: "20"
      seed:
        description: "Replay one explicit seed instead (the number a failing run printed)"
        default: ""
      seed_block:
        description: "Replay a run's seeds: the block number its summary printed (days since 1970-01-01, at most 42948). Empty takes today's block."
        default: ""
      seed_offset:
        description: "With seed_block: the offset its summary printed. Empty means 0 when seed_block is set, and a block range the nightly run does not use when it is not."
        default: ""
      wasm_every:
        description: "Replay every Nth seed (seed number divisible by N) through the WASM build too; 0 turns the WASM leg off. Empty takes 4."
        default: ""

permissions:
  contents: read

# Each manual run has its own group, so it never replaces the scheduled night
# that is waiting, or another manual run. They run in parallel.
concurrency:
  group: engine-fuzz-${{ github.event_name == 'schedule' && 'night' || github.run_id }}
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
      # The shipped build's Node package (engine-rs/pkg/), from the shared
      # cache and built on a miss with the pinned wasm-bindgen CLI.
      - uses: ./.github/actions/engine-wasm
      - name: Build the fuzzer
        run: cargo build --locked --release --features conformance --bin fuzz
        working-directory: engine-rs
      - name: Fuzz
        env:
          SEEDS: ${{ github.event.inputs.seeds || '20' }}
          ONE: ${{ github.event.inputs.seed }}
          BLOCK: ${{ github.event.inputs.seed_block }}
          OFFSET: ${{ github.event.inputs.seed_offset }}
          WASM_EVERY: ${{ github.event.inputs.wasm_every }}
          EVENT: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Whole numbers only, read as base 10 (a leading zero is not octal).
          num() { case "$1" in ''|*[!0-9]*) echo "$2 must be a whole number, got '$1'" >&2; exit 2;; esac; [ "${#1}" -le 10 ] || { echo "$2 is too long: '$1'" >&2; exit 2; }; echo $(( 10#$1 )); }
          seeds=$(num "$SEEDS" seeds)
          wasm_every=4
          [ -z "$WASM_EVERY" ] || wasm_every=$(num "$WASM_EVERY" wasm_every)
          [ "$seeds" -ge 1 ] || { echo "seeds must be a positive whole number"; exit 2; }
          block=$(( $(date +%s) / 86400 ))
          offset=0
          if [ -n "$BLOCK" ]; then
            block=$(num "$BLOCK" seed_block)
            [ -z "$OFFSET" ] || offset=$(num "$OFFSET" seed_offset)
          elif [ -n "$OFFSET" ]; then
            offset=$(num "$OFFSET" seed_offset)
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            # A manual run without a block takes a range the nightly run does
            # not use, so a dispatch on the same day finds new seeds.
            offset=$(( 10000 + (RUN_NUMBER % 900) * 100 ))
          fi
          if [ -n "$ONE" ]; then
            one=$(num "$ONE" seed)
            [ "$one" -le 4294967295 ] || { echo "seed must be below 4294967296, got '$ONE'"; exit 2; }
            first=$one; last=$one
          else
            # One block of seeds per day; a block holds up to 100000 seeds.
            first=$(( block * 100000 + offset + 1 )); last=$(( first + seeds - 1 ))
            [ "$offset" -lt 100000 ] || { echo "seed_offset must be below 100000"; exit 2; }
            [ "$seeds" -le $(( 100000 - offset )) ] || { echo "seeds must fit in one block: at most $(( 100000 - offset )) from seed_offset $offset"; exit 2; }
            [ "$last" -le 4294967295 ] || { echo "seeds $first to $last do not fit in 32 bits (seed_block at most 42948)"; exit 2; }
          fi
          # The window key (scripts/fuzz-key.ts): a night counts toward the
          # window only on one unchanged key, from a scheduled run on main. A key
          # that cannot be computed, or that is not a 64-digit hex string, is
          # recorded as unavailable. The key and the run's event and ref are also
          # written to fuzz-out/window-key.txt, so the scenarios artifact carries them,
          # with the runner image version (ImageVersion), which the key cannot see: a
          # window ledger reads a change of image between two nights from it.
          key=$(npx tsx scripts/fuzz-key.ts) || key="unavailable"
          { [ "${#key}" -eq 64 ] && printf '%s' "$key" | grep -Eq '^[0-9a-f]+$'; } || key="unavailable"
          mkdir -p fuzz-out
          echo "key=$key event=$EVENT ref=$GITHUB_REF sha=$GITHUB_SHA image=${ImageVersion:-unknown}" > fuzz-out/window-key.txt
          engine=""; diverged=""; harness=""; wasmdiv=""; timedout=""; unrun=""
          # The job limit is 60 minutes and covers the setup steps before this one (a
          # cache-miss WASM build takes several minutes) and a last seed's three 300 s
          # steps. A seed that would start after this budget is listed as not run and
          # the night is red, so a slow runner never ends the job mid-seed with no summary.
          budget=1800
          ts_secs=0; wasm_secs=0; wasm_seeds=0; started=$SECONDS
          summary() {
            {
              echo "### engine-fuzz"
              echo "- commit: \`$GITHUB_SHA\`; seeds $first to $last"
              echo "- window key: \`$key\` (event $EVENT, ref $GITHUB_REF, runner image ${ImageVersion:-unknown})"
              [ -n "$ONE" ] || echo "- replay this range at this commit: seed_block=$block seed_offset=$offset seeds=$seeds wasm_every=$wasm_every"
              echo "- WASM leg: $([ "$wasm_every" -gt 0 ] && echo "seeds divisible by $wasm_every" || echo "off") ($wasm_seeds replayed), diverged from native Rust:${wasmdiv:- none}"
              echo "- time: ${ts_secs} s on the TypeScript compare, ${wasm_secs} s on the WASM leg, $(( SECONDS - started )) s in all"
              echo "- TypeScript and Rust diverged:${diverged:- none}"
              echo "- the fuzzer failed on its own scenario (the Rust engine refused it, or the fuzzer crashed):${engine:- none}"
              echo "- not run, the ${budget} s budget was spent first:${unrun:- none}"
              echo "- timed out (300 s per step; a hang in an engine, not a divergence):${timedout:- none}"
              echo "- harness failed (missing or malformed record, bad arguments):${harness:- none}"
            } >> "$GITHUB_STEP_SUMMARY"
          }
          trap summary EXIT
          for seed in $(seq "$first" "$last"); do
            if [ $(( SECONDS - started )) -gt "$budget" ]; then unrun="$unrun $seed"; continue; fi
            echo "seed $seed"
            code=0
            timeout 300 engine-rs/target/release/fuzz "$seed" fuzz-out 40 || code=$?
            # 101 is a Rust panic (the engine refused a scenario it grew, or the
            # fuzzer crashed); anything else is the harness.
            case "$code" in 0) ;; 101) engine="$engine $seed"; continue ;; 124) timedout="$timedout $seed"; continue ;; *) harness="$harness $seed"; continue ;; esac
            code=0; t0=$SECONDS
            timeout 300 npx tsx scripts/fuzz-compare.ts "fuzz-out/fuzz-$seed.json" || code=$?
            ts_secs=$(( ts_secs + SECONDS - t0 ))
            case "$code" in 0) ;; 1) diverged="$diverged $seed" ;; 124) timedout="$timedout $seed" ;; *) harness="$harness $seed" ;; esac
            if [ "$wasm_every" -gt 0 ] && [ $(( seed % wasm_every )) -eq 0 ]; then
              code=0; t0=$SECONDS
              timeout 300 npx tsx scripts/fuzz-compare.ts --wasm "fuzz-out/fuzz-$seed.json" || code=$?
              wasm_secs=$(( wasm_secs + SECONDS - t0 )); wasm_seeds=$(( wasm_seeds + 1 ))
              case "$code" in 0) ;; 1) wasmdiv="$wasmdiv $seed" ;; 124) timedout="$timedout $seed(wasm)" ;; *) harness="$harness $seed(wasm)" ;; esac
            fi
          done
          echo "replay one seed with: workflow_dispatch seed=<number> wasm_every=1, or locally: cargo run --release --manifest-path engine-rs/Cargo.toml --features conformance --bin fuzz -- <number> out 40 && npx tsx scripts/fuzz-compare.ts [--wasm] out/fuzz-<number>.json (--wasm needs npm run wasm:build)"
          [ -z "$diverged$wasmdiv$engine$timedout$unrun$harness" ]
      - name: Keep the scenarios of this run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-scenarios
          path: fuzz-out
          if-no-files-found: ignore
          retention-days: 30
