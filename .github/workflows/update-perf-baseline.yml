name: Update perf baseline

# Mints the E5-S0 perf baseline (e2e/perf/baseline.json) INSIDE the pinned
# Playwright Docker image, the same renderer the perf gate (test.yml) runs in, so
# the committed numbers are captured on the identical browser and (as far as CI
# hardware allows) comparable to the gate's measurements. A local sandbox with
# variable CPU is never the arbiter, exactly as with the visual baselines.
# The file holds one entry per engine (#900), and a run mints ONE engine: push
# so the HEAD commit's message contains "[update-perf-baseline:wasm]" or
# "[update-perf-baseline:ts]" (only the head commit of the push is checked), or
# dispatch the workflow with the engine as its input. The run measures that
# engine's Playwright project only, five times, and makes the entry from the
# median of the passes (scripts/perf-baseline-mint.ts); every other engine's
# entry stays exactly the committed one, and the refreshed entry comes back as
# a bot commit on the same branch. The run's summary also shows how the passes
# spread around their median, the A/A reading M7's tolerances are calibrated
# from (#900), and the passes are kept as an artifact. A bare "[update-perf-baseline]" names no engine
# and fails. Review those numbers before relying on them: that commit IS the
# blessing of a new perf truth. The TypeScript entry was minted on the pre-E5
# render path (the E5-S0 commit) so later live-view PRs measure against it, so
# re-mint it only on purpose.
#
# The bot pushes with GITHUB_TOKEN, which never triggers workflows, so the baseline
# commit itself gets no CI run; push once more after pulling it to get a green
# check on the final head.

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      engine:
        description: "The engine whose entry to mint; the other engine's entry stays as committed"
        type: choice
        options: [wasm, ts]
        default: wasm
        required: true
      passes:
        description: "How many times to measure the engine; the entry is each value's median"
        type: number
        default: 5
        required: true

concurrency:
  group: regen-perf-baseline-${{ github.ref }}
  cancel-in-progress: false

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

# Default read-only; only the update job (which pushes the refreshed baseline)
# requests the narrow write it needs.
permissions:
  contents: read

jobs:
  # Pin the container to the repo's Playwright version so the baseline is minted
  # against the EXACT Chromium the perf gate (test.yml) measures with, and
  # resolve which engine this run mints. The prefix match below also catches a
  # bare or misspelled marker, so the engine step can refuse it out loud.
  resolve-image:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[update-perf-baseline')
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.pin.outputs.image }}
      engine: ${{ steps.engine.outputs.engine }}
      project: ${{ steps.engine.outputs.project }}
      passes: ${{ steps.engine.outputs.passes }}
    steps:
      # The commit message and the input reach the shell as environment
      # variables, never spliced into the script.
      - id: engine
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ENGINE: ${{ inputs.engine }}
          INPUT_PASSES: ${{ inputs.passes }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          passes=5
          if [ "$EVENT" = "workflow_dispatch" ]; then
            named="$INPUT_ENGINE"
            passes="$INPUT_PASSES"
          else
            named=""
            for e in ts wasm; do
              case "$MESSAGE" in *"[update-perf-baseline:$e]"*) named="$named $e" ;; esac
            done
          fi
          set -- $named
          if [ "$#" -ne 1 ]; then
            echo "::error::name exactly one engine to mint: [update-perf-baseline:wasm] or [update-perf-baseline:ts] (a run mints one engine and keeps the other's entry)"
            exit 1
          fi
          case "$1" in
            ts) project=chromium ;;
            wasm) project=chromium-wasm ;;
            *) echo "::error::unknown engine \"$1\""; exit 1 ;;
          esac
          case "$passes" in
            [1-9] | 1[0-9] | 20) ;;
            *) echo "::error::passes must be a whole number from 1 to 20; got \"$passes\""; exit 1 ;;
          esac
          echo "engine=$1" >> "$GITHUB_OUTPUT"
          echo "passes=$passes" >> "$GITHUB_OUTPUT"
          echo "project=$project" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pin
        run: |
          ver=$(node -e "const l=require('./package-lock.json');const p=l.packages&&l.packages['node_modules/playwright'];process.stdout.write((p&&p.version)||require('./package.json').devDependencies.playwright.replace(/[^0-9.]/g,''))")
          echo "image=mcr.microsoft.com/playwright:v${ver}-jammy" >> "$GITHUB_OUTPUT"

  # The Rust engine's WASM package is build output, not checked in. Restore it
  # from the Actions cache (or build and cache it) for the branch tip the jobs
  # below check out, and hand it to them: their container has no Rust toolchain.
  engine-wasm:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[update-perf-baseline')
    runs-on: ubuntu-latest
    # A cache miss compiles the crate (a few minutes); anything near this is a hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - uses: ./.github/actions/engine-wasm
        with:
          artifact-name: engine-wasm

  update:
    needs: [resolve-image, engine-wasm]
    runs-on: ubuntu-latest
    # Up to 20 passes of a few minutes each in the container.
    timeout-minutes: 90
    # Earns write: it pushes the refreshed baseline. The write token is only
    # ever exposed to the credentialed push step below, never to the steps
    # that execute branch code (see persist-credentials on the checkout).
    permissions:
      contents: write
    container:
      image: ${{ needs.resolve-image.outputs.image }}

    steps:
      # persist-credentials: false keeps the token off disk: this job runs
      # whatever the branch contains (npm ci, the build, Playwright), and a
      # malicious dependency postinstall must not be able to read a write
      # token. checkout v6 and later keep a persisted token in a RUNNER_TEMP
      # credentials file referenced by includeIf.gitdir rather than inline in
      # .git/config, so an audit should read that file, not the config. Same pattern
      # screenshot-capture.yml documents; the push step below authenticates
      # explicitly instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - uses: ./.github/actions/engine-wasm-download
        with:
          artifact-name: engine-wasm

      # A tooling build: the perf harness drives the app through `window.game`,
      # which only VC_TOOLING=1 builds publish (production builds compile it
      # away).
      - name: Build
        run: npm run build
        env:
          VC_TOOLING: "1"

      # Only the named engine's project runs. Each pass records its
      # measurement in perf-passes/ and leaves the baseline file alone.
      - name: Measure the engine
        run: npm run perf:capture -- --project="$PROJECT" --repeat-each="$PASSES"
        env:
          PROJECT: ${{ needs.resolve-image.outputs.project }}
          PASSES: ${{ needs.resolve-image.outputs.passes }}
          PERF_PASSES_DIR: perf-passes

      - name: Mint the entry from the passes
        run: npx tsx scripts/perf-baseline-mint.ts "$ENGINE" perf-passes "$PASSES"
        env:
          ENGINE: ${{ needs.resolve-image.outputs.engine }}
          PASSES: ${{ needs.resolve-image.outputs.passes }}

      - name: Keep the passes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-passes-${{ needs.resolve-image.outputs.engine }}
          path: perf-passes/
          if-no-files-found: warn

      - name: Commit refreshed baseline
        id: commit
        env:
          ENGINE: ${{ needs.resolve-image.outputs.engine }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/perf/baseline.json
          if git diff --cached --quiet; then
            echo "Perf baseline already matches this environment, nothing to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update the $ENGINE perf baseline from CI"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # The only step whose commands receive the write token, and every
      # credentialed git call runs in a PRISTINE throwaway repo with global and
      # system git config disabled. The steps above ran branch code (npm ci,
      # the build, Playwright) with no token on disk (persist-credentials:
      # false), but that code could still have planted hostile git state in
      # the workspace or HOME (insteadOf rewrites, core.fsmonitor, a pre-push
      # hook), so no credentialed git may run against the workspace either.
      # The one command that reads the workspace (the local fetch) runs with
      # the token stripped from its environment. The token rides an explicit
      # per-invocation URL derived from GITHUB_SERVER_URL, never lands in any
      # config file, and the runner masks it in logs.
      - name: Push refreshed baseline
        if: steps.commit.outputs.committed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null
          remote="https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          pushdir="$(mktemp -d)"
          git init -q "$pushdir"
          env -u GITHUB_TOKEN git -C "$pushdir" -c safe.directory='*' fetch -q "$GITHUB_WORKSPACE" HEAD
          git -C "$pushdir" checkout -q FETCH_HEAD
          for attempt in 1 2 3 4 5; do
            if git -C "$pushdir" push "$remote" "HEAD:refs/heads/${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push rejected, rebasing on the remote and retrying ($attempt)"
            git -C "$pushdir" fetch "$remote" "${GITHUB_REF_NAME}"
            git -C "$pushdir" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" rebase FETCH_HEAD
          done
          echo "could not push refreshed baseline after retries" >&2
          exit 1
