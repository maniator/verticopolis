name: Help site

# Builds the player help site (help-site/, a Starlight site at /help) on a pull
# request that touches it or anything it reads, so a broken page, a bad link in
# the side menu or a build error fails here first. The site itself ships with
# every app deploy: scripts/vercel-build.sh builds it into dist/help/ after the
# game, so this workflow publishes nothing.
on:
  pull_request:
    paths:
      - "help-site/**"
      - "docs/engine-site/src/styles/**"
      - "docs/screenshots/**"
      - "src/styles/retro-tokens.css"
      - "src/public/favicon.png"
      - "src/public/icon-1024x1024.png"
      - "src/ui/fromGame.ts"
      - "src/telemetry.ts"
      - "src/analytics*.ts"
      - "package.json"
      - ".github/workflows/help-site.yml"

permissions:
  contents: read

concurrency:
  group: help-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: help-site (build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The header imports a few game modules, which need the game's own
      # packages; the site has its own npm project beside them.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            help-site/package-lock.json

      - name: Game dependencies
        run: npm ci --no-audit --no-fund

      - name: Site dependencies
        run: npm ci --prefix help-site --no-audit --no-fund

      - name: Build the site
        run: npm run build --prefix help-site

      - name: Check the pages are there
        run: |
          for page in index getting-started going-further classic-vs-modern phones keyboard privacy; do
            file="dist/help/index.html"
            [ "$page" = index ] || file="dist/help/$page/index.html"
            test -s "$file" || { echo "::error::missing $file"; exit 1; }
          done
