name: Update visual baselines

# Regenerates the visual.spec.ts screenshot baselines INSIDE the pinned
# Playwright Docker image, the same renderer the e2e visual gate (test.yml)
# and the docs-screenshot generator run in, so every Playwright-rendered pixel
# in the repo comes from ONE Chromium build (glyph and canvas rasterization
# differ across builds, so a locally-minted baseline never binds). Trigger it
# by pushing so that the HEAD commit's message
# contains "[update-baselines]" (only the head commit of the push is
# checked); the refreshed snapshots come back as a bot commit on the same
# branch. Review that commit's image diff like code, it IS the blessing of
# a new visual truth.
#
# The bot pushes with GITHUB_TOKEN, which never triggers workflows, so the
# baseline commit itself gets no CI run, push (or rebase) once more after
# pulling it to get a green check on the final head.

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

# Serialize this workflow's own runs on a ref: a bot commit to the branch must
# never race another. One group + cancel-in-progress:false serializes them (the
# second queues behind the first); the second then checks out the first's commit
# (ref below) and fast-forwards. cancel-in-progress is false so a queued mint is
# never dropped. (This group was historically shared with update-screenshots.yml,
# which also committed here; that workflow has been retired.)
concurrency:
  group: regen-ci-artifacts-${{ github.ref }}
  cancel-in-progress: false

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

# Default read-only; only the update job (which pushes the refreshed
# baselines) requests the narrow write it needs.
permissions:
  contents: read

jobs:
  # Pin the container to the repo's Playwright version so baselines are minted
  # against the EXACT Chromium the e2e gate (test.yml) compares with, the two
  # must share a renderer or every baseline drifts. (container.image is fixed
  # before steps run, so the tag comes from this prior job's output.)
  resolve-image:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[update-baselines]')
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.pin.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: pin
        run: |
          ver=$(node -e "const l=require('./package-lock.json');const p=l.packages&&l.packages['node_modules/playwright'];process.stdout.write((p&&p.version)||require('./package.json').devDependencies.playwright.replace(/[^0-9.]/g,''))")
          echo "image=mcr.microsoft.com/playwright:v${ver}-jammy" >> "$GITHUB_OUTPUT"

  update:
    needs: resolve-image
    runs-on: ubuntu-latest
    # Earns write: it pushes the refreshed baselines. The write token is only
    # ever exposed to the credentialed push step below, never to the steps
    # that execute branch code (see persist-credentials on the checkout).
    permissions:
      contents: write
    # Mint INSIDE the pinned Playwright image, the same renderer the visual gate
    # runs in, so a locally-unreachable Chromium build never sets the truth.
    container:
      image: ${{ needs.resolve-image.outputs.image }}

    steps:
      # Check out the branch TIP (not the triggering SHA) with full history: when
      # this run is queued behind the sibling screenshots run, the tip already has
      # that run's commit, so the push here fast-forwards. Full history (depth 0)
      # also lets the rebase-retry below reconcile cleanly if anything did land.
      # persist-credentials: false keeps the token out of .git/config: this job
      # runs whatever the branch contains (npm ci, the build, Playwright), and a
      # malicious dependency postinstall must not be able to read a write token
      # off disk. Same pattern screenshot-capture.yml documents; the push step
      # below authenticates explicitly instead.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      # A container checkout trips git's dubious-ownership guard; mark the tree
      # safe so the later add/commit/push work.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The image ships Node 20; install the repo's pinned Node over it (keeping
      # the image's browsers).
      - name: Use Node.js (from .nvmrc)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Regenerate baselines
        run: npx playwright test e2e/visual.spec.ts --update-snapshots

      - name: Commit refreshed baselines
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "Baselines already match this environment, nothing to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update visual baselines from CI"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # The ONLY step that sees the write token. Everything above ran without
      # credentials (persist-credentials: false), so branch code never had a
      # token to steal; here no branch code runs, only git. The token rides an
      # explicit per-invocation URL, never lands in .git/config, and the runner
      # masks it in logs.
      - name: Push refreshed baselines
        if: steps.commit.outputs.committed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # The sibling screenshots workflow may push concurrently; it touches only
          # docs/screenshots (disjoint from e2e/visual.spec.ts-snapshots), so a
          # rejected push just needs a rebase over its commit, then retry.
          for attempt in 1 2 3 4 5; do
            if git push "$remote" "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            echo "push rejected, rebasing on the remote and retrying ($attempt)"
            git pull --rebase "$remote" "${GITHUB_REF_NAME}"
          done
          echo "could not push refreshed baselines after retries" >&2
          exit 1
