name: Docs preview

# Publishes a preview of the engine docs for each open pull request that
# changes them, at docs.verticopolis.com/pr-preview/pr-<number>/, comments the
# link on the pull request, and removes the preview when it closes.
#
# Engine docs (engine-docs.yml) builds the site on every pull request that
# changes a page, the site, or anything the Rust API reference comes from (the
# engine's sources and Cargo.toml), under that pull request's preview path.
# When that build passes, this workflow stores it with the live docs on the
# docs-pages branch and deploys (docs-pages-publish.yml).
#
# The build runs the pull request's code with a read-only token; this
# workflow runs from main, takes only the built files, and publishes them
# under the pull request's own path. A pull request from a fork gets no
# preview, because its pages would go out on the project's domain.
on:
  workflow_run:
    workflows: ["Engine docs"]
    types: [completed]
  # The same paths as Engine docs builds a pull request for.
  pull_request_target:
    types: [closed]
    paths:
      - "docs/engine-site/**"
      - "src/styles/retro-tokens.css"
      - "src/public/favicon.png"
      - "src/public/icon-1024x1024.png"
      - "packages/verticopolis-engine/README.md"
      - "engine-rs/CRATE_README.md"
      - "engine-rs/API.md"
      - "engine-rs/CHANGELOG.md"
      - "engine-rs/Cargo.toml"
      - "engine-rs/src/**"
      - "conformance/README.md"
      - ".github/workflows/engine-docs.yml"

permissions: {}

# One run per pull request at a time, so an older build that finishes storing
# late cannot replace a newer one; a newer run replaces a queued one. Runs for
# main's own docs builds publish nothing and get a group each.
concurrency:
  group: docs-preview-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    name: docs-preview (publish)
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0] != null
    uses: ./.github/workflows/docs-pages-publish.yml
    with:
      slot: pr-preview/pr-${{ github.event.workflow_run.pull_requests[0].number }}
      artifact: engine-docs-site
      run-id: ${{ github.event.workflow_run.id }}
    permissions:
      contents: write
      actions: read
      pull-requests: read
      pages: write
      id-token: write

  # A closed pull request's preview goes. Every store also drops previews of
  # closed pull requests, so one this misses goes with the next deploy.
  remove:
    name: docs-preview (remove)
    if: ${{ github.event_name == 'pull_request_target' }}
    uses: ./.github/workflows/docs-pages-publish.yml
    with:
      slot: pr-preview/pr-${{ github.event.pull_request.number }}
    permissions:
      contents: write
      actions: read
      pull-requests: read
      pages: write
      id-token: write

  # One comment per pull request, edited in place, so a new build does not
  # notify anyone again.
  comment:
    name: docs-preview (comment)
    needs: [publish, remove]
    if: ${{ !cancelled() && (needs.publish.result == 'success' || needs.remove.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Comment the preview link
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          PUBLISHED: ${{ needs.publish.result == 'success' }}
        run: |
          set -euo pipefail
          marker='<!-- docs-preview -->'
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)
          if [ "$PUBLISHED" = true ]; then
            # A pull request that closed while it built has no preview left.
            [ "$(gh pr view "$PR" --repo "$REPO" --json state --jq .state)" = OPEN ] || exit 0
            body="$marker
          **Docs preview:** https://docs.verticopolis.com/pr-preview/pr-$PR/

          Built from $SHA. It updates when a push changes the docs or the engine's sources, and it goes away when this pull request closes."
          else
            # Nothing to say on a pull request that never had a preview.
            [ -n "$id" ] || exit 0
            body="$marker
          The docs preview for this pull request was removed when it closed."
          fi
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi
