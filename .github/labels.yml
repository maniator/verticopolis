# Label taxonomy for Verticopolis — the human-readable list of repo labels.
#
# To apply it, run the "Sync labels" workflow (.github/workflows/labels.yml):
#   Actions → Sync labels → Run workflow (from the default branch).
# It's manual (workflow_dispatch) — there is no automatic on-push sync. The
# workflow mirrors the list below as plain `gh label create` commands; when you
# change a label here, change it there too. As a manual alternative without the
# workflow, the equivalent `gh` commands are also at the bottom of this file.
#
# Colors are quoted strings on purpose: an unquoted value like 5319e7 would be
# parsed as a float (scientific notation) by a YAML reader and corrupt the color.
#
# Axes:
#   type        — what kind of thing the issue is (mutually exclusive-ish)
#   mode        — which game mode it touches (Classic = 1994-faithful, Modern = opt-in layer)
#   priority    - the do-first order (P1 work next, P2 when you next touch the
#                 area, P3 low or gated); mirrors the backlog row's Priority
#   state       — where it is in triage
#   area        - which subsystem it touches (an issue may carry more than one)
#   contributor — signals aimed at people looking for something to work on
#
# Adding AREA labels:
#   Add a new area label only once a subsystem has ~3+ open issues, so the
#   tracker never carries empty labels or naming drift (e.g. "elevator" vs
#   "elevators" vs "lifts"). When you do, add it here first. The first set
#   below was added on 2026-10-15, when every open issue was sorted into them.

labels:
  # --- type ---
  - name: bug
    color: "d73a4a"
    description: Something isn't working
  - name: enhancement
    color: "a2eeef"
    description: New feature or request
  - name: parity
    color: "231367"
    description: Diverges from the 1994 SimTower original
  - name: security
    color: "b60205"
    description: Security-relevant; triaged from a private report
  - name: documentation
    color: "0075ca"
    description: Docs, README, or setup fixes

  # --- mode ---
  - name: classic
    color: "5319e7"
    description: Affects Classic (1994-faithful) towers
  - name: modern
    color: "1d76db"
    description: Affects Modern (opt-in "what the original couldn't do") towers

  # --- state ---
  - name: needs-triage
    color: "fbca04"
    description: Not yet reviewed by a maintainer
  - name: needs-repro
    color: "d4c5f9"
    description: Awaiting a reproduction

  - name: closes with TS removal
    color: "cfd3d7"
    description: Only affects the TypeScript engine fallback; closes when the TypeScript engine is removed in 3.x

  # --- priority ---
  - name: P1
    color: "e60000"
    description: "Priority 1: work next"
  - name: P2
    color: "ff8c00"
    description: "Priority 2: do when you next touch the area"
  - name: P3
    color: "b8e600"
    description: "Priority 3: low, gated, watch-only or awaiting a spec"

  # --- area ---
  - name: engine
    color: "c5def5"
    description: "The TypeScript simulation: tenants, demand, stars, events"
  - name: engine-rs
    color: "c5def5"
    description: "The Rust engine crate, its binding and the conformance lock"
  - name: wasm
    color: "c5def5"
    description: "The web's WASM host and worker, and the 3.0.0 cutover"
  - name: economy
    color: "c5def5"
    description: "Rent, fees, prices, maintenance and money"
  - name: transport
    color: "c5def5"
    description: "Elevators, stairs, escalators, walkways and routing"
  - name: render
    color: "c5def5"
    description: "Sprites, art, canvas drawing and visual effects"
  - name: ui
    color: "c5def5"
    description: "Dialogs, panels, input, toasts and the build palette"
  - name: accessibility
    color: "c5def5"
    description: "Screen readers, keyboard navigation and other barriers"
  - name: audio
    color: "c5def5"
    description: "Sound effects, music and the audio engine"
  - name: analytics
    color: "c5def5"
    description: "Product analytics, telemetry and the analytics report"
  - name: save-load
    color: "c5def5"
    description: "Saves, autosave, stashes, migrations and .vctower files"
  - name: tdt
    color: "c5def5"
    description: "1994 TDT import and export"
  - name: pwa
    color: "c5def5"
    description: "Install, offline, service worker and the update flow"
  - name: tooling
    color: "c5def5"
    description: "CI, tests, screenshots, perf scripts and agent scaffolding"

  # --- contributor ---
  - name: good first issue
    color: "7057ff"
    description: Good entry point for newcomers
  - name: help wanted
    color: "008672"
    description: Maintainer would welcome help on this

# Manual alternative to the Sync labels workflow (safe to re-run; --force updates
# an existing label). Run once from a machine with the gh CLI authenticated:
#
#   gh label create bug           -c d73a4a -d "Something isn't working" --force
#   gh label create enhancement   -c a2eeef -d "New feature or request" --force
#   gh label create parity        -c 231367 -d "Diverges from the 1994 SimTower original" --force
