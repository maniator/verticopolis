# Label taxonomy for Verticopolis — the source of truth for repo labels.
#
# This manifest is documentation, not automation: there is deliberately no
# label-sync workflow. To apply it, a maintainer runs the `gh label create`
# commands below once (see the block at the bottom of this file).
#
# Axes:
#   type        — what kind of thing the issue is (mutually exclusive-ish)
#   mode        — which game mode it touches (Classic = 1994-faithful, Modern = opt-in layer)
#   state       — where it is in triage
#   contributor — signals aimed at people looking for something to work on
#
# Adding AREA labels (engine, render, audio, economy, transport, pwa, save-load):
#   Don't create these up front. Add an area label only once a subsystem has
#   ~3+ open issues, so the tracker never carries empty labels or naming drift
#   (e.g. "elevator" vs "elevators" vs "lifts"). When you do, add it here first.

labels:
  # --- type ---
  - name: bug
    color: d73a4a
    description: Something isn't working
  - name: enhancement
    color: a2eeef
    description: New feature or request
  - name: parity
    color: "231367"
    description: Diverges from the 1994 SimTower original
  - name: security
    color: b60205
    description: Security-relevant; triaged from a private report
  - name: documentation
    color: 0075ca
    description: Docs, README, or setup fixes

  # --- mode ---
  - name: classic
    color: 5319e7
    description: Affects Classic (1994-faithful) towers
  - name: modern
    color: 1d76db
    description: Affects Modern (opt-in "what the original couldn't do") towers

  # --- state ---
  - name: needs-triage
    color: fbca04
    description: Not yet reviewed by a maintainer
  - name: needs-repro
    color: d4c5f9
    description: Awaiting a reproduction

  # --- contributor ---
  - name: good first issue
    color: 7057ff
    description: Good entry point for newcomers
  - name: help wanted
    color: "008672"
    description: Maintainer would welcome help on this

# One-time setup (safe to re-run; `gh label create` is idempotent with --force):
#
#   gh label create security      -c b60205 -d "Security-relevant; triaged from a private report" --force
#   gh label create documentation -c 0075ca -d "Docs, README, or setup fixes" --force
#   gh label create classic       -c 5319e7 -d "Affects Classic (1994-faithful) towers" --force
#   gh label create modern        -c 1d76db -d "Affects Modern (opt-in) towers" --force
#   gh label create needs-triage  -c fbca04 -d "Not yet reviewed by a maintainer" --force
#   gh label create needs-repro   -c d4c5f9 -d "Awaiting a reproduction" --force
#   gh label create "good first issue" -c 7057ff -d "Good entry point for newcomers" --force
#   gh label create "help wanted" -c 008672 -d "Maintainer would welcome help on this" --force
#   gh label edit parity          -c 231367 -d "Diverges from the 1994 SimTower original"
